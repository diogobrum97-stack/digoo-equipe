// Decodifica o timestamp embutido no ID gerado pelo push() do Firebase,
// usado como fallback pra tarefas antigas que não têm createdAt salvo.
function decodePushId(id){
  const PUSH_CHARS = "-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz";
  if(!id || id.length<8) return null;
  let ts = 0;
  for(let i=0;i<8;i++){
    const idx = PUSH_CHARS.indexOf(id[i]);
    if(idx<0) return null;
    ts = ts*64 + idx;
  }
  return ts;
}
function taskCreatedAt(task){
  if(task.createdAt) return task.createdAt;
  const decoded = task.id ? decodePushId(task.id) : null;
  return decoded || null;
}
function taskOverdueLabel(task){
  if(!task || task.done) return null;
  const budgetH = BUDGET_HORAS[task.prio];
  if(!budgetH) return null;
  const createdAt = taskCreatedAt(task);
  if(!createdAt) return null;
  const elapsedH = (Date.now()-createdAt)/3600000;
  if(elapsedH <= budgetH) return null;
  return elapsedH < 24 ? `ATRASADA HÁ ${Math.round(elapsedH)}H` : `ATRASADA HÁ ${Math.round(elapsedH/24)}D`;
}
function overdueBadgeHtml(task){
  const label = taskOverdueLabel(task);

}

    seenNotices[id]=true;noticesChanged=true;
  });

  window._prevNotices={...(d.notices||{})};
  const seenMsgs=JSON.parse(localStorage.getItem("digoo_seen_msgs")||"{}");
  let seenMsgsChanged=false;
  Object.entries(d.messages||{}).filter(([,m])=>m!=null).forEach(([id,msg])=>{
    if(!seenMsgs[id]&&msg.recipient===currentUser&&Object.keys(window._prevMsgs||{}).length>0)
      sendNotif("Digoo · Nova Mensagem",`${msg.from}: ${msg.text}`,themeColor(msg.from));
    seenMsgs[id]=true;seenMsgsChanged=true;
  });
  if(seenMsgsChanged)localStorage.setItem("digoo_seen_msgs",JSON.stringify(seenMsgs));
  window._prevMsgs={...(d.messages||{})};
  Object.entries(d.tasks).filter(([,t])=>t!=null).forEach(([id,task])=>{
    const prev=prevTasks[id];
    if(prev&&!prev.done&&task.done&&task.member!=="Diogo"){
      completionAlerts[id]={member:task.member,text:task.text};
      set(ref(db,`/flashes/Diogo`),{ts:Date.now(),msg:`${task.member} concluiu uma tarefa!`});
      if(currentUser==="Diogo")sendNotif("Digoo · Tarefa Concluída",`${task.member} concluiu: ${task.text}`,themeColor("Diogo"));
    }
  });
  Object.entries(d.flashes).forEach(([member,val])=>{
    if(val!=null){
      const wasFlashing=flashQueue[member];flashQueue[member]=true;
      if(!wasFlashing&&val.msg){startTabFlash(val.msg,themeColor(member));if(currentUser===member)sendNotif("Digoo · Nova Tarefa",val.msg,themeColor(member));}
    }
  });
  Object.keys(flashQueue).forEach(m=>{if(!d.flashes[m])delete flashQueue[m];});
  const prevBlingToken = state?.bling_token?.access_token;
  const prevFilialToken = state?.ml_token_filial?.access_token;
  prevTasks={...d.tasks};state=d;
  // Se o token Bling mudou e tinha erro, limpar e tentar buscar de novo
  if(d.bling_token?.access_token && d.bling_token.access_token !== prevBlingToken && estoqueBlingErro) {
    estoqueBlingErro = null;
    estoqueBlingData = null;
    estoqueBlingLoading = false;
    fetchBlingProdutos();

  // Se o token ML Filial mudou, resetar estoque automático pra rebuscar com vendas

    if(!dashData && !dashLoading) window._fetchDashboard();
  }
  if(!cmpSalvando)render();
  if(document.getElementById("ideias-modal-overlay")) renderIdeiasLista();

let dashData = null;

let dashExperiencia = null;
async function fetchExperiencia() {
  try {
    const token = state.ml_token_filial?.access_token;
    if(!token) return;
    const res = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?token=${token}&action=experiencia`);
    const data = await res.json();
    if(data.ok) { dashExperiencia = data; render(); }
  } catch(e) { console.warn("Experiência de compra:", e.message); }
}

window._fetchDashboard = async function fetchDashboard() {
  if(dashLoading) return;
  dashLoading = true;
  const loadingTimeout = setTimeout(() => { dashLoading = false; }, 30000);
  render();
  try {
    const tokenFilial = state.ml_token_filial?.access_token;
    const tokenMatriz = state.ml_token?.access_token;
    if(!tokenFilial) throw new Error("Token ML Filial não conectado");
    const hoje = new Date();
    const diaAtualMes = hoje.getDate();

    // Buscar Filial e Matriz em paralelo
    const fetchPromises = [
      fetch(`${VERCEL_BACKEND}/api/ml-vendas?token=${tokenFilial}&today=1`).then(r=>r.json()),
      fetch(`${VERCEL_BACKEND}/api/ml-vendas?token=${tokenFilial}&days=${diaAtualMes}`).then(r=>r.json()),
    ];
    if(tokenMatriz) {
      fetchPromises.push(fetch(`${VERCEL_BACKEND}/api/ml-vendas?token=${tokenMatriz}&today=1`).then(r=>r.json()).catch(()=>null));
      fetchPromises.push(fetch(`${VERCEL_BACKEND}/api/ml-vendas?token=${tokenMatriz}&days=${diaAtualMes}`).then(r=>r.json()).catch(()=>null));
    }
    const [resHoje, resMes, resHojeMatriz, resMesMatriz] = await Promise.all(fetchPromises);

    const minutosDia = 24 * 60;
    const minutosPassados = hoje.getHours() * 60 + hoje.getMinutes();
    const percDia = minutosPassados / minutosDia;
    const fatHoje = resHoje.summary?.totalRevenue || 0;
    const projecaoDia = percDia > 0 ? fatHoje / percDia : 0;
    const fatHojeMatriz = resHojeMatriz?.summary?.totalRevenue || 0;
    const projecaoMatriz = percDia > 0 ? fatHojeMatriz / percDia : 0;

    dashData = {
      fatHoje, projecaoDia,
      fatMes: resMes.summary?.totalRevenue || 0,
      pedidosMes: resMes.summary?.totalOrders || 0,
      percDia: Math.round(percDia * 100),
      hora: hoje.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}),
      top5hoje: [...(resHoje.topSellers || [])].sort((a,b)=>(b.revenue||0)-(a.revenue||0)).slice(0,5),
      top10mes: [...(resMes.topSellers || [])].sort((a,b)=>(b.revenue||0)-(a.revenue||0)).slice(0,10),
      // Matriz
      matriz: tokenMatriz ? {
        fatHoje: fatHojeMatriz,
        projecaoDia: projecaoMatriz,
        fatMes: resMesMatriz?.summary?.totalRevenue || 0,
        pedidosMes: resMesMatriz?.summary?.totalOrders || 0,
        top5hoje: [...(resHojeMatriz?.topSellers || [])].sort((a,b)=>(b.revenue||0)-(a.revenue||0)).slice(0,5),
      } : null,
      _fetchedAt: Date.now(),
    };
    // Expor dados para o claude-chat.js (escopo externo)
    window._dashData = dashData;
    // Buscar experiência em background (mais lento — não bloqueia)
    if(!dashExperiencia) fetchExperiencia();
  } catch(e) {
    dashData = { erro: e.message, _fetchedAt: Date.now() }; // _fetchedAt evita retry imediato
  }
  clearTimeout(loadingTimeout);
  dashLoading = false;
  render();
}

function extrairItemId(texto) {
  if (!texto) return "";
  let t = texto.trim();
  // Aceita ID direto (MLB123456789), link completo, ou só os números
  const matchId = t.match(/MLB-?\d{9,}/i);
  if (matchId) return matchId[0].replace("-", "").toUpperCase();
  // Link com padrão diferente, ex: .../p/MLB123456789 ou .../MLB-1234-5678...
  const matchNum = t.match(/(\d[\d-]{8,})/);
  if (matchNum) {
    const soDigitos = matchNum[1].replace(/-/g, "");
    return "MLB" + soDigitos;
  }
  return t.toUpperCase();
}

// Extrai múltiplos IDs de um texto com várias linhas/itens separados por vírgula
function extrairMultiplosIds(texto) {
  if (!texto) return [];
  const partes = texto.split(/[\n,]+/).map(p => p.trim()).filter(Boolean);
  return partes.map(extrairItemId).filter(Boolean);
}

// Processa a clonagem de um lote de IDs, um por vez
async function buscarLoteClonagem(container) {
  const ids = extrairMultiplosIds(clonarState.itemBusca);
  if (ids.length === 0) return;

  const tokenOrigem = clonarState.contaOrigem === "matriz" ? state.ml_token?.access_token : state.ml_token_filial?.access_token;
  if (!tokenOrigem) {
    clonarState.erro = "Token da conta de origem não encontrado.";
    renderClonarTab(container);
    return;
  }

  // Popula todos os cards desde já, com status "aguardando"
  loteState = {
    rodando: true,
    fase: "busca",
    total: ids.length,
    itens: ids.map(itemId => ({ itemId, status: "aguardando", titulo: "", foto: "", categoria: "", sku: "", quantidade: "", preco: "", motivo: "", novoId: "", permalink: "", item: null })),
  };
  renderClonarTab(container);

  for (let i = 0; i < ids.length; i++) {
    const it = loteState.itens[i];
    it.status = "buscando";
    renderClonarTab(container);

    try {
      const rBusca = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?action=buscar-clone&item_id=${it.itemId}&token=${tokenOrigem}`);
      const dataBusca = await rBusca.json();
      if (!dataBusca.ok) {
        it.status = "erro";
        it.motivo = dataBusca.error || "Não encontrado";
        renderClonarTab(container);
        continue;
      }
      const item = dataBusca.item;
      it.titulo = item.title;
      it.foto = item.pictures?.[0]?.source || "";
      it.categoria = item.category_id;
      it.sku = item.sku || "";
      it.quantidade = item.available_quantity;
      it.preco = item.price;
      it.item = item;
      if (item.has_variations) {
        it.status = "erro";
        it.motivo = "Tem variações — não suportado em lote";
      } else {
        it.status = "encontrado";
      }
    } catch (e) {
      it.status = "erro";
      it.motivo = "Erro de conexão: " + e.message;
    }
    renderClonarTab(container);
  }

  loteState.rodando = false;
  loteState.fase = "revisao";
  renderClonarTab(container);
}

async function confirmarLoteClonagem(container) {
  const tokenDestino = clonarState.contaOrigem === "matriz" ? state.ml_token_filial?.access_token : state.ml_token?.access_token;
  if (!tokenDestino) {
    clonarState.erro = "Token da conta de destino não encontrado.";
    renderClonarTab(container);
    return;
  }

  loteState.rodando = true;
  loteState.fase = "clonando";
  renderClonarTab(container);

  const encontrados = loteState.itens.filter(it => it.status === "encontrado");
  for (const it of encontrados) {
    it.status = "clonando";
    renderClonarTab(container);

    try {
      const rClonar = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?action=clonar`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ item: it.item, tokenDestino }),
      });
      const dataClonar = await rClonar.json();
      if (!dataClonar.ok) {
        it.status = "erro";
        const causas = dataClonar.detalhes || dataClonar.raw?.cause || [];
        const detalheEspecifico = causas.map(c => c.message).filter(Boolean).join(" · ");
        it.motivo = detalheEspecifico || dataClonar.error || "Erro ao clonar";
      } else {
        it.status = "sucesso";
        it.novoId = dataClonar.item_id;
        it.permalink = dataClonar.permalink;
      }
    } catch (e) {
      it.status = "erro";
      it.motivo = "Erro de conexão: " + e.message;
    }
    renderClonarTab(container);
  }

  loteState.rodando = false;
  loteState.fase = "concluido";
  renderClonarTab(container);
}

let perguntasState = { lista: null, carregando: false, erro: null, enviando: {}, _fetchedAt: 0 };

// ═══════════════ Picking & Packing ═══════════════
let pickingState = {
  fila: null,          // lista de pedidos pendentes de envio
  carregando: false,
  erro: null,
  pedidoAtivo: null,   // pedido que está aberto na tela agora (com itens já expandidos)
  abrindoPedido: false,
  bipando: "",         // texto atual do campo de bipagem
  processandoEtiqueta: false,
};

async function fetchPickingFila() {
  pickingState.carregando = true;
  pickingState.erro = null;
  const token = state.ml_token?.access_token;
  if (!token) {
    pickingState.carregando = false;
    pickingState.erro = "Token da Matriz não encontrado. Verifique a conexão ML.";
    return;
  }
  try {
    const r = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?action=picking-fila&token=${token}`);
    const data = await r.json();
    pickingState.carregando = false;
    if (!data.ok) {
      pickingState.erro = data.error || "Erro ao buscar fila de pedidos.";
    } else {
      // Não mostra de novo pedidos que a gente já processou por aqui — mesmo
      // que o ML ainda mostre pendente até o pacote ser despachado fisicamente.
      const jaConcluidos = state.picking_concluidos || {};
      pickingState.fila = (data.fila || []).filter(p => !jaConcluidos[p.order_id]);
    }
  } catch (e) {
    pickingState.carregando = false;
    pickingState.erro = "Erro de conexão ao buscar a fila.";
  }
}

// Busca EAN/kit de um SKU no Bling. Retorna null se não achar ou der erro
// (nesse caso o item cai pra modo "sem EAN confirmado" e aceita bipar o SKU também).
async function buscarProdutoBling(sku) {
  if (!sku) return null;
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30000); // 30s — kits com vários componentes demoram mais (pausa proposital contra rate limit do Bling)
    const r = await fetch(`${VERCEL_BACKEND}/api/bling-produtos?picking=1&sku=${encodeURIComponent(sku)}`, { signal: controller.signal });
    clearTimeout(timeoutId);
    const data = await r.json();
    // Token do Bling expirado (ou não conectado) — sinaliza diferente de "sem EAN mesmo"
    if (r.status === 401 || (data.erro && /expirad|conectad/i.test(data.erro))) {
      return { tokenExpirado: true };
    }
    if (!data.ok || !data.encontrado) return null;
    return data;
  } catch (e) {
    return null; // timeout, erro de rede, ou Bling fora do ar — não trava o picking, só segue sem esse dado
  }
}

// Monta a lista de itens FÍSICOS a bipar pra um pedido — expande kits em componentes.
// Cada linha final tem: sku, nome, ean (pode vir vazio), quantidadeNecessaria, quantidadeBipada.
// Se detectar token do Bling expirado, marca no pickingState pra avisar na tela.
async function montarItensParaBipar(pedido) {
  const linhas = [];
  pickingState.blingTokenExpirado = false;
  for (const item of pedido.itens) {
    const info = await buscarProdutoBling(item.sku);
    if (info && info.tokenExpirado) {
      pickingState.blingTokenExpirado = true;
    }
    if (info && info.isKit && info.componentes.length > 0) {
      info.componentes.forEach(c => {
        linhas.push({
          sku: c.sku || "",
          nome: c.nome || c.sku || "componente sem nome",
          ean: c.ean || "",
          quantidadeNecessaria: (c.quantidade || 1) * item.quantidade,
          quantidadeBipada: 0,
          deKit: item.sku,
        });
      });
    } else {
      linhas.push({
        sku: item.sku,
        nome: item.titulo,
        ean: info?.ean || "",
        quantidadeNecessaria: item.quantidade,
        quantidadeBipada: 0,
        deKit: null,
      });
    }
  }
  return linhas;
}

// Abre um pedido da fila: trava no Firebase (pra outra pessoa não pegar o mesmo),
// expande os itens (incluindo kits), e deixa pronto pra bipar.
// Refresh "à prova de re-render externo" — sempre busca o container ATUAL na
// página, em vez de confiar numa referência guardada antes de um await (que
// pode já ter sido substituída se o app se re-renderizou sozinho nesse meio tempo).
function refreshPickingUI() {
  const brunoC = document.querySelector(".picking-bruno-container");
  if (brunoC) { renderPickingTab(brunoC, "Bruno", true); return; }
  const diogoOperarC = document.querySelector(".picking-diogo-operar-container");
  if (diogoOperarC) { renderPickingTab(diogoOperarC, "Diogo", true); return; }
}

// Atualiza a fila sozinha de tempos em tempos, enquanto a tela de Picking
// estiver visível — não interrompe quem está no meio de uma bipagem, porque
// o pedido aberto (pedidoAtivo) fica em outra parte do estado e não é afetado.
async function checarPickingAuto() {
  const telaAberta = document.querySelector(".picking-bruno-container") || document.querySelector(".picking-diogo-operar-container");
  if (!telaAberta) return;
  if (pickingState.carregando || pickingState.abrindoPedido || pickingState.processandoEtiqueta) return;
  await fetchPickingFila();
  refreshPickingUI();
}
setInterval(checarPickingAuto, 3 * 60 * 1000); // a cada 3 minutos

async function abrirPedidoPicking(pedido, quemAbriu, refreshFn) {
  if (pickingState.abrindoPedido) return;
  pickingState.abrindoPedido = true;
  refreshPickingUI();
  try {
    // Trava o pedido pro operador atual, com timestamp (locks muito antigos são
    // ignorados na exibição, caso alguém feche a aba sem terminar)
    await set(ref(db, `/picking_locks/${pedido.order_id}`), { por: quemAbriu, ts: Date.now() });

    // Limite geral de 40s pra abrir o pedido — se travar em algum lugar
    // (Bling lento, muitos componentes de kit, etc.), mostra erro em vez de
    // ficar preso na tela pra sempre.
    const itens = await Promise.race([
      montarItensParaBipar(pedido),
      new Promise((_, reject) => setTimeout(() => reject(new Error("Demorou demais consultando o Bling. Tente de novo.")), 90000)),
    ]);
    pickingState.pedidoAtivo = { ...pedido, itens_bipagem: itens, operador: quemAbriu };
    pickingState.bipando = "";
  } catch (e) {
    pickingState.erro = "Erro ao abrir o pedido: " + e.message;
    await remove(ref(db, `/picking_locks/${pedido.order_id}`)).catch(() => {});
  }
  pickingState.abrindoPedido = false;
  refreshPickingUI();
}

function fecharPedidoPicking(refreshFn) {
  if (pickingState.pedidoAtivo) {
    remove(ref(db, `/picking_locks/${pickingState.pedidoAtivo.order_id}`));
  }
  pickingState.pedidoAtivo = null;
  pickingState.bipando = "";
  refreshFn();
}

// Processa um código bipado — compara com EAN (se tiver) ou SKU de cada linha ainda incompleta.
// Aceita bater com EAN OU SKU pra não travar o operador se o EAN do Bling não vier preenchido.
// Quando o último item bater, já gera e imprime a etiqueta sozinho — sem precisar clicar em nada.
async function processarBipagem(codigo, refreshFn) {
  const cod = String(codigo || "").trim();
  if (!cod || !pickingState.pedidoAtivo) return;

  const pedido = pickingState.pedidoAtivo;
  const linhas = pedido.itens_bipagem;
  const alvo = linhas.find(l =>
    l.quantidadeBipada < l.quantidadeNecessaria &&
    ((l.ean && l.ean === cod) || (l.sku && l.sku === cod))
  );

  if (alvo) {
    alvo.quantidadeBipada += 1;
    pickingState.erro = null;
  } else {
    pickingState.erro = "Produto errado — esse código não pertence a este pedido (ou já foi bipado o suficiente).";
  }
  pickingState.bipando = "";

  // Registra CADA bipagem (certa ou errada) no histórico — importante pra
  // auditar reclamação de quantidade errada depois, cruzando com câmera.
  push(ref(db, `/picking_historico_bipagem/${pedido.order_id}`), {
    codigo: cod,
    sku: alvo?.sku || null,
    nome: alvo?.nome || null,
    acertou: !!alvo,
    operador: pedido.operador,
    ts: Date.now(),
  });

  if (alvo && pedidoTotalmenteBipado()) {
    // Tudo separado — dispara a etiqueta automaticamente, igual o Bling fazia
    await finalizarPedidoPicking(refreshFn);
    return;
  }
  refreshPickingUI();
}

function pedidoTotalmenteBipado() {
  if (!pickingState.pedidoAtivo) return false;
  return pickingState.pedidoAtivo.itens_bipagem.every(l => l.quantidadeBipada >= l.quantidadeNecessaria);
}

// Gera a etiqueta, salva o registro de concluído, remove a trava, e tira o pedido da fila local.
async function finalizarPedidoPicking(refreshFn) {
  if (!pickingState.pedidoAtivo || pickingState.processandoEtiqueta) return;
  pickingState.processandoEtiqueta = true;
  refreshPickingUI();

  const pedido = pickingState.pedidoAtivo;
  const token = state.ml_token?.access_token;

  try {
    const r = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?action=picking-etiqueta&token=${token}&shipment_ids=${pedido.shipment_id}`);
    const data = await r.json();
    if (!data.ok) {
      pickingState.erro = data.error || "Erro ao gerar a etiqueta.";
      pickingState.processandoEtiqueta = false;
      refreshPickingUI();
      return;
    }

    // Baixa o PDF como arquivo de verdade (não só abre em aba) — é assim que
    // o AutoPrint consegue detectar e imprimir sozinho, do mesmo jeito que já
    // funciona com o Bling. Sem aba nova, então o Tab Closer nem precisa agir.
    try {
      const byteChars = atob(data.pdf_base64);
      const byteNumbers = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `etiqueta_${pedido.order_id}.pdf`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    } catch (e) { /* se o download falhar por algum motivo, a etiqueta ainda foi gerada no ML normalmente */ }

    // Registra como concluído (histórico visível pro Diogo) e remove a trava
    // — inclui a conferência final item a item (esperado x bipado), útil pra
    // investigar reclamação de quantidade errada depois.
    await set(ref(db, `/picking_concluidos/${pedido.order_id}`), {
      titulo: pedido.itens[0]?.titulo || "",
      por: pedido.operador,
      ts: Date.now(),
      itens_final: (pedido.itens_bipagem || []).map(l => ({
        sku: l.sku, nome: l.nome, ean: l.ean || null,
        quantidadeNecessaria: l.quantidadeNecessaria,
        quantidadeBipada: l.quantidadeBipada,
      })),
    });
    await remove(ref(db, `/picking_locks/${pedido.order_id}`));

    // Some da fila local sem precisar buscar tudo de novo
    if (pickingState.fila) {
      pickingState.fila = pickingState.fila.filter(p => p.order_id !== pedido.order_id);
    }
    pickingState.pedidoAtivo = null;
  } catch (e) {
    pickingState.erro = "Erro ao finalizar: " + e.message;
  }
  pickingState.processandoEtiqueta = false;
  refreshPickingUI();
}

// Registra um pedido como concluído SEM passar pela bipagem — usado quando
// o Bruno/Diogo já imprimiu e despachou direto no site do ML, e só precisa
// sincronizar o histórico do nosso sistema (não mexe em nada no ML).
async function marcarPedidoFeitoExterno(pedido, quemSou, refreshFn) {
  try {
    await set(ref(db, `/picking_concluidos/${pedido.order_id}`), {
      titulo: pedido.itens[0]?.titulo || "",
      por: quemSou,
      ts: Date.now(),
      viaExterno: true,
    });
    if (pickingState.fila) {
      pickingState.fila = pickingState.fila.filter(p => p.order_id !== pedido.order_id);
    }
  } catch (e) {
    pickingState.erro = "Erro ao registrar: " + e.message;
  }
  refreshPickingUI();
}

// Renderiza a tela de Picking & Packing dentro de um panel.
// quemSou = "Bruno" ou "Diogo" (define quem fica dono da trava ao abrir um pedido).
// modoOperar = true mostra a tela operacional (fila + bipagem).
function renderPickingTab(panel, quemSou, modoOperar) {
  panel.innerHTML = "";
  const refresh = () => renderPickingTab(panel, quemSou, modoOperar);

  const locks = state.picking_locks || {};
  const agora = Date.now();
  const lockValido = (orderId) => {
    const l = locks[orderId];
    if (!l) return null;
    if (agora - (l.ts || 0) > 20 * 60 * 1000) return null; // trava de +20min sem atividade é ignorada
    return l;
  };

  const wrap = document.createElement("div");
  wrap.style.cssText = "width:100%;font-family:Inter,sans-serif;";

  if (!pickingState.fila && !pickingState.carregando && !pickingState.erro) {
    fetchPickingFila().then(refreshPickingUI);
  }

  const header = document.createElement("div");
  header.style.cssText = "display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;";
  header.innerHTML = `
    <div>
      <div style="font-size:16px;font-weight:700;color:${T.isLight?"#111111":"#ffffff"};">Picking & Packing</div>
      <div style="font-size:11px;color:#666;margin-top:2px;">${pickingState.fila ? `${pickingState.fila.length} pedidos prontos pra separar` : "Carregando fila..."}</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button id="picking-btn-diagnostico" style="background:none;border:1px solid ${T.border};border-radius:6px;padding:7px 14px;color:#666;font-size:11px;cursor:pointer;">🔍 Diagnóstico</button>
      <button id="picking-btn-atualizar" style="background:${T.bg3};border:1px solid ${T.border};border-radius:6px;padding:7px 14px;color:${T.text2};font-size:11px;cursor:pointer;">${pickingState.carregando ? "Buscando..." : "↻ Atualizar"}</button>
    </div>
  `;
  wrap.appendChild(header);

  if (pickingState.erro) {
    const errBox = document.createElement("div");
    errBox.style.cssText = `background:${T.errBg};border:1px solid ${T.errBor};border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:11px;color:${T.errText};white-space:pre-wrap;line-height:1.5;`;
    errBox.textContent = pickingState.erro;
    wrap.appendChild(errBox);
  }

  const row = document.createElement("div");
  row.style.cssText = "display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start;";
  wrap.appendChild(row);

  // ── Coluna esquerda: fila ──
  const colFila = document.createElement("div");
  colFila.style.cssText = `background:${T.card};border:1px solid ${T.border};border-radius:10px;padding:14px;box-shadow:${T.cardShadow};`;
  const filaLista = pickingState.fila || [];
  colFila.innerHTML = `<div style="font-size:11px;color:#888;margin-bottom:10px;">FILA · ${filaLista.length} pedidos</div>`;
  const filaBody = document.createElement("div");
  filaBody.style.cssText = "display:flex;flex-direction:column;gap:8px;max-height:600px;overflow-y:auto;";

  if (filaLista.length === 0 && !pickingState.carregando) {
    filaBody.innerHTML = `<div style="font-size:11px;color:#555;text-align:center;padding:20px 0;">Nenhum pedido pendente ✓</div>`;
  }

  filaLista.forEach(pedido => {
    const ativo = pickingState.pedidoAtivo?.order_id === pedido.order_id;
    const lock = lockValido(pedido.order_id);
    const travadoPorOutro = lock && lock.por !== quemSou;
    const nomeItem = pedido.itens[0]?.titulo || "Pedido";
    const etiquetaImpressa = pedido.substatus === "printed";
    const clicavel = !travadoPorOutro && modoOperar && !etiquetaImpressa;
    const card = document.createElement("div");
    card.style.cssText = `padding:10px 12px;border-radius:8px;cursor:${clicavel ? "pointer" : "default"};background:${ativo ? (T.isLight?"#ffffff":"#1e1e1e") : (T.isLight?"#f2f2f2":"#111")};border:1px solid ${ativo ? T.border : (T.isLight?"#e0e0e0":"#282828")};opacity:${travadoPorOutro ? "0.5" : "1"};`;
    card.innerHTML = `
      <div style="font-size:11px;font-weight:700;color:${T.text};">#${pedido.order_id}</div>
      <div style="font-size:10px;color:${T.text2};margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${nomeItem}</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;">
        <div style="display:inline-block;padding:2px 7px;border-radius:9px;font-size:8px;font-weight:700;background:rgba(59,130,246,0.15);color:#3b82f6;">Enviar hoje</div>
        <div style="display:inline-block;padding:2px 7px;border-radius:9px;font-size:8px;font-weight:700;background:${etiquetaImpressa ? "rgba(16,185,129,0.15)" : "rgba(139,92,246,0.15)"};color:${etiquetaImpressa ? "#10b981" : "#8b5cf6"};">${etiquetaImpressa ? "Etiqueta impressa" : "Etiqueta pronta para imprimir"}</div>
      </div>
      <div style="font-size:9px;color:${T.text3};margin-top:6px;">${travadoPorOutro ? `● sendo separado por ${lock.por}` : (ativo ? "● separando agora" : "na fila")}</div>
      ${etiquetaImpressa && modoOperar ? `<button data-marcar-feito="${pedido.order_id}" style="width:100%;margin-top:8px;padding:6px;border-radius:6px;background:${T.okBg};border:1px solid ${T.okBor};color:#2dce89;font-size:9px;font-weight:600;cursor:pointer;">Marcar como já feito</button>` : ""}
    `;
    if (clicavel) {
      card.onclick = () => { if (!ativo) abrirPedidoPicking(pedido, quemSou, refresh); };
    }
    filaBody.appendChild(card);
    if (etiquetaImpressa && modoOperar) {
      const btnMarcar = card.querySelector(`[data-marcar-feito="${pedido.order_id}"]`);
      if (btnMarcar) {
        btnMarcar.onclick = (e) => {
          e.stopPropagation();
          btnMarcar.disabled = true;
          btnMarcar.textContent = "Registrando...";
          marcarPedidoFeitoExterno(pedido, quemSou, refresh);
        };
      }
    }
  });
  colFila.appendChild(filaBody);
  row.appendChild(colFila);

  // ── Coluna direita: detalhe do pedido ativo, ou instrução ──
  const colDetalhe = document.createElement("div");
  colDetalhe.style.cssText = `background:${T.card};border:1px solid ${T.border};border-radius:10px;padding:18px;min-height:300px;box-shadow:${T.cardShadow};`;

  if (pickingState.abrindoPedido) {
    colDetalhe.innerHTML = `<div style="font-size:12px;color:#555;text-align:center;padding:60px 0;">Abrindo pedido e consultando o Bling...</div>`;
  } else if (!pickingState.pedidoAtivo) {
    colDetalhe.innerHTML = `<div style="font-size:12px;color:#555;text-align:center;padding:60px 0;">Clique num pedido da fila pra começar a separar.</div>`;
  } else {
    const pedido = pickingState.pedidoAtivo;
    const temKit = pedido.itens_bipagem.some(l => l.deKit);
    const todosBipados = pedidoTotalmenteBipado();

    const cabecalho = document.createElement("div");
    cabecalho.style.cssText = "display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;";
    cabecalho.innerHTML = `
      <div>
        <div style="font-size:15px;font-weight:700;color:#fff;">Pedido #${pedido.order_id}</div>
        <div style="font-size:11px;color:#888;margin-top:2px;">${pedido.itens[0]?.titulo || ""}</div>
      </div>
      ${temKit ? `<div style="padding:4px 10px;border-radius:11px;background:${T.infoBg};border:1px solid ${T.infoBor};color:#5eb3f0;font-size:10px;font-weight:600;">📦 KIT</div>` : ""}
    `;
    colDetalhe.appendChild(cabecalho);

    const btnFechar = document.createElement("button");
    btnFechar.textContent = "← Voltar pra fila";
    btnFechar.style.cssText = "background:none;border:none;color:#666;font-size:11px;cursor:pointer;margin-bottom:14px;padding:0;";
    btnFechar.onclick = () => fecharPedidoPicking(refresh);
    colDetalhe.appendChild(btnFechar);

    if (pickingState.blingTokenExpirado) {
      const avisoBling = document.createElement("div");
      avisoBling.style.cssText = `display:flex;align-items:center;justify-content:space-between;gap:12px;background:${T.errBg};border:1px solid ${T.errBor};border-radius:8px;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap;`;
      avisoBling.innerHTML = `
        <div style="font-size:11px;color:#f0a060;line-height:1.4;">O Bling está desconectado ou o token expirou — não foi possível buscar EAN/kit desse pedido. Os itens abaixo caíram pra bipagem por SKU, sem conferência automática de kit.</div>
        <button id="picking-btn-reconectar-bling" style="background:#5e72e4;border:none;border-radius:6px;padding:7px 14px;color:#000;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;">Reconectar Bling</button>
      `;
      colDetalhe.appendChild(avisoBling);
    }

    const listaItens = document.createElement("div");
    listaItens.style.cssText = "margin-bottom:16px;";
    pedido.itens_bipagem.forEach(l => {
      const completo = l.quantidadeBipada >= l.quantidadeNecessaria;
      const linha = document.createElement("div");
      linha.style.cssText = `display:flex;align-items:center;gap:10px;padding:10px 12px;background:${T.isLight?"#f2f2f2":"#111111"};border:1px solid ${completo ? T.okBor : T.border};border-radius:8px;margin-bottom:6px;`;
      linha.innerHTML = `
        <div style="flex:1;min-width:0;">
          <div style="font-size:12px;color:#fff;">${l.nome}</div>
          <div style="font-size:10px;color:#666;margin-top:2px;">${l.sku}${l.ean ? ` · EAN ${l.ean}` : " · sem EAN cadastrado, bipa pelo SKU"}</div>
        </div>
        <div style="font-size:11px;font-weight:700;color:${completo ? "#2dce89" : "#ffffff"};flex-shrink:0;">${l.quantidadeBipada}/${l.quantidadeNecessaria}</div>
        ${completo ? `<div style="width:24px;height:24px;border-radius:50%;background:#2dce89;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><span style="color:#000;font-size:12px;font-weight:700;">✓</span></div>` : `<div style="width:24px;height:24px;border-radius:50%;border:2px solid #444;flex-shrink:0;"></div>`}
      `;
      listaItens.appendChild(linha);
    });
    colDetalhe.appendChild(listaItens);

    if (!todosBipados) {
      const bipInput = document.createElement("input");
      bipInput.id = "picking-input-bip";
      bipInput.type = "text";
      bipInput.placeholder = "Bipar código de barras...";
      bipInput.autocomplete = "off";
      bipInput.style.cssText = "width:100%;background:"+T.bg2+";border:2px solid "+T.text+";border-radius:8px;padding:12px 14px;color:"+T.text+";font-size:13px;font-family:Inter,sans-serif;outline:none;box-sizing:border-box;margin-bottom:12px;";
      bipInput.value = pickingState.bipando;
      bipInput.oninput = (e) => { pickingState.bipando = e.target.value; };
      bipInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); processarBipagem(bipInput.value, refresh); }
      });
      colDetalhe.appendChild(bipInput);
    } else {
      const btnFinalizar = document.createElement("button");
      btnFinalizar.disabled = pickingState.processandoEtiqueta;
      btnFinalizar.style.cssText = `width:100%;padding:14px;border-radius:8px;background:${pickingState.processandoEtiqueta ? "#333" : "#ffffff"};border:none;color:${pickingState.processandoEtiqueta ? "#888" : "#000"};font-size:13px;font-weight:700;cursor:${pickingState.processandoEtiqueta ? "default" : "pointer"};`;
      btnFinalizar.textContent = pickingState.processandoEtiqueta ? "Gerando etiqueta..." : "🖨 Tudo separado — gerar e imprimir etiqueta";
      btnFinalizar.onclick = () => finalizarPedidoPicking(refresh);
      colDetalhe.appendChild(btnFinalizar);
    }
  }
  row.appendChild(colDetalhe);

  panel.appendChild(wrap);

  const btnAtualizar = panel.querySelector("#picking-btn-atualizar");
  if (btnAtualizar) btnAtualizar.onclick = async () => { await fetchPickingFila(); refreshPickingUI(); };

  const btnReconectarBling = panel.querySelector("#picking-btn-reconectar-bling");
  if (btnReconectarBling) btnReconectarBling.onclick = () => {
    window.open("https://digoo-backend.vercel.app/api/bling-auth", "_blank");
  };

  const btnDiag = panel.querySelector("#picking-btn-diagnostico");
  if (btnDiag) btnDiag.onclick = async () => {
    const token = state.ml_token?.access_token;
    if (!token) { pickingState.diagnostico = "Token da Matriz não encontrado."; refreshPickingUI(); return; }
    pickingState.diagnostico = "Consultando...";
    refreshPickingUI();
    try {
      const r = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?action=picking-fila&token=${token}&debug=1`);
      const data = await r.json();
      const d = data.debug || {};
      let msg = `ok: ${data.ok}\nerro: ${data.error || "-"}\nPedidos pagos (15 dias): ${d.totalPedidosEncontrados ?? "?"}\nConsultados com envio: ${d.totalComEnvioConsultado ?? "?"}\nready_to_ship + não Full: ${(d.statusEncontrados || []).length}\n\n`;
      msg += JSON.stringify(d.statusEncontrados || [], null, 2);
      pickingState.diagnostico = msg;
      console.log("Diagnóstico picking:", data);
    } catch (e) {
      pickingState.diagnostico = "Erro no diagnóstico: " + e.message;
    }
    refreshPickingUI();
  };

  if (pickingState.diagnostico) {
    const diagBox = document.createElement("div");
    diagBox.style.cssText = `background:${T.infoBg};border:1px solid ${T.infoBor};border-radius:8px;padding:12px 14px;margin-top:16px;font-size:11px;color:${T.infoTxt};white-space:pre-wrap;line-height:1.6;font-family:Inter,sans-serif;max-height:300px;overflow-y:auto;`;
    diagBox.textContent = pickingState.diagnostico;
    panel.appendChild(diagBox);
  }

  // Mantém o foco no campo de bipagem sempre que ele existir — leitor de
  // código de barras funciona como teclado, precisa do campo em foco.
  const bipInputAtivo = panel.querySelector("#picking-input-bip");
  if (bipInputAtivo) {
    bipInputAtivo.focus();
    const posCursor = bipInputAtivo.value.length;
    bipInputAtivo.setSelectionRange(posCursor, posCursor);
  }
}

// Tela de acompanhamento (visão do Diogo) — resumo do dia, o que está
// rolando agora em tempo real, e histórico dos últimos concluídos.
// Histórico de bipagem — filtro por dia, mostra horário da etiqueta (pra
// cruzar com câmera) e o detalhe item a item de cada pedido já concluído,
// útil pra investigar reclamação de quantidade errada.
function renderPickingHistorico(panel) {
  panel.innerHTML = "";
  if (window._pickingHistFiltroData === undefined) window._pickingHistFiltroData = "";
  if (window._pickingHistAberto === undefined) window._pickingHistAberto = null;

  const wrap = document.createElement("div");
  wrap.style.cssText = "max-width:900px;";

  const concluidos = state.picking_concluidos || {};
  const todasEntradas = Object.entries(concluidos)
    .filter(([, c]) => c && c.ts)
    .sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));

  // Filtro por dia (formato yyyy-mm-dd, igual input type=date)
  const filtro = window._pickingHistFiltroData;
  const entradasFiltradas = filtro
    ? todasEntradas.filter(([, c]) => {
        const d = new Date(c.ts);
        const dStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
        return dStr === filtro;
      })
    : todasEntradas;

  const header = document.createElement("div");
  header.style.cssText = "display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;";
  header.innerHTML = `
    <div>
      <div style="font-size:14px;font-weight:700;color:#fff;">Histórico de bipagem</div>
      <div style="font-size:11px;color:#666;margin-top:2px;">${entradasFiltradas.length} pedido${entradasFiltradas.length===1?"":"s"}${filtro ? " nesse dia" : " no total"}</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <input id="picking-hist-data" type="date" value="${filtro}" style="background:${T.bg3};border:1px solid ${T.border};border-radius:6px;padding:7px 10px;color:${T.text2};font-size:11px;font-family:Inter,sans-serif;outline:none;">
      ${filtro ? `<button id="picking-hist-limpar" style="background:none;border:1px solid ${T.border};border-radius:6px;padding:7px 12px;color:#888;font-size:11px;cursor:pointer;">Limpar filtro</button>` : ""}
    </div>
  `;
  wrap.appendChild(header);

  const lista = document.createElement("div");
  if (entradasFiltradas.length === 0) {
    lista.innerHTML = `<div style="font-size:11px;color:#555;text-align:center;padding:30px 0;">Nenhum pedido bipado ${filtro ? "nesse dia" : "ainda"}.</div>`;
  } else {
    entradasFiltradas.forEach(([orderId, c]) => {
      const aberto = window._pickingHistAberto === orderId;
      const dataHora = new Date(c.ts).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });

      const card = document.createElement("div");
      card.style.cssText = `background:${T.card};border:1px solid ${T.border};border-radius:10px;padding:14px 16px;margin-bottom:8px;cursor:pointer;`;
      card.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:12px;font-weight:600;color:#fff;">#${orderId} — ${c.titulo || "Pedido"}</div>
            <div style="font-size:10px;color:#666;margin-top:3px;">Etiqueta gerada às ${dataHora} · por ${c.por}${c.viaExterno ? " (registrado manualmente)" : ""}</div>
          </div>
          <div style="font-size:10px;color:#888;flex-shrink:0;">${aberto ? "▲" : "▼"}</div>
        </div>
      `;
      card.onclick = () => { window._pickingHistAberto = aberto ? null : orderId; renderPickingHistorico(panel); };
      lista.appendChild(card);

      if (aberto) {
        const detalhe = document.createElement("div");
        detalhe.style.cssText = "background:"+T.bg+";border:1px solid "+T.border+";border-radius:8px;padding:14px 16px;margin:-4px 0 12px;";

        // Conferência final: esperado x bipado
        if (c.itens_final && c.itens_final.length > 0) {
          detalhe.innerHTML += `<div style="font-size:10px;color:#666;margin-bottom:8px;">CONFERÊNCIA FINAL</div>`;
          c.itens_final.forEach(it => {
            const bateu = it.quantidadeBipada >= it.quantidadeNecessaria;
            detalhe.innerHTML += `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #1e1e1e;">
                <div style="font-size:11px;color:${T.text2};">${it.nome || it.sku}</div>
                <div style="font-size:11px;font-weight:700;color:${bateu ? "#2dce89" : "#e8432d"};">${it.quantidadeBipada}/${it.quantidadeNecessaria}</div>
              </div>
            `;
          });
        }

        // Timeline de bipagem — carregado sob demanda
        const timelineWrap = document.createElement("div");
        timelineWrap.style.cssText = "margin-top:14px;";
        timelineWrap.innerHTML = `<div style="font-size:10px;color:#666;margin-bottom:8px;">LINHA DO TEMPO DAS LEITURAS</div><div style="font-size:11px;color:#555;">Carregando...</div>`;
        detalhe.appendChild(timelineWrap);
        lista.appendChild(detalhe);

        // Busca o histórico de bipagem desse pedido específico (evento a evento)
        (async () => {
          try {
            const snap = await get(ref(db, `/picking_historico_bipagem/${orderId}`));
            const val = snap.exists() ? snap.val() : {};
            const eventos = Object.values(val).sort((a, b) => (a.ts || 0) - (b.ts || 0));
            if (eventos.length === 0) {
              timelineWrap.innerHTML = `<div style="font-size:10px;color:#666;margin-bottom:8px;">LINHA DO TEMPO DAS LEITURAS</div><div style="font-size:11px;color:#555;">Sem registro individual de leituras (pedido marcado manualmente, ou anterior a essa função).</div>`;
              return;
            }
            let html = `<div style="font-size:10px;color:#666;margin-bottom:8px;">LINHA DO TEMPO DAS LEITURAS</div>`;
            eventos.forEach(ev => {
              const hora = new Date(ev.ts).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
              const cor = ev.acertou ? "#2dce89" : "#e8432d";
              html += `
                <div style="display:flex;align-items:center;gap:8px;padding:5px 0;">
                  <div style="font-size:10px;color:#555;width:70px;flex-shrink:0;">${hora}</div>
                  <div style="width:6px;height:6px;border-radius:50%;background:${cor};flex-shrink:0;"></div>
                  <div style="font-size:11px;color:${T.text2};">${ev.acertou ? (ev.nome || ev.sku) : `Código ${ev.codigo} — não pertence ao pedido`}</div>
                </div>
              `;
            });
            timelineWrap.innerHTML = html;
          } catch (e) {
            timelineWrap.innerHTML = `<div style="font-size:10px;color:#666;margin-bottom:8px;">LINHA DO TEMPO DAS LEITURAS</div><div style="font-size:11px;color:#e8432d;">Erro ao carregar: ${e.message}</div>`;
          }
        })();
      }
    });
  }
  wrap.appendChild(lista);
  panel.appendChild(wrap);

  const inputData = panel.querySelector("#picking-hist-data");
  if (inputData) inputData.onchange = (e) => { window._pickingHistFiltroData = e.target.value; renderPickingHistorico(panel); };
  const btnLimpar = panel.querySelector("#picking-hist-limpar");
  if (btnLimpar) btnLimpar.onclick = () => { window._pickingHistFiltroData = ""; renderPickingHistorico(panel); };
}

function renderPickingAcompanhar(panel) {
  panel.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.style.cssText = "max-width:640px;font-family:Inter,sans-serif;";

  const concluidosHoje = Object.entries(state.picking_concluidos || {})
    .filter(([, c]) => c && new Date(c.ts).toDateString() === new Date().toDateString())
    .sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));

  const filaTotal = pickingState.fila?.length ?? "...";
  const locksAtivos = Object.entries(state.picking_locks || {})
    .filter(([, l]) => l && (Date.now() - (l.ts || 0)) < 20 * 60 * 1000);

  const resumo = document.createElement("div");
  resumo.style.cssText = `display:flex;gap:24px;background:${T.card};border:1px solid ${T.border};border-radius:10px;padding:16px 20px;margin-bottom:16px;`;
  resumo.innerHTML = `
    <div><div style="font-size:20px;font-weight:700;color:#2dce89;font-family:Inter,sans-serif;">${concluidosHoje.length}</div><div style="font-size:10px;color:${T.text3};margin-top:2px;">embalados hoje</div></div>
    <div><div style="font-size:20px;font-weight:700;color:${T.text};font-family:Inter,sans-serif;">${filaTotal}</div><div style="font-size:10px;color:${T.text3};margin-top:2px;">na fila</div></div>
  `;
  wrap.appendChild(resumo);

  const aoVivo = document.createElement("div");
  aoVivo.style.cssText = "margin-bottom:16px;";
  aoVivo.innerHTML = `<div style="font-size:11px;color:${T.text3};margin-bottom:8px;">AGORA, EM TEMPO REAL</div>`;
  if (locksAtivos.length === 0) {
    aoVivo.innerHTML += `<div style="font-size:11px;color:"+T.text3+";padding:12px;background:"+T.bg3+";border:1px solid "+T.border+";border-radius:8px;">Ninguém separando pedidos no momento.</div>`;
  } else {
    locksAtivos.forEach(([orderId, lock]) => {
      const pedidoInfo = pickingState.fila?.find(p => String(p.order_id) === String(orderId));
      const linha = document.createElement("div");
      linha.style.cssText = `display:flex;align-items:center;gap:8px;padding:10px 12px;background:${T.infoBg};border:1px solid ${T.infoBor};border-radius:8px;margin-bottom:6px;`;
      linha.innerHTML = `
        <div style="width:8px;height:8px;border-radius:50%;background:#2dce89;flex-shrink:0;"></div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:12px;color:#fff;font-weight:600;">${lock.por} está separando</div>
          <div style="font-size:10px;color:#888;margin-top:2px;">Pedido #${orderId}${pedidoInfo ? " · " + (pedidoInfo.itens[0]?.titulo || "") : ""}</div>
        </div>
      `;
      aoVivo.appendChild(linha);
    });
  }
  wrap.appendChild(aoVivo);

  const hist = document.createElement("div");
  hist.innerHTML = `<div style="font-size:11px;color:${T.text3};margin-bottom:8px;">ÚLTIMOS CONCLUÍDOS HOJE</div>`;
  if (concluidosHoje.length === 0) {
    hist.innerHTML += `<div style="font-size:11px;color:#555;">Nenhum pedido concluído ainda hoje.</div>`;
  } else {
    concluidosHoje.slice(0, 8).forEach(([orderId, c]) => {
      const hora = new Date(c.ts).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      const linha = document.createElement("div");
      linha.style.cssText = "padding:9px 12px;background:"+T.bg+";border:1px solid "+T.border+";border-radius:7px;margin-bottom:5px;";
      linha.innerHTML = `<div style="font-size:11px;color:${T.text};">#${orderId} · ${c.titulo}</div><div style="font-size:10px;color:#2dce89;margin-top:2px;">✓ etiqueta impressa às ${hora} por ${c.por}</div>`;
      hist.appendChild(linha);
    });
  }
  wrap.appendChild(hist);

  panel.appendChild(wrap);

  if (!pickingState.fila && !pickingState.carregando) {
    fetchPickingFila().then(() => renderPickingAcompanhar(panel));
  }
}

// Wrapper usado no card do Diogo — alterna entre "Acompanhar" (monitor,
// sem operar nada) e "Operar eu mesmo" (mesma tela operacional do Bruno).
// Overlay de tela cheia pro "Operar eu mesmo" do Diogo — anexado direto no
// <body>, fora de toda a estrutura de cards/grid. Isso evita qualquer disputa
// de CSS com o layout especial de navbar do Diogo (que só existia dentro do
// sistema de cards e nunca deixava o position:fixed valer a tela toda de verdade).
function renderPickingFullscreenOverlay() {
  const deveMostrar = openCard === "Diogo" && diogoPinUnlocked && window._diogotab === "picking" && window._pickingModoDiogo === "operar";
  let overlay = document.getElementById("picking-fullscreen-overlay");

  if (!deveMostrar) {
    if (overlay) overlay.remove();
    return;
  }

  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "picking-fullscreen-overlay";
    overlay.style.cssText = `position:fixed;inset:0;z-index:99999;background:${T.isLight?"#f2f2f2":"#000"};display:flex;flex-direction:column;box-sizing:border-box;`;
    document.body.appendChild(overlay);
  }

  overlay.innerHTML = "";

  const topo = document.createElement("div");
  topo.style.cssText = "display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #222;flex-shrink:0;";
  const btnVoltar = document.createElement("button");
  btnVoltar.textContent = "← Voltar";
  btnVoltar.style.cssText = "background:"+T.bg2+";border:1px solid "+T.border+";border-radius:6px;padding:8px 14px;color:"+T.text2+";font-size:11px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;";
  btnVoltar.onclick = () => { window._pickingModoDiogo = "acompanhar"; render(); };
  topo.appendChild(btnVoltar);
  overlay.appendChild(topo);

  const conteudo = document.createElement("div");
  conteudo.style.cssText = "flex:1;overflow-y:auto;padding:20px;box-sizing:border-box;";
  conteudo.className = "picking-diogo-operar-container";
  overlay.appendChild(conteudo);

  renderPickingTab(conteudo, "Diogo", true);
}

function renderPickingDiogo(panel) {
  panel.innerHTML = "";
  if (window._pickingModoDiogo === undefined) window._pickingModoDiogo = "acompanhar";

  const wrap = document.createElement("div");
  wrap.style.cssText = "max-width:1040px;font-family:Inter,sans-serif;";

  const toggleBar = document.createElement("div");
  toggleBar.style.cssText = "display:flex;gap:8px;margin-bottom:16px;";
  const opAcompanhar = document.createElement("button");
  const opOperar = document.createElement("button");
  const opHistorico = document.createElement("button");
  const modo = window._pickingModoDiogo;
  opAcompanhar.textContent = "Acompanhar";
  opOperar.textContent = "Operar eu mesmo →";
  opHistorico.textContent = "Histórico de bipagem";
  [opAcompanhar, opOperar, opHistorico].forEach((b, i) => {

  opOperar.onclick = () => { window._pickingModoDiogo = "operar"; render(); };
  opHistorico.onclick = () => { window._pickingModoDiogo = "historico"; render(); };
  toggleBar.appendChild(opAcompanhar);
  toggleBar.appendChild(opOperar);
  toggleBar.appendChild(opHistorico);
  wrap.appendChild(toggleBar);

  const conteudo = document.createElement("div");
  wrap.appendChild(conteudo);
  panel.appendChild(wrap);

  if (modo === "acompanhar") {
    renderPickingAcompanhar(conteudo);
  } else if (modo === "historico") {
    renderPickingHistorico(conteudo);
  } else {
    // O modo "operar" é mostrado no overlay de tela cheia (renderPickingFullscreenOverlay) —
    // aqui só um aviso simples, pra não duplicar a mesma tela em dois lugares.
    conteudo.innerHTML = `<div style="font-size:12px;color:#555;text-align:center;padding:40px 0;">Abrindo tela cheia...</div>`;
  }
}





async function fetchPerguntas() {
  perguntasState.carregando = true;
  perguntasState.erro = null;

  const contas = [
    { key: "matriz", label: "Matriz RS", token: state.ml_token?.access_token },
    { key: "filial", label: "Filial SP", token: state.ml_token_filial?.access_token },
  ].filter(c => c.token);

  if (contas.length === 0) {
    perguntasState.carregando = false;
    perguntasState.erro = "Nenhuma conta ML conectada. Verifique a conexão ML.";
    return;
  }

  try {
    const resultados = await Promise.all(contas.map(async (c) => {
      try {
        const r = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?action=buscar-perguntas&token=${c.token}`);
        const data = await r.json();
        if (!data.ok) return { conta: c.key, ok: false, erro: data.error };
        return { conta: c.key, ok: true, perguntas: (data.perguntas || []).map(p => ({ ...p, conta: c.key, contaLabel: c.label })) };
      } catch (e) {
        return { conta: c.key, ok: false, erro: e.message };
      }
    }));

    perguntasState.carregando = false;
    const falhas = resultados.filter(r => !r.ok);
    const sucesso = resultados.filter(r => r.ok);

    if (sucesso.length === 0) {
      perguntasState.erro = "Erro ao buscar perguntas: " + falhas.map(f => f.erro).join(" · ");
      return;
    }

    const dispensadas = state.perguntas_dispensadas || {};
    const todasPerguntas = sucesso.flatMap(r => r.perguntas);
    perguntasState.lista = todasPerguntas.filter(p => !dispensadas[p.question_id]);
    perguntasState._fetchedAt = Date.now();
    if (falhas.length > 0) {
      perguntasState.erro = `Aviso: não foi possível buscar perguntas de ${falhas.map(f => f.conta === "matriz" ? "Matriz RS" : "Filial SP").join(", ")}.`;
    }
  } catch (e) {
    perguntasState.carregando = false;
    perguntasState.erro = "Erro de conexão ao buscar perguntas.";
  }
}

async function enviarRespostaPergunta(p) {
  const token = p.conta === "matriz" ? state.ml_token?.access_token : state.ml_token_filial?.access_token;
  if (!token) return { ok: false, error: "Token da conta não encontrado." };
  try {
    const r = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?action=responder-pergunta`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question_id: p.question_id, texto: p.suggested_answer, token, pergunta_texto: p.pergunta, produto: p.produto, item_id: p.item_id }),
    });
    return await r.json();
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

// Verifica e envia automaticamente perguntas com conhecimento prévio confiável (modo automático)
async function checarPerguntasAuto() {
  if (!state.perguntas_auto) return;
  const agora = Date.now();
  if (!perguntasState.carregando && (!perguntasState.lista || (agora - (perguntasState._fetchedAt || 0)) > 150 * 1000)) {
    await fetchPerguntas();
  }
  if (!perguntasState.lista) return;
  const elegiveis = perguntasState.lista.filter(p =>
    !p.requires_attention && p.has_knowledge && p.suggested_answer &&
    perguntasState.enviando[p.question_id] !== "ok" && perguntasState.enviando[p.question_id] !== "loading"
  );
  for (const p of elegiveis) {
    perguntasState.enviando[p.question_id] = "loading";
    const data = await enviarRespostaPergunta(p);
    perguntasState.enviando[p.question_id] = data.ok ? "ok-auto" : "erro";
    if (data.ok) {
      push(ref(db, "/perguntas_auto_log"), {
        produto: p.produto, pergunta: p.pergunta, resposta: p.suggested_answer, ts: Date.now(),
      });
    }
  }
  if (elegiveis.length && window._diogotab === "perguntas") {
    const cont = document.querySelector(".perguntas-container");
    if (cont) renderPerguntasTab(cont);
  }
}
setInterval(checarPerguntasAuto, 3 * 60 * 1000); // checa a cada 3 minutos
setTimeout(checarPerguntasAuto, 8000);

              if (perguntasState.lista) {
                perguntasState.lista = perguntasState.lista.filter(item => item.question_id !== p.question_id);
              }
            } else if (data.raw?.error === "not_active_item") {
              perguntasState.enviando[p.question_id] = "inativo";

              perguntasState.enviando[p.question_id] = "erro";

          } finally {
            refreshPerguntasUI();
          }
        };
      }

      const btnDispensar = card.querySelector(`#pergunta-dispensar-${p.question_id}`);
      if (btnDispensar) {

  container.appendChild(wrap);

    await fetchPerguntas();

    fetchPerguntas().then(() => refreshPerguntasUI());
  }
}

      const contaDestino = clonarState.contaOrigem==="matriz" ? "Filial SP" : "Matriz RS";
      return `
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid ${T.sep};">
        ${item.has_variations ? `<div style="background:${T.errBg};border:1px solid ${T.errBor};border-radius:8px;padding:10px;margin-bottom:12px;font-size:11px;color:${T.errText};">⚠️ Variações não suportadas.</div>` : ""}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
          <div><div style="font-size:10px;color:${T.text3};margin-bottom:4px;">SKU</div><input id="clonar-input-sku" type="text" value="${item.sku||""}" style="width:100%;background:${T.bg3};border:1px solid ${T.border};border-radius:6px;padding:8px 10px;color:${T.text};font-size:12px;font-family:Inter,sans-serif;outline:none;box-sizing:border-box;"></div>
          <div><div style="font-size:10px;color:${T.text3};margin-bottom:4px;">Quantidade</div><input id="clonar-input-qtd" type="number" value="${item.available_quantity}" style="width:100%;background:${T.bg3};border:1px solid ${T.border};border-radius:6px;padding:8px 10px;color:${T.text};font-size:12px;font-family:Inter,sans-serif;outline:none;box-sizing:border-box;"></div>
        </div>
        <div style="font-size:10px;color:${T.text3};margin-bottom:4px;">Preço</div>
        <div style="font-size:16px;font-weight:700;color:${T.text};font-family:'IBM Plex Mono',monospace;margin-bottom:12px;">R$ ${Number(item.price).toLocaleString("pt-BR",{minimumFractionDigits:2})}</div>
        <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:${T.bg3};border-radius:6px;margin-bottom:12px;font-size:11px;">
          <span style="color:${T.text3};">Clonando para</span><span style="color:${T.text};font-weight:600;">${contaDestino}</span>
        </div>
        <button id="clonar-btn-confirmar" ${item.has_variations?"disabled":""} style="width:100%;padding:11px;border-radius:6px;background:${item.has_variations?T.border:"#5e72e4"};border:none;color:${item.has_variations?T.text3:"#fff"};font-size:12px;font-weight:600;cursor:${item.has_variations?"not-allowed":"pointer"};">${clonarState.clonando?"Clonando...":"Confirmar e clonar anúncio"}</button>
      </div>`;
    })() : ""}
    ${clonarState.resultado ? `<div style="background:${T.okBg};border:1px solid ${T.okBor};border-radius:8px;padding:14px;margin-top:12px;text-align:center;"><div style="font-size:13px;font-weight:700;color:${T.okTxt};margin-bottom:8px;">✓ Clonado com sucesso!</div><a href="${clonarState.resultado.permalink||"#"}" target="_blank" style="font-size:11px;color:#5eb3f0;">Ver anúncio clonado ↗</a></div>` : ""}
  `;
  wrap.appendChild(cardEsq);

  // ── Card direito: prévia ──
  const cardDir = document.createElement("div");

  if (!isLoteModo && !clonarState.itemEncontrado && !clonarState.resultado) {
    // Placeholder vazio
    cardDir.style.cssText = `background:${T.card};border:2px dashed ${T.border2};border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;align-self:stretch;`;
    cardDir.innerHTML = `<div style="font-size:12px;color:${T.text3};text-align:center;">Prévia do anúncio<br>aparece aqui</div>`;

  } else if (!isLoteModo && clonarState.itemEncontrado) {
    // Prévia do anúncio único
    cardDir.style.cssText = `background:${T.card};border:1px solid ${T.border};border-radius:10px;padding:16px;box-sizing:border-box;`;
    const item = clonarState.itemEncontrado;
    const foto = item.pictures?.[0]?.source || "";
    const contaDestino = clonarState.contaOrigem==="matriz" ? "Filial SP" : "Matriz RS";
    cardDir.innerHTML = `
      <div style="font-size:11px;color:${T.text3};margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid ${T.sep};">Prévia — clonando para ${contaDestino}</div>
      <div style="display:flex;gap:12px;margin-bottom:12px;">
        ${foto ? `<img src="${foto}" style="width:80px;height:80px;border-radius:8px;object-fit:cover;flex-shrink:0;background:${T.bg3};">` : `<div style="width:80px;height:80px;border-radius:8px;background:${T.bg3};flex-shrink:0;"></div>`}
        <div>
          <div style="font-size:12px;font-weight:600;color:${T.text};line-height:1.4;margin-bottom:6px;">${item.title}</div>
          <div style="font-size:11px;color:${T.text3};">Categoria ${item.category_id} · ${item.condition==="new"?"Novo":item.condition}</div>
        </div>
      </div>
      <div id="clonar-preview-info" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px;">
        <div style="background:${T.bg3};border-radius:6px;padding:8px;"><div style="color:${T.text3};font-size:10px;margin-bottom:2px;">SKU</div><div style="color:${T.text};font-weight:600;">${item.sku||"—"}</div></div>
        <div style="background:${T.bg3};border-radius:6px;padding:8px;"><div style="color:${T.text3};font-size:10px;margin-bottom:2px;">Quantidade</div><div style="color:${T.text};font-weight:600;">${item.available_quantity} un</div></div>
        <div style="background:${T.bg3};border-radius:6px;padding:8px;"><div style="color:${T.text3};font-size:10px;margin-bottom:2px;">Preço</div><div style="color:${T.text};font-weight:600;">R$ ${Number(item.price).toLocaleString("pt-BR",{minimumFractionDigits:2})}</div></div>
        <div style="background:${T.bg3};border-radius:6px;padding:8px;"><div style="color:${T.text3};font-size:10px;margin-bottom:2px;">Fotos</div><div style="color:${T.text};font-weight:600;">${(item.pictures||[]).length} imagens</div></div>
      </div>
    `;
    window._clonarAtualizarPreview = function() {
      const sku = document.getElementById("clonar-input-sku")?.value || item.sku || "";
      const qtd = document.getElementById("clonar-input-qtd")?.value || item.available_quantity;
      const el = document.getElementById("clonar-preview-info");
      if (el) el.querySelector("div:nth-child(1) div:last-child").textContent = sku;
      if (el) el.querySelector("div:nth-child(2) div:last-child").textContent = qtd + " un";
    };

  } else if (isLoteModo) {
    // Cards do lote com accordion
    cardDir.style.cssText = `background:${T.card};border:1px solid ${T.border};border-radius:10px;padding:16px;box-sizing:border-box;`;
    const statusInfo = {
      aguardando: { label: "Na fila", cor: T.text3, icone: "⋯" },
      buscando:   { label: "Buscando...", cor: T.text2, icone: "⏳" },
      encontrado: { label: "Pronto pra clonar", cor: "#5e72e4", icone: "✓" },
      clonando:   { label: "Clonando...", cor: T.text2, icone: "⏳" },
      sucesso:    { label: "Clonado", cor: T.okTxt, icone: "✓" },
      erro:       { label: "Erro", cor: T.errText, icone: "✕" },
    };
    const itens = loteState.itens || [];
    const concluidos = itens.filter(it=>it.status==="sucesso"||it.status==="erro").length;
    let titulo = "Prévia do lote";
    if (loteState.fase==="busca") titulo = `Buscando ${itens.filter(it=>it.status!=="aguardando").length}/${loteState.total}...`;
    else if (loteState.fase==="revisao") titulo = `${itens.filter(it=>it.status==="encontrado").length} prontos pra clonar`;
    else if (loteState.fase==="clonando") titulo = `Clonando ${concluidos}/${loteState.total}...`;
    else if (loteState.fase==="concluido") titulo = `✓ ${itens.filter(it=>it.status==="sucesso").length} de ${loteState.total} clonados`;

    cardDir.innerHTML = `
      <div style="font-size:11px;color:${T.text3};margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid ${T.sep};">${titulo}</div>
      ${loteState.total>0&&loteState.fase!=="revisao" ? `<div style="height:3px;background:${T.border};border-radius:99px;overflow:hidden;margin-bottom:12px;"><div style="height:3px;background:#5e72e4;width:${(concluidos/loteState.total*100).toFixed(0)}%;transition:width .3s;"></div></div>` : ""}
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${itens.length===0 ? `<div style="text-align:center;padding:30px 0;color:${T.text3};font-size:12px;">Cole os IDs e clique em Buscar</div>` : itens.map((it,idx) => {
          const s = statusInfo[it.status]||statusInfo.aguardando;
          const podeExpandir = it.status==="encontrado"||it.status==="sucesso";
          const exp = it._expandido||false;
          return `<div style="background:${T.bg3};border:1px solid ${it.status==="encontrado"?"#5e72e4":it.status==="sucesso"?T.okBor:it.status==="erro"?T.errBor:T.border};border-radius:8px;overflow:hidden;">
            <div onclick="window._clonarToggle(${idx})" style="display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:${podeExpandir?"pointer":"default"};">
              ${it.foto?`<img src="${it.foto}" style="width:36px;height:36px;border-radius:5px;object-fit:cover;flex-shrink:0;">`:`<div style="width:36px;height:36px;border-radius:5px;background:${T.border};flex-shrink:0;"></div>`}
              <div style="flex:1;min-width:0;">
                <div style="font-size:11px;font-weight:600;color:${T.text};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${it.titulo||it.itemId}</div>
                <div style="font-size:10px;color:${s.cor};margin-top:2px;">${s.icone} ${it.status==="erro"?it.motivo:s.label}</div>
              </div>
              ${podeExpandir?`<span style="font-size:10px;color:${T.text3};">${exp?"▲":"▼"}</span>`:""}
              ${it.status==="sucesso"?`<a href="${it.permalink}" target="_blank" onclick="event.stopPropagation()" style="font-size:10px;color:#5eb3f0;padding:3px 8px;border:1px solid #5eb3f044;border-radius:4px;text-decoration:none;">ver ↗</a>`:""}
            </div>
            ${exp&&podeExpandir?`<div style="padding:10px 12px 12px;border-top:1px solid ${T.sep};display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:10px;">
              <div><span style="color:${T.text3};">SKU</span><br><strong style="color:${T.text};">${it.sku||"—"}</strong></div>
              <div><span style="color:${T.text3};">Qtd</span><br><strong style="color:${T.text};">${it.quantidade} un</strong></div>
              <div><span style="color:${T.text3};">Preço</span><br><strong style="color:${T.text};">R$ ${Number(it.preco).toLocaleString("pt-BR",{minimumFractionDigits:2})}</strong></div>
              <div><span style="color:${T.text3};">Categoria</span><br><strong style="color:${T.text};">${it.categoria||"—"}</strong></div>
            </div>`:""}
          </div>`;
        }).join("")}
      </div>
      ${!loteState.rodando&&loteState.fase==="concluido"?`<button id="clonar-lote-novo" style="width:100%;margin-top:12px;padding:9px;border-radius:6px;background:${T.bg3};border:1px solid ${T.border};color:${T.text2};font-size:11px;font-weight:600;cursor:pointer;">Limpar e clonar outro lote</button>`:""}
    `;
  }

  wrap.appendChild(cardDir);

  window._clonarToggle = function(idx) {
    if (!loteState.itens?.[idx]) return;
    const it = loteState.itens[idx];
    if (it.status!=="encontrado"&&it.status!=="sucesso") return;
    it._expandido = !it._expandido;
    renderClonarTab(container);
  };

  const btnBuscar = container.querySelector("#clonar-btn-buscar");
  if (btnBuscar) btnBuscar.onclick = async () => {
    const idsAgora = extrairMultiplosIds(clonarState.itemBusca);
    if (idsAgora.length > 1) {
      await buscarLoteClonagem(container);
      return;
    }
    const itemId = extrairItemId(clonarState.itemBusca);
    if (!itemId) return;
    clonarState.buscando = true;
    clonarState.erro = null;
    clonarState.itemEncontrado = null;
    renderClonarTab(container);

    const tokenOrigem = clonarState.contaOrigem === "matriz" ? state.ml_token?.access_token : state.ml_token_filial?.access_token;
    if (!tokenOrigem) {
      clonarState.buscando = false;
      clonarState.erro = "Token da conta de origem não encontrado. Verifique a conexão ML.";
      renderClonarTab(container);
      return;
    }

    try {
      const r = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?action=buscar-clone&item_id=${itemId}&token=${tokenOrigem}`);
      const data = await r.json();
      clonarState.buscando = false;
      if (!data.ok) {
        clonarState.erro = data.error || "Não foi possível localizar o anúncio.";
      } else {
        clonarState.itemEncontrado = data.item;
      }
      renderClonarTab(container);
    } catch (e) {
      clonarState.buscando = false;
      clonarState.erro = "Erro de conexão ao buscar o anúncio.";
      renderClonarTab(container);
    }
  };

  const inputSku = container.querySelector("#clonar-input-sku");
  if (inputSku) inputSku.oninput = (e) => { clonarState.novoSku = e.target.value; window._clonarAtualizarPreview && window._clonarAtualizarPreview(); };
  const inputQtd = container.querySelector("#clonar-input-qtd");
  if (inputQtd) inputQtd.oninput = (e) => { clonarState.novaQuantidade = e.target.value; window._clonarAtualizarPreview && window._clonarAtualizarPreview(); };

  const btnConfirmar = container.querySelector("#clonar-btn-confirmar");
  if (btnConfirmar) btnConfirmar.onclick = async () => {
    clonarState.clonando = true;
    clonarState.erro = null;
    renderClonarTab(container);

    const tokenDestino = clonarState.contaOrigem === "matriz" ? state.ml_token_filial?.access_token : state.ml_token?.access_token;
    if (!tokenDestino) {
      clonarState.clonando = false;
      clonarState.erro = "Token da conta de destino não encontrado.";
      renderClonarTab(container);
      return;
    }

    try {
      const r = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?action=clonar`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          item: clonarState.itemEncontrado,
          tokenDestino,
          novoSku: inputSku?.value || clonarState.itemEncontrado.sku,
          novaQuantidade: inputQtd?.value ? Number(inputQtd.value) : clonarState.itemEncontrado.available_quantity,
        }),
      });
      const data = await r.json();
      clonarState.clonando = false;
      if (!data.ok) {
        let msg = data.error || "Erro ao clonar o anúncio.";
        if (data.raw) {
          msg += "\n\n" + JSON.stringify(data.raw, null, 2);
        }
        clonarState.erro = msg;
      } else {
        clonarState.resultado = data;
      }
      renderClonarTab(container);
    } catch (e) {
      clonarState.clonando = false;
      clonarState.erro = "Erro de conexão ao clonar o anúncio.";
      renderClonarTab(container);
    }
  };

  const btnNovo = container.querySelector("#clonar-btn-novo");
  if (btnNovo) btnNovo.onclick = () => {
    clonarState = { itemBusca: "", contaOrigem: "matriz", itemEncontrado: null, buscando: false, clonando: false, resultado: null, erro: null, novoSku: "", novaQuantidade: "" };
    renderClonarTab(container);
  };
}

function renderExperienciaTab(container) {
  container.innerHTML = "";

  if(!dashExperiencia) {
    container.innerHTML = '<div style="padding:40px 0;text-align:center;font-size:12px;color:${T.text2};">Carregando experiência de compra...</div>';
    return;
  }

  const todosProblemas = dashExperiencia.problemas || [];
  const ruins = todosProblemas.filter(p => p.color === 'red');
  const regulares = todosProblemas.filter(p => p.color !== 'red');

  let listaFiltrada = todosProblemas;
  if(expPageFiltro === "ruim") listaFiltrada = ruins;
  if(expPageFiltro === "regular") listaFiltrada = regulares;

  // Header
  const header = document.createElement("div");
  header.style.cssText = "display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;";
  header.innerHTML = `
    <div>
      <div style="font-size:16px;font-weight:700;color:${T.text};">Experiência de compra</div>
      <div style="font-size:11px;color:${T.text2};margin-top:2px;">${dashExperiencia.total || 0} anúncios ativos · ${todosProblemas.length} com problema</div>
    </div>
    <button onclick="window._expRefresh()" style="background:${T.bg3};border:1px solid ${T.border};border-radius:6px;padding:7px 14px;color:${T.text2};font-size:11px;cursor:pointer;">↻ Atualizar</button>
  `;
  container.appendChild(header);

  window._expRefresh = function() {
    dashExperiencia = null;
    fetchExperiencia();
  };

  // Filtro tabs
  const filterBar = document.createElement("div");
  filterBar.style.cssText = "display:flex;gap:8px;margin-bottom:16px;";
  const filtros = [
    {key:"todos", label:`Todos (${todosProblemas.length})`, cor:"#888"},
    {key:"ruim", label:`Ruim (${ruins.length})`, cor:"#e8432d"},
    {key:"regular", label:`Regular (${regulares.length})`, cor:"#ffffff"},
  ];
  filtros.forEach(f => {
    const btn = document.createElement("button");
    const ativo = expPageFiltro === f.key;
    btn.style.cssText = `background:${ativo?f.cor:'${T.isLight?"#ffffff":"linear-gradient(to top,#252525 0%,#000 100%)"}'};border:1px solid ${ativo?f.cor:'#333'};border-radius:6px;padding:7px 14px;color:${ativo?'#fff':'#888'};font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;`;
    btn.textContent = f.label;
    btn.onclick = () => { expPageFiltro = f.key; renderExperienciaTab(container); };
    filterBar.appendChild(btn);
  });
  container.appendChild(filterBar);

  // Grid de cards
  if(listaFiltrada.length === 0) {
    const empty = document.createElement("div");
    empty.style.cssText = "padding:40px 0;text-align:center;font-size:12px;color:${T.text2};";
    empty.textContent = expPageFiltro === "todos" ? "Nenhum produto com problema de experiência. Tudo certo! ✓" : "Nenhum item nessa categoria.";
    container.appendChild(empty);
    return;
  }

  const grid = document.createElement("div");
  grid.style.cssText = "display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;";

  const circ = 2 * Math.PI * 42;
  window._expPageDetailsCache = [];

  listaFiltrada.forEach((p, i) => {
    const cor = p.color === 'red' ? '#e8432d' : '#f77614';
    const score = p.value || 0;
    const dash = ((score/100)*circ).toFixed(1);
    const label = p.level || (p.color === 'red' ? 'Ruim' : 'Regular');
    const nome = p.title || p.sku || '';
    const nomeShort = nome.length > 40 ? nome.slice(0,40)+'…' : nome;

    const acoesRows = (p.actions||[]).map(a=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:${T.bg3};border-radius:6px;margin-bottom:5px;"><div style="width:6px;height:6px;border-radius:50%;background:${cor};flex-shrink:0;"></div><div style="font-size:11px;color:${T.text2};">${a}</div></div>`).join('') || '<div style="font-size:11px;color:${T.text3};">Nenhuma recomendação disponível.</div>';
    const principalHTML = p.principalAcao ? `<div style="display:flex;align-items:center;gap:8px;padding:9px 12px;background:${cor}1a;border:1px solid ${cor}44;border-radius:7px;margin-bottom:12px;"><div style="font-size:10px;color:${cor};font-weight:700;text-transform:uppercase;flex-shrink:0;">Prioridade</div><div style="font-size:12px;color:${T.text};font-weight:600;">${p.principalAcao}</div></div>` : '';
    const freezeHTML = p.freeze ? `<div style="display:flex;align-items:flex-start;gap:8px;padding:9px 12px;background:#2a1000;border:1px solid #4a2010;border-radius:7px;margin-bottom:12px;"><div style="font-size:13px;flex-shrink:0;">⚠️</div><div style="font-size:11px;color:#f0a060;line-height:1.4;">${p.freeze}</div></div>` : '';
    const statusHTML = p.status && p.status !== 'active' ? `<div style="display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;background:#c0392b22;color:#c0392b;margin-bottom:10px;">Anúncio ${p.status==='paused'?'pausado':'em moderação'}</div>` : '';

    window._expPageDetailsCache[i] = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #1e1e1e;"><div style="font-size:12px;font-weight:600;color:${T.text};">${nome}</div><a href="${p.link||'#'}" target="_blank" style="font-size:11px;color:#1a6be0;text-decoration:none;padding:3px 10px;border:1px solid #1a6be033;border-radius:5px;white-space:nowrap;">Abrir no ML ↗</a></div>${statusHTML}${principalHTML}${freezeHTML}<div><div style="font-size:11px;color:#777;margin-bottom:8px;">Ações recomendadas</div>${acoesRows}</div>`;

    const card = document.createElement("div");
    card.className = "exp-page-card";
    card.style.cssText = `background:${T.card};border-top:1px solid ${T.border};border-bottom:1px solid ${T.border};border-right:1px solid ${T.border};border-left:3px solid ${cor};border-radius:10px;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;cursor:pointer;transition:border-color .2s;`;
    card.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;width:100%;">
        <svg width="64" height="64" viewBox="0 0 108 108">
          <circle cx="54" cy="54" r="42" fill="none" stroke="#1e1e1e" stroke-width="7"/>
          <circle cx="54" cy="54" r="42" fill="none" stroke="${cor}" stroke-width="7" stroke-dasharray="${dash} ${circ.toFixed(1)}" stroke-dashoffset="${(circ*0.25).toFixed(1)}" stroke-linecap="round"/>
          <text x="54" y="62" text-anchor="middle" fill="${cor}" font-size="22" font-weight="700" font-family="Inter,sans-serif">${score}</text>
        </svg>
        <div style="font-size:11px;font-weight:600;color:${cor};">${label}</div>
        <div style="font-size:11px;font-weight:600;color:${T.text};line-height:1.4;">${nomeShort}</div>

  container.appendChild(grid);

  const detailPanel = document.createElement("div");

  detailPanel.style.cssText = `display:none;background:${T.bg2};border:1px solid ${T.border};border-radius:10px;padding:16px;margin-top:12px;`;

  window._expPageToggle = function(idx, cont) {
    const cards = cont.querySelectorAll('.exp-page-card');
    const panel = cont.querySelector('#exp-page-detail-panel');
    if(!panel) return;
    const cur = parseInt(panel.dataset.idx||'-1');

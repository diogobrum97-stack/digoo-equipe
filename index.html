async function processarExcelEstoque(file) {
  const arrayBuffer = await file.arrayBuffer();
  const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
  const wb = XLSX.read(arrayBuffer, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });

  // SheetJS ignora col A vazia → índices deslocados -1
  // idx 2=SKU, idx 5=Produto, idx 17=Aptas, idx 15=Transf, idx 14=Pendente

  // Encontra primeira linha com SKU real em idx 2
  let startIdx = 0;
  for (let i = 0; i < raw.length; i++) {
    const v = String(raw[i][2] || "").trim();
    if (v && /[A-Za-z]/.test(v) && !["SKU","Código ML","Status","Boa","Total","Produto"].includes(v)) {
      startIdx = i;
      break;
    }
  }

  const dados = [];
  let lastSku = "";
  for (let i = startIdx; i < raw.length; i++) {
    const row   = raw[i];
    const sku     = String(row[2] || "").trim();
    const produto = String(row[5] || "").trim();

    // SKU vazio mas produto preenchido = célula mesclada no Excel
    // usa SKU da linha anterior ou gera um a partir do produto
    const skuReal = sku || lastSku + "_v2";
    if (sku) lastSku = sku;

    if (!produto) continue;

    const aptas    = Number(row[17]) || 0;
    const transf   = Number(row[15]) || 0;
    const pendente = Number(row[14]) || 0;

    // Só inclui se tem produto válido
    if (!skuReal) continue;

    // Agrega linhas com mesmo SKU (células mescladas aparecem em linhas separadas)
    const existing = dados.find(d => d.sku === skuReal);
    if (existing) {
      existing.aptas    += aptas;
      existing.transf   += transf;
      existing.pendente += pendente;
      existing.vendas30 = (existing.vendas30||0) + (Number(row[10])||0);
    } else {
      const vendas30 = Number(row[10]) || 0;
      dados.push({ sku: skuReal, produto, aptas, transf, pendente, vendas30 });
    }
  }

  estoqueExcelData = { fileName: file.name, rows: dados };
  if (!estoqueBlingData && !estoqueBlingLoading) await fetchBlingProdutos();
  render();
}

async function processarRelatorioMatriz(file) {
  const arrayBuffer = await file.arrayBuffer();
  const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
  const wb = XLSX.read(arrayBuffer, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
  const dados = [];
  for (let i = 1; i < raw.length; i++) {
    const row = raw[i];
    const sku = String(row[0] || "").trim();
    const produto = String(row[1] || "").trim();
    if (!produto || produto.toLowerCase().includes("totai")) continue;
    const parseNum = v => parseFloat(String(v||"0").replace(/\./g,"").replace(",",".")) || 0;
    const qty = Math.round(parseNum(row[3]));
    const custo = parseNum(row[4]);
    const valor = parseNum(row[5]);
    if (qty <= 0) continue; // só produtos com estoque positivo
    dados.push({ sku: sku || "—", produto, qty, custo, valor });
  }
  return dados;
}

let precoAutoCheckDone = false;

// ── Cancelamentos ML ──────────────────────────────────────────────────────────
let cancelamentosData = null;     // null = não carregado ainda, [] = carregado vazio
let cancelamentosLoading = false;
let cancelamentosErro = null;

async function fetchCancelamentos(forcar) {
  if (cancelamentosLoading) return;
  if (cancelamentosData !== null && !forcar) return;
  cancelamentosLoading = true; cancelamentosErro = null;
  try {
    const r = await fetch(`${VERCEL_BACKEND}/api/ml-canceladas`);
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || "falha ao buscar cancelamentos");
    cancelamentosData = d.itens || [];
  } catch (e) {
    cancelamentosErro = e.message;
    cancelamentosData = [];
    console.error("Erro ao buscar cancelamentos:", e.message);
  }
  cancelamentosLoading = false;
  // Atualiza só o painel de cancelamentos diretamente, sem re-renderizar o card todo
  const painelAlvo = document.getElementById("cancelamentos-panel");
  if (painelAlvo) {
    painelAlvo.innerHTML = "";
    renderCancelamentos(painelAlvo);
  }
}

function renderCancelamentos(panel) {
  if (cancelamentosLoading || cancelamentosData === null) {
    const l = document.createElement("div");
    l.style.cssText = "text-align:center;padding:30px 0;font-size:12px;color:var(--text3);";
    l.innerHTML = '<span class="spinning">↻</span> Buscando cancelamentos no ML...';
    panel.appendChild(l); return;
  }

  const topRow = document.createElement("div");
  topRow.style.cssText = "display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;";
  const refreshBtn = document.createElement("button");
  refreshBtn.textContent = "↻ Atualizar";
  refreshBtn.style.cssText = "background:none;border:1px solid var(--border2);color:var(--text3);border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;";
  refreshBtn.addEventListener("click", () => {
    cancelamentosData = null; // reseta pra forçar nova busca
    const p = document.getElementById("cancelamentos-panel");
    if(p){ p.innerHTML=""; renderCancelamentos(p); }
    fetchCancelamentos(true);
  });
  topRow.appendChild(refreshBtn);
  panel.appendChild(topRow);

  if (cancelamentosErro) {
    const err = document.createElement("div");
    err.style.cssText = "padding:10px;background:#e91e8c10;border:1px solid #e91e8c33;border-radius:5px;font-size:11px;color:#e91e8c;margin-bottom:12px;";
    err.textContent = `Erro: ${cancelamentosErro}`;
    panel.appendChild(err);
    return;
  }

  if (!cancelamentosData || cancelamentosData.length === 0) {
    const vazio = document.createElement("div");
    vazio.style.cssText = "text-align:center;padding:30px 0;font-size:12px;color:var(--text3);";
    vazio.textContent = cancelamentosData ? "Nenhum cancelamento encontrado no período." : "Clique em Atualizar para carregar.";
    panel.appendChild(vazio); return;
  }

  // 4 status — definição de cor, ícone e texto do badge
  const statusDefs = {
    nf_pendente:        { cor: "#e91e8c", texto: "Cancelar NF",          icone: "⚠" },
    devolucao_pendente: { cor: "#f0b400", texto: "Devolução — processar", icone: "↩" },
    nf_cancelada:       { cor: "#00dfc3", texto: "NF cancelada",          icone: "✓" },
  };

  // Ordena: cancelar NF direto primeiro, depois devolução pendente, depois já ok
  const ordemStatus = { nf_pendente: 0, devolucao_pendente: 1, nf_cancelada: 2 };
  const filtrados = cancelamentosData.filter(it => it.status !== "sem_nf").sort((a, b) => {
    const ds = (ordemStatus[a.status] ?? 9) - (ordemStatus[b.status] ?? 9);
    if (ds !== 0) return ds;
    return new Date(b.dataCancelamento || 0) - new Date(a.dataCancelamento || 0);
  });

  if (filtrados.length === 0) {
    const vazio = document.createElement("div");
    vazio.style.cssText = "padding:10px 0;font-size:12px;color:var(--text3);";
    vazio.textContent = "Nenhum item nessa categoria.";
    panel.appendChild(vazio); return;
  }

  function badgeSituacao(situacao) {
    const s = String(situacao||"").toLowerCase();
    if(/cancelad/.test(s)) return { bg:"#33333380", cor:"#888", borda:"#44444480" };
    if(/autoriz/.test(s))  return { bg:"#00dfc318", cor:"#00dfc3", borda:"#00dfc333" };
    return { bg:"#f0b40018", cor:"#f0b400", borda:"#f0b40033" };
  }

  function copiavel(texto, exibir) {
    const span = document.createElement("span");
    span.textContent = exibir || texto;
    span.style.cssText = "cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-color:#555;color:var(--text2);";
    span.title = "Clique pra copiar";
    span.addEventListener("click", e => {
      e.stopPropagation();
      navigator.clipboard.writeText(texto).catch(()=>{});
      const orig = span.style.color;
      span.style.color = "#00dfc3";
      setTimeout(()=>span.style.color=orig, 800);
    });
    return span;
  }

  filtrados.forEach(it => {
    const card = document.createElement("div");
    const sd = statusDefs[it.status] || { cor: "#888", texto: it.status || "—", icone: "?" };
    const borderColor = sd.cor === "var(--text3)" ? "var(--border)" : sd.cor;
    card.style.cssText = `background:var(--bg3);border:1px solid ${borderColor}33;border-left:3px solid ${borderColor};border-radius:6px;padding:10px 12px;margin-bottom:8px;${it.status==="nf_cancelada"?"opacity:0.55;":""}`;

    const dataStr = it.dataCancelamento ? new Date(it.dataCancelamento).toLocaleDateString("pt-BR") : "—";
    const valorStr = `R$ ${Number(it.valor).toLocaleString("pt-BR", {minimumFractionDigits:2})}`;

    // Linha 1: produto + badge de status
    const linha1 = document.createElement("div");
    linha1.style.cssText = "display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;";
    const prodInfo = document.createElement("div");
    prodInfo.style.cssText = "flex:1;min-width:0;";
    const prodNome = document.createElement("div");
    prodNome.style.cssText = "font-size:11px;font-weight:600;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;";
    prodNome.textContent = it.produto;
    const compradorRow = document.createElement("div");
    compradorRow.style.cssText = "display:flex;gap:8px;align-items:center;font-size:11px;color:var(--text3);flex-wrap:wrap;";
    compradorRow.appendChild(copiavel(it.comprador, `👤 ${it.comprador}`));
    const dataValor = document.createElement("span");
    dataValor.textContent = `${dataStr} · ${valorStr}`;
    compradorRow.appendChild(dataValor);
    prodInfo.appendChild(prodNome); prodInfo.appendChild(compradorRow);
    const badgeAlerta = document.createElement("span");
    badgeAlerta.style.cssText = `background:${sd.cor}18;color:${sd.cor};border:1px solid ${sd.cor}55;border-radius:4px;padding:2px 8px;font-size:11px;white-space:nowrap;flex-shrink:0;letter-spacing:0.02em;font-weight:500;`;
    badgeAlerta.textContent = `${sd.icone} ${sd.texto}`;
    linha1.appendChild(prodInfo); linha1.appendChild(badgeAlerta);
    card.appendChild(linha1);

    // Linha 2: pedido, NF e badge de situação da nota
    const linha2 = document.createElement("div");
    linha2.style.cssText = "display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;font-size:11px;color:var(--text3);";
    const pedidoLabel = document.createElement("span");
    pedidoLabel.textContent = "Pedido ML ";
    pedidoLabel.appendChild(copiavel(it.numeroPedido));
    linha2.appendChild(pedidoLabel);
    if(it.nf){
      const sep = document.createElement("span"); sep.style.color="var(--border2)"; sep.textContent="·";
      const nfLabel = document.createElement("span"); nfLabel.textContent = "NF ";
      nfLabel.appendChild(copiavel(it.nf.nfNumero));
      const bs = badgeSituacao(it.nf.nfSituacao);
      const badgeNF = document.createElement("span");
      badgeNF.style.cssText = `background:${bs.bg};color:${bs.cor};border:1px solid ${bs.borda};border-radius:3px;padding:1px 6px;font-size:11px;`;
      badgeNF.textContent = it.nf.nfSituacao;
      linha2.appendChild(sep); linha2.appendChild(nfLabel); linha2.appendChild(badgeNF);
    }
    card.appendChild(linha2);

    if (it.status !== "nf_cancelada") {
      const delegarRow = document.createElement("div");
      delegarRow.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;";
      const textoTarefa = it.status === "devolucao_pendente"
        ? `↩ Processar devolução no Bling — NF ${it.nf?.nfNumero || "s/n"} — Pedido ML ${it.numeroPedido} (${it.produto}, ${valorStr})`
        : `Cancelar NF ${it.nf?.nfNumero || "s/n"} — Pedido ML ${it.numeroPedido} (${it.produto}, ${valorStr})`;
      ["Bruno","Larissa"].forEach(membro => {
        const cor = themeColor(membro);
        const btn = document.createElement("button");
        btn.textContent = `→ ${membro}`;

let precoAutoCheckLoading = false;
let estoqueAutoCheckDone = false;
let estoqueAutoLoading = false;
let estoqueAutoErro = null;
async function fetchEstoqueAutomatico(forcar) {
  if (estoqueAutoLoading) return;
  if (estoqueAutoCheckDone && !forcar) return;
  const token = state.ml_token_filial?.access_token;
  if (!token) { 
    // Sem token ainda — tenta de novo em 5s
    setTimeout(() => { estoqueAutoCheckDone = false; fetchEstoqueAutomatico(); }, 5000);
    return;
  }
  estoqueAutoLoading = true; estoqueAutoErro = null;
  try {
    const rEstoque = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?token=${token}&estoque=1`);
    const dEstoque = await rEstoque.json();
    if (!rEstoque.ok || !dEstoque.rows) throw new Error(dEstoque.error || "falha ao buscar estoque do Full");

    const rVendas = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?token=${token}&days=30`);
    const dVendas = await rVendas.json();
    const vendasPorSku = {};
    (dVendas.allProducts || []).forEach(p => {
      if (p.sku) {
        const key = String(p.sku).trim().toLowerCase().replace(/\s+/g,"");
        vendasPorSku[key] = (vendasPorSku[key] || 0) + (p.qty || 0);
      }
    });

    const rows = dEstoque.rows.map(r => ({
      ...r,
      vendas30: vendasPorSku[String(r.sku).trim().toLowerCase().replace(/\s+/g,"")] || 0,
    }));

    estoqueExcelData = { fileName: "(automático via Mercado Livre Full)", rows, automatico: true };
  } catch (e) {
    estoqueAutoErro = e.message;
    console.error("Erro ao buscar estoque automático:", e.message);
  }
  estoqueAutoLoading = false;
  estoqueAutoCheckDone = true;
  render();
}

async function checkPriceChangesAuto() {
  if (precoAutoCheckDone || precoAutoCheckLoading) return;
  const token = state.ml_token_filial?.access_token;
  if (!token) return;
  precoAutoCheckLoading = true;
  try {
    const r = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?token=${token}&prices=1`);
    const data = await r.json();
    if (!r.ok || !data.prices) { precoAutoCheckLoading = false; return; }

    const vendasPorSku = {};
    (estoqueExcelData?.rows || []).forEach(row => { vendasPorSku[row.sku] = row.vendas30 || 0; });

    data.prices.forEach(item => {
      const sku = item.sku;
      const precoAtual = Number(item.price);
      const conhecido = state.last_known_prices?.[sku];
      if (conhecido === undefined || conhecido === null) {
        // Primeira vez vendo esse SKU: só estabelece o preço base, sem gerar "mudança"
        set(ref(db, `/last_known_prices/${sku}`), precoAtual);
      } else if (Math.abs(Number(conhecido) - precoAtual) > 0.009) {
        // Preço mudou de verdade desde a última vez que verificamos
        set(ref(db, `/price_changes/${sku}`), {
          vendas30AtChange: vendasPorSku[sku] || 0,
          changedAt: Date.now(),
          changedBy: "automático",
          priceBefore: Number(conhecido),
          priceAfter: precoAtual,
        });
        set(ref(db, `/last_known_prices/${sku}`), precoAtual);
      }
    });
  } catch (e) {
    console.error("Erro na checagem automática de preço:", e.message);
  }
  precoAutoCheckLoading = false;
  precoAutoCheckDone = true;
  render();
}

async function fetchBlingProdutos() {
  estoqueBlingLoading = true;
  estoqueBlingErro = null;
  render();

  try {
    const r = await fetch(`${BLING_PROXY}/api/bling-produtos`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();

    if (data.erro) {
      // Se expirou, mostrar botão de reconectar
      if(data.erro.includes("expirado")) {
        estoqueBlingErro = "Token expirado";
      } else {
        throw new Error(data.erro);
      }
      estoqueBlingLoading = false;
      render();
      return;
    }

    // Monta mapa SKU → precoCusto
    const mapa = {};
    (data.data || []).forEach(p => {
      const sku = normSku(p.codigo);
      const custo = Number(p.precoCusto) || 0;
      if (sku) mapa[sku] = custo;
    });

    estoqueBlingData = mapa;
  } catch (e) {
    estoqueBlingErro = e.message;
  }

  estoqueBlingLoading = false;
  // Se dashboard está aberto, atualizar
  if(window._diogotab === "dashboard") render();
  else render();
}

        <span style="color:#f0b400;font-weight:600;">🟡 Amarelo (15–90d)</span> — Saudável. Acompanhar.<br>
        <span style="color:#e91e8c;font-weight:600;">🔴 Vermelho (&gt;90d)</span> — Encalhado. Precisa de ação.<br><br>
        Clique num card pra ver projeção de receita e histórico de preço.
      </div>
      <button onclick="document.getElementById('saude-help-tooltip').remove()" style="background:var(--accent);border:none;border-radius:6px;color:#000;font-size:11px;font-weight:700;letter-spacing:1px;padding:7px 16px;cursor:pointer;font-family:inherit;width:100%;">Entendido</button>
    `;
    document.body.appendChild(tooltip);
    // Fechar ao clicar fora — com delay pra não fechar imediatamente
    setTimeout(() => {
      document.addEventListener("click", e => {
        if(!tooltip.contains(e.target) && e.target !== helpBtn) tooltip.remove();
      }, { once: true });
    }, 100);
  });
  subTabWrap.appendChild(helpBtn);
  panel.appendChild(subTabWrap);

  if (window._estoqueSubTab !== "saude") {
    // ── Tabela estoque ───────────────────────────────────────────
    const tableWrap = document.createElement("div");
    tableWrap.style.cssText = "overflow-x:auto;";
    const table = document.createElement("table");
    table.style.cssText = "width:100%;border-collapse:collapse;";
    table.innerHTML = `<thead><tr style="border-bottom:1px solid var(--sep);">
      <th style="text-align:left;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1.5px;">SKU</th>
      <th style="text-align:left;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1.5px;">PRODUTO</th>
      <th style="text-align:center;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1.5px;">APTAS</th>
      <th style="text-align:center;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1.5px;">TRANSF</th>
      <th style="text-align:center;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1.5px;">PEND</th>
      <th style="text-align:right;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1.5px;">CUSTO</th>
      <th style="text-align:right;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1.5px;">VALOR</th>
    </tr></thead><tbody id="estoque-tbody"></tbody>`;
    tableWrap.appendChild(table);
    panel.appendChild(tableWrap);

    const tbody = table.querySelector("#estoque-tbody");
    enriched.forEach(r => {
      const semCusto = !r.custo;
      const custoStr = r.custo > 0 ? `R$ ${r.custo.toLocaleString("pt-BR",{minimumFractionDigits:2})}` : `<span style="color:#e91e8c;font-size:11px;">sem custo</span>`;
      const valorStr = r.valor > 0 ? `R$ ${r.valor.toLocaleString("pt-BR",{minimumFractionDigits:2})}` : "—";
      const tr = document.createElement("tr");
      tr.style.borderBottom = "1px solid var(--sep2)";
      tr.innerHTML = `
        <td style="padding:8px 8px;color:#e8e8e8;font-size:11px;white-space:nowrap;font-weight:600;">${r.sku}</td>
        <td style="padding:8px 8px;color:var(--text2);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;">${r.produto}</td>
        <td style="padding:8px 8px;text-align:center;color:${r.aptas>0?"var(--text)":"var(--text3)"};font-weight:${r.aptas>0?"500":"400"};">${r.aptas||"—"}</td>
        <td style="padding:8px 8px;text-align:center;color:var(--text3);">${r.transf||"—"}</td>
        <td style="padding:8px 8px;text-align:center;color:${r.pendente>0?"#f0b400":"var(--text3)"};font-weight:${r.pendente>0?"500":"400"};">${r.pendente||"—"}</td>
        <td style="padding:8px 8px;text-align:right;color:${semCusto?"#e91e8c":"var(--text2)"};">${custoStr}</td>
        <td style="padding:8px 8px;text-align:right;color:${semCusto?"var(--text3)":r.valor>5000?"#00dfc3":r.valor>1000?"#00dfc3":"var(--text2)"};font-weight:500;">${valorStr}</td>`;
      tbody.appendChild(tr);
    });

    if (skusSemCusto > 0 && estoqueBlingData) {
      const warn = document.createElement("div");
      warn.style.cssText = "margin-top:12px;padding:8px 12px;background:#f8711408;border:1px solid #f8711422;border-radius:5px;font-size:11px;color:#e91e8c;";
      warn.textContent = `⚠ ${skusSemCusto} SKUs sem custo no Bling — verifique o campo "Preço de Custo" no cadastro do produto.`;
      panel.appendChild(warn);
    }
  } else {
    // ── Saúde (filial SP) ────────────────────────────────────────
    renderSaudeChart(panel, enriched.filter(r => r.aptas > 0));
  }
}

function renderMatrizRS(panel, color) {
  // ── Linha superior: trocar relatório (esquerda) + ML Matriz (direita) ──
  const topRow = document.createElement("div");
  topRow.style.cssText = "display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px;";

  const uploadWrap = document.createElement("div");
  uploadWrap.style.cssText = "display:flex;align-items:center;gap:10px;flex-wrap:wrap;";

  const uploadLabel = document.createElement("label");
  uploadLabel.style.cssText = `display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:none;border:1px dashed ${color}66;border-radius:5px;color:${color};font-size:11px;letter-spacing:1.5px;cursor:pointer;`;
  uploadLabel.innerHTML = `<span>↑</span><span>Trocar relatório</span>`;
  const fileInput = document.createElement("input");
  fileInput.type = "file"; fileInput.accept = ".xlsx,.xls"; fileInput.style.display = "none";
  fileInput.addEventListener("change", async e => {
    const file = e.target.files[0]; if (!file) return;
    matrizFileName = file.name;
    try {
      matrizRows = await processarRelatorioMatriz(file);
      render();
    } catch(err) {
      console.error("Erro ao ler relatório:", err);
    }
  });
  uploadLabel.appendChild(fileInput);
  uploadWrap.appendChild(uploadLabel);

  if (matrizFileName) {
    const fn = document.createElement("span");
    fn.style.cssText = "font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px;";
    fn.textContent = matrizFileName;
    uploadWrap.appendChild(fn);
  }
  topRow.appendChild(uploadWrap);

  // Status ML Matriz
  const mlMatrizWrap = document.createElement("div");
  mlMatrizWrap.style.cssText = "display:flex;align-items:center;gap:6px;font-size:11px;";
  if(state.ml_token?.access_token){
    const nick = state.ml_token.nickname ? ` · ${state.ml_token.nickname}` : "";
    mlMatrizWrap.innerHTML = `<span style="color:#00dfc3">●</span><span style="color:var(--text3)">ML Matriz${nick}</span>`;
    const reconBtn = document.createElement("button");
    reconBtn.textContent = "Reconectar";
    reconBtn.style.cssText = "background:none;border:1px solid var(--border2);color:var(--text3);border-radius:3px;padding:2px 8px;font-size:11px;cursor:pointer;letter-spacing:1px;margin-left:4px;";
    reconBtn.addEventListener("click", () => window.open(`${VERCEL_BACKEND}/api/ml-auth?conta=matriz`, "_blank"));
    mlMatrizWrap.appendChild(reconBtn);
  }else{
    mlMatrizWrap.innerHTML = `<span style="color:var(--text3)">ML Matriz desconectado</span>`;
    const connBtn = document.createElement("button");
    connBtn.textContent = "Conectar ML Matriz";
    connBtn.style.cssText = "background:none;border:1px solid #f0b40066;color:#f0b400;border-radius:3px;padding:2px 8px;font-size:11px;cursor:pointer;letter-spacing:1px;margin-left:4px;";
    connBtn.addEventListener("click", () => window.open(`${VERCEL_BACKEND}/api/ml-auth?conta=matriz`, "_blank"));
    mlMatrizWrap.appendChild(connBtn);
  }
  topRow.appendChild(mlMatrizWrap);

  panel.appendChild(topRow);

  if (!matrizRows || matrizRows.length === 0) {
    const empty = document.createElement("div");
    empty.style.cssText = "text-align:center;padding:40px 0;color:var(--text3);font-size:11px;";
    empty.textContent = "Importe o relatório de estoque do Bling (Matriz RS)";
    panel.appendChild(empty);
    return;
  }

  // ── Cards resumo Matriz ──────────────────────────────────────
  const totalValor = matrizRows.reduce((s,r) => s + r.valor, 0);
  const totalQty   = matrizRows.reduce((s,r) => s + r.qty, 0);
  const custoMedio = totalQty > 0 ? totalValor / totalQty : 0;
  const resumo = document.createElement("div");
  resumo.style.cssText = "display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;";
  [
    { label:"VALOR EM ESTOQUE", value:`R$ ${totalValor.toLocaleString("pt-BR",{minimumFractionDigits:2})}`, color:"#00dfc3", sub:`${matrizRows.length} SKUs` },
    { label:"UNIDADES", value: totalQty.toLocaleString("pt-BR"), color:"#5e72e4", sub:"peças" },
    { label:"CUSTO MÉDIO/UN", value:`R$ ${custoMedio.toLocaleString("pt-BR",{minimumFractionDigits:2})}`, color:"#7F77DD", sub:"ponderado" },
  ].forEach(s => {
    const card = document.createElement("div");
    card.style.cssText = `background:linear-gradient(to top,#252525 0%,#000 100%);border:1px solid #333;border-radius:8px;padding:14px 16px;border-top:2px solid ${s.color};`;
    card.innerHTML = `<div style="font-size:11px;color:var(--text3);letter-spacing:2px;margin-bottom:8px;text-transform:uppercase;">${s.label}</div><div style="font-size:24px;font-weight:600;color:${s.color};text-shadow:0 0 16px ${s.color}66;">${s.value}</div><div style="font-size:11px;color:var(--text3);margin-top:4px;">${s.sub}</div>`;
    resumo.appendChild(card);
  });
  panel.appendChild(resumo);

  // ── Sub-abas Estoque / Saúde Matriz ──────────────────────────
  if (!window._matrizSubTab) window._matrizSubTab = "estoque";
  const subTabWrap = document.createElement("div");
  subTabWrap.style.cssText = "display:flex;border-bottom:1px solid var(--sep);margin-bottom:14px;";
  ["estoque","saude"].forEach(st => {
    const btn = document.createElement("button");
    const active = window._matrizSubTab === st;
    btn.style.cssText = `padding:7px 14px;background:none;border:none;font-family:inherit;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;color:${active?"var(--text)":"var(--text3)"};border-bottom:2px solid ${active?"var(--text)":"transparent"};margin-bottom:-1px;transition:all 0.15s;`;
    btn.textContent = st === "estoque" ? "Estoque" : "Saúde";
    btn.addEventListener("click", () => { window._matrizSubTab = st; render(); });
    subTabWrap.appendChild(btn);
  });
  panel.appendChild(subTabWrap);

  if (window._matrizSubTab !== "saude") {
    // ── Tabela estoque Matriz ────────────────────────────────────
    const tableWrap = document.createElement("div");
    tableWrap.style.cssText = "overflow-x:auto;";
    const table = document.createElement("table");
    table.style.cssText = "width:100%;border-collapse:collapse;";
    table.innerHTML = `<thead><tr style="border-bottom:1px solid var(--sep);">
      <th style="text-align:left;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1.5px;">SKU</th>
      <th style="text-align:left;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1.5px;">PRODUTO</th>
      <th style="text-align:center;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1.5px;">QTD</th>
      <th style="text-align:right;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1.5px;">CUSTO</th>
      <th style="text-align:right;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1.5px;">VALOR</th>
    </tr></thead><tbody></tbody>`;
    tableWrap.appendChild(table);
    panel.appendChild(tableWrap);

    const tbody = table.querySelector("tbody");
    [...matrizRows].sort((a,b) => b.valor - a.valor).forEach(r => {
      const tr = document.createElement("tr");
      tr.style.borderBottom = "1px solid var(--sep2)";
      tr.innerHTML = `
        <td style="padding:8px 8px;color:#e8e8e8;font-size:11px;white-space:nowrap;font-weight:600;">${r.sku}</td>
        <td style="padding:8px 8px;color:var(--text2);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;">${r.produto}</td>
        <td style="padding:8px 8px;text-align:center;color:${r.qty>0?"var(--text)":"var(--text3)"};font-weight:${r.qty>0?"500":"400"};">${r.qty||"—"}</td>
        <td style="padding:8px 8px;text-align:right;color:var(--text2);">${r.custo>0?`R$ ${r.custo.toLocaleString("pt-BR",{minimumFractionDigits:2})}`:"—"}</td>
        <td style="padding:8px 8px;text-align:right;color:${r.valor>5000?"#00dfc3":r.valor>1000?"#00dfc3":"var(--text2)"};font-weight:500;">${r.valor>0?`R$ ${r.valor.toLocaleString("pt-BR",{minimumFractionDigits:2})}`:"—"}</td>`;
      tbody.appendChild(tr);
    });
  } else {
    // ── Saúde Matriz ─────────────────────────────────────────────
    // Usa vendas da filial SP como referência de giro
    const filialVendas = {};
    if (estoqueExcelData?.rows) {
      estoqueExcelData.rows.forEach(r => { filialVendas[r.sku] = r.vendas30 || 0; });
    }
    const matrizEnriched = matrizRows.map(r => ({
      ...r,
      aptas: r.qty,
      vendas30: filialVendas[r.sku] || 0,
      custo: r.custo,
      valor: r.valor,
    }));
    renderSaudeChart(panel, matrizEnriched.filter(r => (r.aptas||r.qty||0) > 0));
  }
}

function renderSaudeChart(panel, enriched) {
  const saudeWrap = document.createElement("div");
  saudeWrap.style.cssText = "font-family:system-ui,-apple-system,sans-serif;";

  // Legenda
  const leg = document.createElement("div");
  leg.style.cssText = "display:flex;gap:14px;margin-bottom:14px;font-size:11px;flex-wrap:wrap;";
  [{c:"#00ffb8",l:"<15d — subir"},{c:"#f0b400",l:"15–90d — acompanhar"},{c:"#e91e8c",l:">90d — baixar"}].forEach(({c,l}) => {
    const s = document.createElement("span");
    s.style.cssText = "display:flex;align-items:center;gap:4px;color:var(--text3);";
    s.innerHTML = '<span style="width:8px;height:8px;border-radius:2px;background:' + c + ';display:inline-block;flex-shrink:0;"></span>' + l;
    leg.appendChild(s);
  });
  saudeWrap.appendChild(leg);

  // Grade de chips
  const grade = document.createElement("div");
  grade.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;";

  // Card de detalhe (aparece abaixo da grade)
  const detWrap = document.createElement("div");

  const saudeRows = [...enriched].map(r => {
    const vendas30 = Number(r.vendas30) || 0;
    const aptas = Number(r.aptas || r.qty || 0);
    const dias = vendas30 > 0 ? Math.round(aptas / (vendas30 / 30)) : 999;
    return {...r, vendas30, aptas, dias};
  }).sort((a,b) => b.dias - a.dias);

  const cor = d => d.dias <= 15 ? "#00ffb8" : d.dias <= 90 ? "#f0b400" : "#e91e8c";
  const categoriaKey = d => d.dias <= 15 ? "verde" : d.dias <= 90 ? "amarelo" : "vermelho";
  const badgeText = d => d.dias <= 15 ? "↑ SUBIR" : d.dias <= 90 ? "~ ACOMPANHAR" : "↓ BAIXAR";
  const diasLabel = d => d.dias >= 999 ? "sem vendas" : d.dias + "d";

  let activeChip = null;
  let activeDet = null;

  saudeRows.forEach(d => {
    const c = cor(d);
    const skuKey = String(d.sku).replace(/[.#$\[\]\/]/g, "_"); // Firebase não aceita esses caracteres em chaves
    const catAtual = categoriaKey(d);
    const registro = state.categoria_saude?.[skuKey];
    let mostrarPonto = false;
    if (!registro) {
      // primeira vez vendo esse SKU — só grava a categoria atual como referência, sem marcar mudança
      set(ref(db, `/categoria_saude/${skuKey}`), { categoria: catAtual, vista: true });
    } else if (registro.categoria !== catAtual) {
      // categoria mudou desde a última vez — marca como não visto ainda
      set(ref(db, `/categoria_saude/${skuKey}`), { categoria: catAtual, vista: false });
      mostrarPonto = true;
    } else if (registro.vista === false) {
      mostrarPonto = true;
    }

    const chip = document.createElement("div");
    chip.style.cssText = "position:relative;display:flex;flex-direction:column;gap:3px;padding:8px 10px;border-radius:6px;border:1px solid " + c + "28;border-top:2px solid " + c + ";background:linear-gradient(135deg," + c + "18 0%,#161616 65%);cursor:pointer;min-width:110px;transition:all 0.15s;";
    chip.innerHTML =
      (mostrarPonto ? '<div style="position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:' + c + ';box-shadow:0 0 4px ' + c + ';"></div>' : '') +
      '<div style="font-size:11px;color:' + c + ';font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;">' + d.sku + '</div>' +
      '<div style="font-size:12px;font-weight:600;color:' + c + ';">' + diasLabel(d) + '</div>' +
      '<div style="font-size:11px;color:#aaa;">R$' + Math.round(d.valor / 1000) + 'k · ' + d.vendas30 + '/mês</div>';

    chip.addEventListener("click", () => {
      if (mostrarPonto) update(ref(db, `/categoria_saude/${skuKey}`), { vista: true });
      if (activeDet) activeDet.remove();
      if (activeChip) activeChip.style.outline = "none";
      if (activeChip === chip) { activeChip = null; activeDet = null; return; }

      chip.style.outline = "2px solid " + c;
      activeChip = chip;

      const msg = d.dias >= 999
        ? "Nenhuma venda nos últimos 30 dias. Avalie promoção ou liquidação."
        : d.dias >= 90
        ? "Com " + d.vendas30 + " vendas/mês e " + d.aptas + " un, leva ~" + d.dias + " dias pra zerar. Considere reduzir o preço."
        : d.dias <= 15
        ? "Acabando rápido. Dura só " + d.dias + " dias. Considere subir o preço ou antecipar reposição."
        : "Giro equilibrado. Com " + d.vendas30 + " vendas/mês dura ~" + d.dias + " dias.";

      const det = document.createElement("div");
      det.style.cssText = "margin-top:12px;padding:12px 16px;background:var(--bg3);border-left:3px solid " + c + ";border-radius:0 8px 8px 0;";
      det.innerHTML =
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;">' +
          '<div style="font-size:13px;font-weight:600;color:' + c + ';">' + d.sku + '</div>' +
          '<span style="background:' + c + '22;color:' + c + ';border:1px solid ' + c + '55;border-radius:4px;padding:3px 10px;font-size:11px;letter-spacing:1px;font-weight:500;">' + badgeText(d) + '</span>' +
        '</div>' +
        '<div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:10px;">' +
          '<div><div style="font-size:11px;color:var(--text3);letter-spacing:1px;margin-bottom:3px;">VALOR EM ESTOQUE</div><div style="font-size:16px;font-weight:600;color:' + c + ';">' + (d.valor > 0 ? "R$ " + d.valor.toLocaleString("pt-BR") : "—") + '</div></div>' +
          '<div><div style="font-size:11px;color:var(--text3);letter-spacing:1px;margin-bottom:3px;">VENDAS 30D</div><div style="font-size:16px;font-weight:500;color:var(--text);">' + d.vendas30 + ' un</div></div>' +
          '<div><div style="font-size:11px;color:var(--text3);letter-spacing:1px;margin-bottom:3px;">DIAS ESTOQUE</div><div style="font-size:16px;font-weight:600;color:' + c + ';">' + diasLabel(d) + '</div></div>' +
          '<div><div style="font-size:11px;color:var(--text3);letter-spacing:1px;margin-bottom:3px;">UNIDADES</div><div style="font-size:16px;font-weight:500;color:var(--text);">' + d.aptas + '</div></div>' +
        '</div>' +
        '<div style="font-size:12px;color:var(--text3);line-height:1.6;font-family:system-ui,sans-serif;">' + msg + '</div>';

      // ── Projeção do mês ─────────────────────────────────────────────────────
      const projSection = document.createElement("div");
      projSection.style.cssText = "margin-top:14px;padding-top:12px;border-top:1px solid var(--sep);";
      if(d.vendas30 > 0) {
        const precoVenda = state.last_known_prices?.[d.sku] || state.precos_venda_manual?.[d.sku] || 0;
        const receitaProj = d.vendas30 * precoVenda;
        const ritmo = (d.vendas30 / 30).toFixed(1);
        const diaAtual = new Date().getDate();
        const diasMes = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
        const percMes = Math.round((diaAtual / diasMes) * 100);
        const ruptura = d.dias < 999 ? `em ~${d.dias} dias` : "sem previsão";
        const rupturaColor = d.dias <= 15 ? "#e91e8c" : d.dias <= 60 ? "#f0b400" : "#22c55e";

        projSection.innerHTML = `
          <div style="font-size:8px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;">Projeção do mês</div>
          <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:10px;">
            ${precoVenda > 0 ? `<div>
              <div style="font-size:11px;color:var(--text3);margin-bottom:2px;">Receita projetada</div>
              <div style="font-size:15px;font-weight:600;color:${c};">R$ ${receitaProj.toLocaleString("pt-BR",{minimumFractionDigits:0})}</div>
              <div style="font-size:11px;color:var(--text3);margin-top:2px;">${d.vendas30} un × R$ ${precoVenda.toFixed(0)}</div>
            </div>` : ""}
            <div>
              <div style="font-size:11px;color:var(--text3);margin-bottom:2px;">Ritmo atual</div>
              <div style="font-size:15px;font-weight:600;color:var(--text);">${ritmo} un/dia</div>
            </div>
            <div>
              <div style="font-size:11px;color:var(--text3);margin-bottom:2px;">Ruptura prevista</div>
              <div style="font-size:15px;font-weight:600;color:${rupturaColor};">${ruptura}</div>
            </div>
          </div>
          <div style="background:var(--bg2);border-radius:99px;height:4px;margin-bottom:4px;">
            <div style="height:4px;border-radius:99px;background:${c};width:${percMes}%;"></div>
          </div>
          <div style="font-size:11px;color:var(--text3);">${percMes}% do mês percorrido</div>
        `;
      }
      det.appendChild(projSection);

      const priceSection = document.createElement("div");
      priceSection.style.cssText = "margin-top:14px;padding-top:12px;border-top:1px solid var(--sep);";
      const pc = state.price_changes && state.price_changes[d.sku];
      const mlFilialOn = !!state.ml_token_filial?.access_token;

      function buildRealSalesBlock(){
        const wrap = document.createElement("div");
        const header = document.createElement("div");
        header.style.cssText = "font-size:11px;color:var(--text3);letter-spacing:1px;margin-bottom:8px;";
        header.textContent = "VENDAS REAIS NO ML DESDE A MUDANÇA";
        wrap.appendChild(header);
        const statsRow = document.createElement("div");
        statsRow.style.cssText = "display:flex;align-items:center;gap:20px;flex-wrap:wrap;";
        wrap.appendChild(statsRow);
        const actionsRow = document.createElement("div");
        actionsRow.style.cssText = "margin-top:16px;";
        wrap.appendChild(actionsRow);
        const listWrap = document.createElement("div");
        listWrap.style.cssText = "display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--sep);max-height:220px;overflow-y:auto;";
        wrap.appendChild(listWrap);
        let listaCarregada = false;
        let ultimoRdata = null;

        const buscar = async () => {
          statsRow.innerHTML = '<span class="spinning" style="color:var(--text3)">↻</span> <span style="color:var(--text3);font-size:11px;">Consultando Mercado Livre...</span>';
          actionsRow.innerHTML = "";
          try{
            const fromISO = new Date(pc.changedAt).toISOString();
            const url = `${VERCEL_BACKEND}/api/ml-vendas?token=${state.ml_token_filial.access_token}&sku=${encodeURIComponent(d.sku)}&from=${encodeURIComponent(fromISO)}`;
            const r = await fetch(url);
            const rdata = await r.json();
            ultimoRdata = rdata;
            if(!r.ok || rdata.error){
              statsRow.innerHTML = `<span style="color:#e91e8c;font-size:11px;">Erro: ${rdata.error||"falha na consulta"}</span>`;
              return;
            }
            const m = rdata.skuMatch;
            if(!m || m.qty===0){
              const lista = rdata.skusVendidosNoPeriodo || [];
              const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
              const skuNorm = norm(d.sku);
              const parecidos = lista.filter(s => skuNorm.length>=6 && (norm(s).includes(skuNorm.slice(0,6)) || skuNorm.includes(norm(s).slice(0,6))));
              let extra = "";
              if(parecidos.length){
                extra = ' <span style="color:#f0b400;">⚠ achei SKU parecido nas vendas: ' + parecidos.join(", ") + '</span>';
              }
              statsRow.innerHTML = '<span style="color:var(--text3);font-size:11px;">Nenhuma venda registrada desde a mudança.' + extra + '</span>';
            }else{
              statsRow.innerHTML =
                '<div><div style="font-size:11px;color:var(--text3);">UNIDADES</div><div style="font-size:15px;font-weight:600;color:#f0b400;">' + m.qty + '</div></div>' +
                '<div><div style="font-size:11px;color:var(--text3);">FATURAMENTO</div><div style="font-size:15px;font-weight:600;color:#f0b400;">R$ ' + m.revenue.toLocaleString("pt-BR",{minimumFractionDigits:2}) + '</div></div>';
              const toggleBtn = document.createElement("button");
              toggleBtn.textContent = "Ver lista";
              toggleBtn.style.cssText = "background:none;border:1px solid var(--border2);color:var(--text3);border-radius:4px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:inherit;letter-spacing:0.5px;";
              toggleBtn.addEventListener("click", () => {
                const vis = listWrap.style.display !== "none";
                if(vis){ listWrap.style.display = "none"; toggleBtn.textContent = "Ver lista"; return; }
                toggleBtn.textContent = "Esconder lista";
                listWrap.style.display = "block";
                if(!listaCarregada){
                  listaCarregada = true;
                  const itens = ultimoRdata.skuVendasDetalhe || [];
                  if(!itens.length){
                    listWrap.innerHTML = '<span style="font-size:11px;color:var(--text3);">Sem detalhe disponível.</span>';
                  }else{
                    listWrap.innerHTML = itens.map(v => {
                      const dt = new Date(v.date).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
                      return '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--sep);font-size:11px;">' +
                        '<span style="color:var(--text3);">' + dt + '</span>' +
                        '<span>' + v.qty + ' un</span>' +
                        '<span style="color:var(--text2);">R$ ' + v.total.toLocaleString("pt-BR",{minimumFractionDigits:2}) + '</span>' +
                      '</div>';
                    }).join("");
                  }
                }
              });
              actionsRow.appendChild(toggleBtn);
            }
          }catch(err){
            statsRow.innerHTML = `<span style="color:#e91e8c;font-size:11px;">Erro de conexão: ${err.message}</span>`;
          }
        };
        buscar(); // busca automática ao abrir o card, sem precisar clicar
        return wrap;
      }

      if(pc){
        const diasDesde = Math.max(1, Math.round((Date.now()-pc.changedAt)/86400000));
        const info = document.createElement("div");
        info.style.cssText = "margin-bottom:10px;";
        if(pc.priceBefore!=null && pc.priceAfter!=null){
          const subiu = Number(pc.priceAfter) > Number(pc.priceBefore);
          const precoColor = subiu ? "#22c55e" : "#5e72e4";
          const diff = Number(pc.priceAfter) - Number(pc.priceBefore);
          const diffPct = ((diff / Number(pc.priceBefore)) * 100).toFixed(1);
          const vendasAntes = pc.vendas30AtChange || 0;
          const vendasDepois = d.vendas30 || 0;
          const varVendas = vendasAntes > 0 ? (((vendasDepois - vendasAntes) / vendasAntes) * 100).toFixed(0) : null;

          info.innerHTML =
            '<div style="font-size:11px;color:var(--text3);letter-spacing:1px;margin-bottom:8px;">MUDANÇA DE PREÇO · há ' + diasDesde + 'd</div>' +
            '<div style="background:var(--bg2);border-radius:8px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;">' +
              '<div style="font-size:13px;color:#888;text-decoration:line-through;">R$ ' + Number(pc.priceBefore).toFixed(2) + '</div>' +
              '<div style="color:var(--text3);">→</div>' +
              '<div style="font-size:13px;font-weight:700;color:' + precoColor + ';">R$ ' + Number(pc.priceAfter).toFixed(2) + '</div>' +
              '<div style="font-size:11px;color:' + precoColor + ';margin-left:4px;">' + (subiu ? "+" : "") + diffPct + '%</div>' +
              '<div style="margin-left:auto;font-size:11px;color:var(--text3);">' + (pc.changedBy || "automático") + '</div>' +
            '</div>' +
            (vendasAntes > 0 ? 
              '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">' +
                '<div style="background:var(--bg2);border-radius:7px;padding:10px;">' +
                  '<div style="font-size:8px;color:var(--text3);letter-spacing:1px;margin-bottom:4px;">ANTES (R$ ' + Number(pc.priceBefore).toFixed(0) + ')</div>' +
                  '<div style="font-size:18px;font-weight:700;color:#888;">' + vendasAntes + ' un</div>' +
                  '<div style="font-size:11px;color:var(--text3);margin-top:2px;">em 30 dias</div>' +
                '</div>' +
                '<div style="background:var(--bg2);border-radius:7px;padding:10px;">' +
                  '<div style="font-size:8px;color:var(--text3);letter-spacing:1px;margin-bottom:4px;">DEPOIS (R$ ' + Number(pc.priceAfter).toFixed(0) + ')</div>' +
                  '<div style="font-size:18px;font-weight:700;color:' + (varVendas > 0 ? "#22c55e" : "#e91e8c") + ';">' + (varVendas > 0 ? "+" : "") + varVendas + '%</div>' +
                  '<div style="font-size:11px;color:var(--text3);margin-top:2px;">' + vendasDepois + ' un em ' + diasDesde + 'd ↑</div>' +
                '</div>' +
              '</div>'
            : "");
        }else{
          info.innerHTML = '<div style="font-size:11px;color:var(--text3);letter-spacing:1px;">MUDANÇA DE PREÇO · há ' + diasDesde + 'd</div>';
        }
        priceSection.appendChild(info);

        if(mlFilialOn){
          priceSection.appendChild(buildRealSalesBlock());
        }else{
          const hint = document.createElement("div");
          hint.style.cssText = "font-size:11px;color:var(--text3);line-height:1.5;";
          hint.textContent = "Conecte o ML Filial (no topo da aba) pra ver as vendas reais desde essa mudança.";
          priceSection.appendChild(hint);
        }
      }else if(mlFilialOn){
        const hint = document.createElement("div");
        hint.style.cssText = "font-size:11px;color:var(--text3);line-height:1.5;";
        hint.textContent = "Assim que o preço desse SKU mudar no Mercado Livre, o painel detecta sozinho na próxima vez que você abrir a aba Estoque.";
        priceSection.appendChild(hint);
      }else{
        const markBtn = document.createElement("button");
        markBtn.textContent = "📌 Marquei mudança de preço agora";
        markBtn.style.cssText = `background:none;border:1px dashed ${c}66;color:${c};border-radius:5px;padding:7px 12px;font-size:11px;cursor:pointer;font-family:inherit;letter-spacing:1px;width:100%;`;
        markBtn.addEventListener("click",()=>{set(ref(db,`/price_changes/${d.sku}`),{vendas30AtChange:d.vendas30,changedAt:Date.now(),changedBy:currentUser});});
        priceSection.appendChild(markBtn);
        const hint = document.createElement("div");
        hint.style.cssText = "font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5;";
        hint.textContent = "Conecte o ML Filial (no topo da aba) pra isso ficar automático.";
        priceSection.appendChild(hint);
      }
      det.appendChild(priceSection);

      detWrap.appendChild(det);
      activeDet = det;
    });

    grade.appendChild(chip);
  });



  saudeWrap.appendChild(grade);
  saudeWrap.appendChild(detWrap);
  panel.appendChild(saudeWrap);
}



// ── FECHAMENTO MENSAL ────────────────────────────────────────────────────────
let fechamentoMes = new Date().toISOString().slice(0, 7); // "2026-07"
let fechamentoData = null;   // resultado do buscar
let fechamentoLoading = false;
let fechamentoErro = null;
// Sobrescritas manuais por fornecedor: { cnpj: { confirmado: bool, fileId: string, fileName: string, fileLocal: File } }
let fechamentoOverrides = {};

async function fetchFechamento(mes) {
  if(fechamentoLoading) return;
  fechamentoLoading = true; fechamentoErro = null; fechamentoData = null;
  // Atualiza só o spinner sem chamar render() geral
  const p = document.getElementById("fechamento-panel");
  if(p) {
    p.innerHTML = "";
    const l = document.createElement("div");
    l.style.cssText = "text-align:center;padding:40px 0;color:var(--text3);font-size:12px;";
    l.innerHTML = '<span class="spinning">↻</span> Buscando NFS-e no Gmail e Drive...';
    p.appendChild(l);
  }
  try {
    const r = await fetch(`${VERCEL_BACKEND}/api/google?action=buscar&mes=${mes}`);
    const d = await r.json();
    if(!r.ok || !d.ok) throw new Error(d.error || "falha ao buscar");
    fechamentoData = d;
  } catch(e) {
    fechamentoErro = e.message;
  }
  fechamentoLoading = false;
  const p2 = document.getElementById("fechamento-panel");
  if(p2){ p2.innerHTML=""; renderFechamentoMensal(p2, themeColor("Diogo")); }
}

function renderFechamentoMensal(panel, color) {
  const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const [ano, mesNum] = fechamentoMes.split("-");
  const nomeMes = `${MESES[Number(mesNum)-1]} ${ano}`;

  // Header
  const header = document.createElement("div");
  header.style.cssText = "display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;";

  const monthWrap = document.createElement("div");
  monthWrap.style.cssText = "display:flex;align-items:center;gap:8px;";

  const prevBtn = document.createElement("button");
  prevBtn.textContent = "‹";
  prevBtn.style.cssText = "background:none;border:1px solid var(--border2);color:var(--text2);border-radius:4px;padding:2px 10px;cursor:pointer;font-size:18px;";
  prevBtn.addEventListener("click", () => {
    const [y, m] = fechamentoMes.split("-").map(Number);
    fechamentoMes = `${m===1?y-1:y}-${String(m===1?12:m-1).padStart(2,"0")}`;
    fechamentoData = null; fechamentoOverrides = {};
    const p = document.getElementById("fechamento-panel");
    if(p){ p.innerHTML=""; renderFechamentoMensal(p, color); }
  });

  const monthLabel = document.createElement("span");
  monthLabel.style.cssText = "font-size:14px;font-weight:600;color:var(--text);min-width:120px;text-align:center;";
  monthLabel.textContent = nomeMes;

  const nextBtn = document.createElement("button");
  nextBtn.textContent = "›";
  nextBtn.style.cssText = "background:none;border:1px solid var(--border2);color:var(--text2);border-radius:4px;padding:2px 10px;cursor:pointer;font-size:18px;";
  nextBtn.addEventListener("click", () => {
    const [y, m] = fechamentoMes.split("-").map(Number);
    fechamentoMes = `${m===12?y+1:y}-${String(m===12?1:m+1).padStart(2,"0")}`;
    fechamentoData = null; fechamentoOverrides = {};
    const p = document.getElementById("fechamento-panel");
    if(p){ p.innerHTML=""; renderFechamentoMensal(p, color); }
  });

  monthWrap.appendChild(prevBtn); monthWrap.appendChild(monthLabel); monthWrap.appendChild(nextBtn);

  const rightWrap = document.createElement("div");
  rightWrap.style.cssText = "display:flex;gap:8px;align-items:center;";

  const uploadLabel = document.createElement("label");
  uploadLabel.style.cssText = `display:inline-flex;align-items:center;gap:5px;padding:6px 14px;background:none;border:1px dashed ${color}66;border-radius:5px;color:${color};font-size:11px;cursor:pointer;font-family:inherit;letter-spacing:1px;`;
  uploadLabel.textContent = "↑ Importar planilha";
  const fileInput = document.createElement("input");
  fileInput.type = "file"; fileInput.accept = ".csv,.xlsx,.xls"; fileInput.style.display = "none";
  fileInput.addEventListener("change", async e => {
    const file = e.target.files[0]; if(!file) return;
    await processarPlanilhaFechamento(file, null, nomeMes, color);
  });
  uploadLabel.appendChild(fileInput);
  rightWrap.appendChild(uploadLabel);
  header.appendChild(monthWrap); header.appendChild(rightWrap);
  panel.appendChild(header);

  // Dados
  const dadosSalvos = state.fechamentos?.[fechamentoMes.replace("-","_")];
  const notas = fechamentoData?.notas || dadosSalvos?.notas || [];
  const savedAt = dadosSalvos?.savedAt;

  if(notas.length === 0) {
    const info = document.createElement("div");
    info.style.cssText = "text-align:center;padding:50px 20px;color:var(--text3);font-size:11px;line-height:2.2;";
    info.innerHTML = `Faça o consolidado de NFS-e aqui no chat e exporte como planilha.<br>Depois clique em <strong style="color:${color}">↑ Importar planilha</strong> para conferir e salvar.`;
    panel.appendChild(info);
    return;
  }

  if(savedAt) {
    const statusBar = document.createElement("div");
    statusBar.style.cssText = "font-size:11px;color:var(--text3);margin-bottom:12px;text-align:right;letter-spacing:0.5px;";
    statusBar.textContent = `✓ Salvo em ${new Date(savedAt).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}`;
    panel.appendChild(statusBar);
  }

  const notasState = notas.map((nf, i) => ({ ...nf, _idx: i, _removido: false }));

  function parseValorStr(v) {
    const s = String(v||"").trim().replace(/\s/g,"");
    if (!s) return 0;
    if (s.includes(",") && s.lastIndexOf(",") > s.lastIndexOf("."))
      return parseFloat(s.replace(/\./g,"").replace(",",".")) || 0;
    return parseFloat(s.replace(",","")) || 0;
  }

  function fmtValor(v) {
    const n = parseValorStr(v);
    return n > 0 ? n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}) : "";
  }

  const cardsWrap = document.createElement("div");
  cardsWrap.style.cssText = "display:flex;flex-direction:column;gap:10px;margin-bottom:10px;";
  panel.appendChild(cardsWrap);

  function inpClean(val, placeholder, cor, mono) {
    const inp = document.createElement("input");
    const vazio = !val || String(val).toUpperCase().includes("NÃO") || String(val) === "—";
    inp.value = vazio ? "" : (val || "");
    inp.placeholder = vazio ? "⚠ preencher" : (placeholder || "");
    inp.style.cssText = `background:none;border:none;border-bottom:1px solid ${vazio?"#e91e8c44":"transparent"};color:${vazio?"#e91e8c":(cor||"var(--text)")};font-family:${mono?"var(--font-mono, monospace)":"inherit"};font-size:inherit;padding:0;outline:none;width:100%;`;
    inp.addEventListener("focus", () => inp.style.borderBottomColor = color);
    inp.addEventListener("blur",  () => { inp.style.borderBottomColor = "transparent"; if(inp.value) inp.style.color = cor||"var(--text)"; });
    return inp;
  }

  function renderCards() {
    cardsWrap.innerHTML = "";
    const ativas = notasState.filter(nf => !nf._removido);
    let total = 0;

    ativas.forEach(nf => {
      const valNum = parseValorStr(nf.valor);
      const semValor = !nf.valor || parseValorStr(nf.valor) === 0;
      total += valNum;

      const card = document.createElement("div");
      card.style.cssText = `background:var(--bg3);border:1px solid ${semValor?"#f0b40044":"var(--border)"};border-radius:10px;padding:14px 16px;`;

      // Linha topo: nome + valor
      const topo = document.createElement("div");
      topo.style.cssText = "display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:12px;";

      const nomeWrap = document.createElement("div");
      nomeWrap.style.cssText = "flex:1;min-width:0;";
      const iNome = inpClean(nf.fornecedor, "Prestador", "var(--text)");
      iNome.style.cssText += "font-size:13px;font-weight:600;";
      iNome.addEventListener("input", () => { nf.fornecedor = iNome.value; });
      const iCnpj = inpClean(nf.cnpj, "CNPJ", "var(--text3)", true);
      iCnpj.style.cssText += "font-size:11px;margin-top:2px;";
      iCnpj.addEventListener("input", () => { nf.cnpj = iCnpj.value; });
      nomeWrap.appendChild(iNome); nomeWrap.appendChild(iCnpj);

      const valorWrap = document.createElement("div");
      valorWrap.style.cssText = "text-align:right;flex-shrink:0;";
      const vLabel = document.createElement("div");
      vLabel.style.cssText = "font-size:11px;color:var(--text3);margin-bottom:2px;";
      vLabel.textContent = "Valor";
      const iValWrap = document.createElement("div");
      iValWrap.style.cssText = "display:flex;align-items:baseline;gap:3px;justify-content:flex-end;";
      const rSign = document.createElement("span");
      rSign.style.cssText = "font-size:11px;color:var(--text3);";
      rSign.textContent = "R$";
      const iVal = inpClean(fmtValor(nf.valor), "0,00", semValor?"#f0b400":"#4ade80");
      iVal.style.cssText += `font-size:15px;font-weight:600;text-align:right;width:90px;color:${semValor?"#f0b400":"#4ade80"};`;
      iVal.addEventListener("input", () => {
        nf.valor = iVal.value;
        iVal.style.color = "#4ade80";
        card.style.borderColor = "var(--border)";
        atualizarTotal();
      });
      iValWrap.appendChild(rSign); iValWrap.appendChild(iVal);
      valorWrap.appendChild(vLabel); valorWrap.appendChild(iValWrap);

      topo.appendChild(nomeWrap); topo.appendChild(valorWrap);
      card.appendChild(topo);

      // Linha detalhes: NF · Serviço · Emissão
      const detalhes = document.createElement("div");
      detalhes.style.cssText = "display:flex;gap:20px;border-top:1px solid var(--border2);padding-top:10px;align-items:flex-start;flex-wrap:wrap;";

      function detalheCol(label, val, cor, mono, width) {
        const col = document.createElement("div");
        col.style.cssText = `${width?"width:"+width+";flex-shrink:0;":"flex:1;min-width:80px;"}`;
        const lbl = document.createElement("div");
        lbl.style.cssText = "font-size:11px;color:var(--text3);margin-bottom:3px;letter-spacing:0.03em;";
        lbl.textContent = label;
        const inp = inpClean(val, "—", cor||"var(--text2)", mono);
        inp.style.fontSize = "12px";
        col.appendChild(lbl); col.appendChild(inp);
        return { col, inp };
      }

      const nfCol   = detalheCol("Nº nota", nf.numero, "var(--text-accent, #00dfc3)", true, "80px");
      nfCol.inp.addEventListener("input", () => { nf.numero = nfCol.inp.value; });
      const servCol = detalheCol("Serviço", nf.servico, "var(--text2)");
      servCol.inp.addEventListener("input", () => { nf.servico = servCol.inp.value; });
      const emisCol = detalheCol("Emissão", nf.emissao, "var(--text3)", false, "80px");
      emisCol.inp.addEventListener("input", () => { nf.emissao = emisCol.inp.value; });

      // Botão remover
      const delBtn = document.createElement("button");
      delBtn.textContent = "×";
      delBtn.style.cssText = "background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;opacity:0.3;padding:0;margin-left:auto;align-self:flex-end;";
      delBtn.addEventListener("click", () => { nf._removido = true; renderCards(); atualizarTotal(); });

      detalhes.appendChild(nfCol.col);
      detalhes.appendChild(servCol.col);
      detalhes.appendChild(emisCol.col);
      detalhes.appendChild(delBtn);
      card.appendChild(detalhes);
      cardsWrap.appendChild(card);
    });

    // Card total
    let totalCard = document.getElementById("fechamento-total-card");
    if(!totalCard) {
      totalCard = document.createElement("div");
      totalCard.id = "fechamento-total-card";

// ── Parser planilha de fechamento ────────────────────────────
async function processarPlanilhaFechamento(file, fbKey, nomeMes, color) {
  try {
    const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
    const arrayBuffer = await file.arrayBuffer();
    const wb   = XLSX.read(arrayBuffer, { type:"array" });
    const ws   = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:"" });

    // Acha linha do cabeçalho — tem "Fornecedor" e "CNPJ"
    let headerIdx = -1;
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i].map(c => String(c||"").toLowerCase());
      if (row.some(c => c.includes("fornecedor") || c.includes("prestador")) &&
          row.some(c => c.includes("cnpj"))) {
        headerIdx = i; break;
      }
    }
    if (headerIdx === -1) { alert("Cabeçalho não encontrado. Verifique se a planilha tem colunas Fornecedor e CNPJ."); return; }

    const headers = rows[headerIdx].map(h => String(h||"").toLowerCase().trim());
    const col = (...kws) => headers.findIndex(h => kws.some(k => h.includes(k)));

    const cForn = col("fornecedor","prestador");
    const cCnpj = col("cnpj");
    const cNum  = col("nº nota","nota","nº","nf");
    const cServ = col("serviço","servi","histórico","historico","descri");
    const cVal  = col("valor");
    const cEmis = col("emissão","emiss","data");

    function parseValorCell(v) {
      // Suporta 1234.56, 1.234,56, 1234,56
      const s = String(v||"").replace(/[^\d,\.]/g,"").trim();
      if (!s) return "";
      // Se tem vírgula depois de ponto: formato 1.234,56
      if (s.includes(",") && s.lastIndexOf(",") > s.lastIndexOf(".")) {
        return s.replace(/\./g,"").replace(",",".");
      }
      return s.replace(",",".");
    }

    const notas = [];
    for (let i = headerIdx + 1; i < rows.length; i++) {
      const row  = rows[i];
      const forn = String(row[cForn] ?? "").trim();
      const cnpj = cCnpj >= 0 ? String(row[cCnpj] ?? "").trim() : "";
      const val  = cVal  >= 0 ? parseValorCell(row[cVal]) : "";

      // Pula linhas vazias, subtotais e totais
      if (!forn) continue;
      if (/^(total|subtotal)/i.test(forn)) continue;
      if (!cnpj && !val) continue; // linha de título/header duplicado

      notas.push({
        fornecedor: forn,
        cnpj,
        numero:  cNum  >= 0 ? String(row[cNum]  ?? "").trim() : "",
        servico: cServ >= 0 ? String(row[cServ] ?? "").trim() : "",
        valor:   val,
        emissao: cEmis >= 0 ? String(row[cEmis] ?? "").trim() : "",
      });
    }

    if (notas.length === 0) { alert("Nenhuma nota encontrada. Verifique o formato da planilha."); return; }

    fechamentoData = { notas };
    const p = document.getElementById("fechamento-panel");
    if(p){ p.innerHTML=""; renderFechamentoMensal(p, color); }
  } catch(e) {
    alert("Erro ao ler planilha: " + e.message);
  }
}

async function processarPlanilhaAtributos(file, statusEl, color) {
  try {
    const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
    const ab = await file.arrayBuffer();
    const wb = XLSX.read(ab, { type:"array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:"" });

    // Detecta separador — tenta ler como CSV com ponto e vírgula
    const text = new TextDecoder().decode(ab);
    const linhas = text.trim().split("\n");
    const sep = linhas[0].includes(";") ? ";" : ",";
    const header = linhas[0].split(sep).map(h => h.trim().toUpperCase());
    const iCusto = header.indexOf("CUSTO");
    const iImposto = header.indexOf("IMPOSTO");
    const iSku = header.indexOf("SKU");

    if(iCusto < 0 || iSku < 0) throw new Error("Colunas CUSTO e SKU não encontradas");

    const atributos = {};
    linhas.slice(1).forEach(linha => {
      const cols = linha.split(sep);
      const sku = (cols[iSku]||"").trim();
      const custo = parseFloat((cols[iCusto]||"0").replace(",",".")) || 0;
      const imposto = parseFloat((cols[iImposto]||"0").replace(",",".")) || 0;
      if(sku) atributos[sku] = { custo, imposto };
    });

    const total = Object.keys(atributos).length;
    await set(ref(db, "/config_atributos"), { atributos, total, atualizadoEm: Date.now() });
    statusEl.innerHTML = `<span style="color:#00dfc3;">✓ ${total} SKUs importados com sucesso</span>`;
  } catch(e) {
    statusEl.innerHTML = `<span style="color:#e91e8c;">Erro: ${e.message}</span>`;
  }
}

async function processarPlanilhaKits(file, statusEl, color) {
  try {
    const text = await file.text();
    // Remove BOM e aspas duplas dos headers
    const linhas = text.trim().split(/\r?\n/);
    const sep = linhas[0].includes(";") ? ";" : ",";
    const header = linhas[0].replace(/^\ufeff/, "").split(sep).map(h => h.trim().replace(/^"|"$/g, "").toLowerCase());

    const iKitSku  = header.findIndex(h => h.includes("código da composição") || h.includes("codigo da composicao"));
    const iCompSku = header.findIndex(h => h.includes("código do componente") || h.includes("codigo do componente"));
    const iQtd     = header.findIndex(h => h.includes("quantidade"));

    if(iKitSku < 0 || iCompSku < 0) throw new Error(`Colunas não encontradas. Headers detectados: ${header.join(", ")}`);

    // Carrega composições existentes para detectar novos
    const snapExist = await get(ref(db, "/config_kits/composicoes"));
    const composicoesExistentes = snapExist.val() || {};

    const composicoes = {};
    linhas.slice(1).forEach(linha => {
      if(!linha.trim()) return;
      const cols = linha.split(sep).map(c => c.trim().replace(/^"|"$/g, ""));
      const kitSku  = (cols[iKitSku]  || "").trim();
      const compSku = (cols[iCompSku] || "").trim();
      const qtdStr  = (cols[iQtd]     || "1").trim();
      const qtd     = parseFloat(qtdStr.replace(",", ".")) || 1;
      if(!kitSku || !compSku || compSku === "nan") return;
      if(!composicoes[kitSku]) composicoes[kitSku] = [];
      composicoes[kitSku].push({ sku: compSku, qtd });
    });

    const novos = Object.keys(composicoes).filter(k => !composicoesExistentes[k]);
    const alterados = Object.keys(composicoes).filter(k => {
      if(!composicoesExistentes[k]) return false;
      return JSON.stringify(composicoes[k]) !== JSON.stringify(composicoesExistentes[k]);
    });

    const total = Object.keys(composicoes).length;

// ── Gera CSV de atributos atualizado com CMPs calculados ─────────────────────
async function gerarCSVAtributos(custosMedios) {
  try {
    // Pega composições de kits e atributos base do state
    const composicoes = state.config_kits?.composicoes || {};
    const atribBase   = state.config_atributos?.atributos || {};

    if (!Object.keys(atribBase).length) {
      alert("Importe a planilha de atributos na aba Config primeiro.");
      return;
    }

    // Mapa de CMP por SKU (normalizado lowercase)
    const cmpPorSku = {};
    Object.values(custosMedios).forEach(v => {
      if(v.sku && v.novoCmp) cmpPorSku[v.sku.toLowerCase()] = v.novoCmp;
    });

    // Calcula custo dos kits a partir dos componentes
    function calcularCustoKit(kitSku) {
      const comps = composicoes[kitSku];
      if (!comps) return null;
      let total = 0;
      for (const c of comps) {
        const cmp = cmpPorSku[c.sku.toLowerCase()];
        if (cmp == null) return null; // componente sem CMP conhecido
        total += c.qtd * cmp;
      }
      return total;
    }

    // Monta CSV — atualiza SKUs com CMP calculado
    const linhas = ["CUSTO;IMPOSTO;SKU"];
    const skusProcessados = new Set();

    Object.entries(atribBase).forEach(([sku, dados]) => {
      const skuLower = sku.toLowerCase();
      skusProcessados.add(sku);

      // Verifica se é unitário com CMP
      let novoCusto = cmpPorSku[skuLower] ?? null;

      // Verifica se é kit
      if (novoCusto == null) {
        novoCusto = calcularCustoKit(sku);
      }

      const custo = novoCusto != null
        ? novoCusto.toFixed(2).replace(".", ",")
        : String(dados.custo || "0").replace(".", ",");
      const imposto = String(dados.imposto || "0").replace(".", ",");
      linhas.push(`${custo};${imposto};${sku}`);
    });

    // Adiciona SKUs com CMP que não estavam na planilha base
    Object.values(custosMedios).forEach(v => {
      if(v.sku && !skusProcessados.has(v.sku) && !skusProcessados.has(v.sku.toLowerCase())) {
        const custo = v.novoCmp.toFixed(2).replace(".", ",");
        linhas.push(`${custo};0,00;${v.sku}`);
      }
    });

    const csv = "\uFEFF" + linhas.join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url; a.download = `atributos_custos_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  } catch(e) {
    alert("Erro ao gerar CSV: " + e.message);
  }
}

// ── Helper global: verifica validade de token ────────────────────────────
function tokenValido(t) {
  if(!t?.access_token) return false;
  if(t.expires_at) return Date.now() < t.expires_at; // ML: timestamp absoluto
  if(t.saved_at && t.expires_in) return (Date.now() - t.saved_at) < (t.expires_in * 1000 * 0.9); // Bling
  return true;
}

async function autoRefreshML(conta) {
  const key = conta === "filial" ? "ml_token_filial" : "ml_token";
  const t = state[key];
  if(!t?.access_token || !t?.expires_at) return;
  const minutosRestantes = (t.expires_at - Date.now()) / 60000;
  if(minutosRestantes > 60) return; // ainda tem mais de 1h, não precisa
  try {
    const r = await fetch(`${VERCEL_BACKEND}/api/ml-auth?action=refresh&conta=${conta}`);
    const d = await r.json();
    if(d.ok) {
      console.log(`[ML ${conta}] Token renovado. Expira em: ${new Date(d.expires_at).toLocaleTimeString("pt-BR")}`);
      // Remove notificação de erro se existir
      document.getElementById(`notif-refresh-${conta}`)?.remove();
    } else {
      console.warn(`[ML ${conta}] Falha no auto-refresh:`, d.error);
      notifRefreshFalhou(conta);
    }
  } catch(e) {
    console.warn(`[ML ${conta}] Erro no auto-refresh:`, e.message);
    notifRefreshFalhou(conta);
  }
}

}

// Tipos de imposto detectados automaticamente pelo nome do arquivo
const CONF_TIPOS_IMPOSTO = ["DIFAL","GNRE","DARF","DARE","INSS","IRPJ","CSLL","ISS","PIS","COFINS","IPI","ICMS"];

// Estado global da conferência
let confDocs = {
  servicos: [],   // [{id, nome, tipo, valor, competencia, mes, driveId, driveUrl, viewUrl}]
  impostos: [],   // [{id, nome, tipo, valor, competencia, mes, driveId, driveUrl, viewUrl}]
};

let confVisualizando = null; // driveUrl do PDF sendo visualizado

// Detecta o tipo pelo nome do arquivo
function detectarTipoImposto(nome) {
  const n = nome.toUpperCase();
  for(const tipo of CONF_TIPOS_IMPOSTO) {
    if(n.includes(tipo)) return tipo;
  }
  // Tenta extrair palavra principal desconhecida
  const match = nome.match(/^([A-Z\-]+)\s/);
  return match ? match[1].toUpperCase() : "OUTRO";
}

// Detecta competência do nome do arquivo (padrão MM-YYYY ou MM/YYYY)
function detectarCompetencia(nome) {
  const m = nome.match(/(\d{2})[-\/](\d{4})/);
  if(m) return `${m[1]}/${m[2]}`;
  const m2 = nome.match(/(\d{4})[-\/](\d{2})/);
  if(m2) return `${m2[2]}/${m2[1]}`;
  return "";
}

// Formata mês pra exibição
function formatarMes(mes) {
  if(!mes) return "";
  const [ano, m] = mes.split("-");
  const nomes = ["","Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  return `${nomes[parseInt(m)]} ${ano}`;
}

// Mês atual padrão
function mesAtual() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}

// Upload de arquivo pro Google Drive via MCP
async function uploadParaDrive(file, mes, categoria) {
  const pastaRaiz = "Digoo — Conferência Financeira";
  const pastaMes = `${pastaRaiz}/${formatarMes(mes)}/${categoria === "servicos" ? "Notas de Serviço" : "Impostos"}`;

  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  let binary = "";
  bytes.forEach(b => binary += String.fromCharCode(b));
  const base64 = btoa(binary);

  try {
    const resp = await fetch(`${VERCEL_BACKEND}/api/google?action=uploadDrive`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ nome: file.name, base64, mimeType: "application/pdf", pastaPath: pastaMes })
    });
    if(!resp.ok) { console.warn("uploadDrive HTTP", resp.status); return {driveId:"", driveUrl:"", viewUrl:""}; }
    const data = await resp.json();
    return data;
  } catch(e) {
    console.warn("uploadDrive falhou:", e.message);
    return {driveId:"", driveUrl:"", viewUrl:""};
  }
}

    // Header da seção
    const secHeader = document.createElement("div");
    secHeader.style.cssText = "display:flex;align-items:center;justify-content:space-between;padding:14px 16px;";
    const secLeft = document.createElement("div");
    secLeft.style.cssText = "display:flex;align-items:center;gap:10px;";
    const pillEl = document.createElement("span");
    pillEl.style.cssText = `font-size:11px;font-weight:700;letter-spacing:1.5px;padding:4px 10px;border-radius:99px;background:${cor}14;color:${cor};border:0.5px solid ${cor}33;`;
    pillEl.textContent = pill;
    const countEl = document.createElement("span");
    countEl.style.cssText = "font-size:11px;color:var(--text3);";
    countEl.textContent = `${docs.length} documentos`;
    const totalEl = document.createElement("div");
    totalEl.style.cssText = `font-size:13px;font-weight:600;color:${cor};`;
    totalEl.textContent = "R$ "+docs.reduce((s,d)=>s+(d.valor||0),0).toLocaleString("pt-BR",{minimumFractionDigits:2});
    secLeft.appendChild(pillEl); secLeft.appendChild(countEl);
    secHeader.appendChild(secLeft); secHeader.appendChild(totalEl);
    body.appendChild(secHeader);

    // Lista de documentos
    const docList = document.createElement("div");
    docList.style.cssText = `border-top:0.5px solid var(--sep);`;

    docs.forEach(doc => {
      const row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:0.5px solid var(--sep);";
      const dot = document.createElement("div");
      dot.style.cssText = `width:7px;height:7px;border-radius:50%;background:${cor};flex-shrink:0;`;
      const info = document.createElement("div");
      info.style.cssText = "flex:1;min-width:0;";
      const nome = document.createElement("div");
      nome.style.cssText = "font-size:12px;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";
      nome.textContent = doc.prestador || doc.nome;
      nome.title = doc.nome;
      const badges = document.createElement("div");
      badges.style.cssText = "display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;";
      const badgeItems = [];
      if(categoria === "impostos") badgeItems.push(detectarTipoImposto(doc.nome));
      if(doc.numeroNF) badgeItems.push(`nº ${doc.numeroNF}`);
      if(doc.competencia) badgeItems.push(doc.competencia);
      if(doc.cnpj) badgeItems.push(doc.cnpj);
      badgeItems.forEach(txt => {
        const b = document.createElement("span");
        b.style.cssText = "font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;background:var(--bg2);border:0.5px solid var(--border2);color:var(--text3);white-space:nowrap;";
        b.textContent = txt;
        badges.appendChild(b);
      });
      info.appendChild(nome); info.appendChild(badges);
      const val = document.createElement("div");
      val.style.cssText = "font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap;";
      val.textContent = "R$ "+(doc.valor||0).toLocaleString("pt-BR",{minimumFractionDigits:2});
      const actions = document.createElement("div");
      actions.style.cssText = "display:flex;gap:5px;";
      const btnVer = document.createElement("button");
      btnVer.textContent = "ver";
      if(doc.viewUrl) {
        btnVer.style.cssText = "background:none;border:0.5px solid var(--border2);border-radius:4px;color:var(--text3);font-size:11px;padding:3px 9px;cursor:pointer;font-family:inherit;";
        btnVer.addEventListener("click", () => {
          confVisualizando = confVisualizando === doc.viewUrl ? null : doc.viewUrl;
          renderConferencia(panel, color);
        });
      } else {
        btnVer.style.cssText = "background:none;border:0.5px solid var(--border2);border-radius:4px;color:var(--text3);font-size:11px;padding:3px 9px;cursor:not-allowed;font-family:inherit;opacity:0.3;";
        btnVer.title = "Drive não conectado — sem link de visualização";
        btnVer.disabled = true;
      }
      const btnDel = document.createElement("button");
      btnDel.textContent = "✕";
      btnDel.style.cssText = "background:none;border:0.5px solid #e91e8c22;border-radius:4px;color:#e91e8c66;font-size:11px;padding:3px 7px;cursor:pointer;font-family:inherit;";
      btnDel.addEventListener("click", async () => {
        if(!confirm(`Remover "${doc.nome}"?`)) return;
        await removerDocFirebase(confMes, categoria, doc.id);
        if(confVisualizando === doc.viewUrl) confVisualizando = null;
        confDocs = {servicos:[], impostos:[]};
        renderConferencia(panel, color);
      });
      actions.appendChild(btnVer); actions.appendChild(btnDel);
      row.appendChild(dot); row.appendChild(info); row.appendChild(val); row.appendChild(actions);
      docList.appendChild(row);
    });

    // Botão de upload
    const uploadRow = document.createElement("div");
    uploadRow.style.cssText = "padding:10px 16px;";
    const uploadBtn = document.createElement("button");
    uploadBtn.textContent = `+ Anexar ${categoria === "servicos" ? "nota de serviço" : "guia de imposto"}`;
    uploadBtn.style.cssText = "background:none;border:0.5px dashed var(--border2);border-radius:7px;color:var(--text3);font-size:11px;padding:8px 16px;cursor:pointer;font-family:inherit;letter-spacing:1px;width:100%;text-align:center;";
    const fileInput = document.createElement("input");
    fileInput.type = "file"; fileInput.accept = ".pdf"; fileInput.style.display = "none";
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0]; if(!file) return;
      uploadBtn.textContent = "⏳ Lendo documento..."; uploadBtn.disabled = true;
      try {
        // Ler PDF como base64
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);
        let binary = ""; bytes.forEach(b => binary += String.fromCharCode(b));
        const base64pdf = btoa(binary);

        // Extrair valor e competência via backend
        let valor = 0, competencia = detectarCompetencia(file.name) || "";
        try {
          uploadBtn.textContent = "⏳ Extraindo dados com IA...";
          const extractResp = await fetch(`${VERCEL_BACKEND}/api/google?action=extractPdf`, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ base64: base64pdf, nome: file.name })
          });
          const extracted = await extractResp.json();
          if(extracted.valor > 0) valor = extracted.valor;
          if(extracted.competencia) competencia = extracted.competencia;
          if(extracted.prestador) file._prestador = extracted.prestador;
          if(extracted.numeroNF) file._numeroNF = extracted.numeroNF;
          if(extracted.cnpj) file._cnpj = extracted.cnpj;
        } catch(e) {
          console.warn("Extração falhou:", e.message);
        }

        // Se IA não conseguiu, mostra formulário inline
        if(!valor || valor <= 0 || !competencia) {
          uploadBtn.textContent = `+ Anexar ${categoria === "servicos" ? "nota de serviço" : "guia de imposto"}`;
          uploadBtn.disabled = false;

          // Remove form anterior se existir
          uploadRow.querySelector(".manual-form")?.remove();

          const form = document.createElement("div");
          form.className = "manual-form";
          form.style.cssText = "margin-top:10px;background:var(--bg2);border:0.5px solid #f0b40055;border-radius:8px;padding:12px 14px;";
          form.innerHTML = `
            <div style="font-size:11px;color:#f0b400;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;">
              <span>⚠</span> Não consegui extrair os dados automaticamente de <strong style="color:var(--text2);">${file.name}</strong>
            </div>
            <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
              <div style="flex:1;min-width:100px;">
                <div style="font-size:11px;color:var(--text3);letter-spacing:1px;margin-bottom:4px;">VALOR (R$)</div>
                <input class="manual-valor" placeholder="ex: 1234,56" style="width:100%;background:var(--bg3);border:0.5px solid var(--border2);border-radius:5px;color:var(--text);font-size:12px;padding:6px 10px;font-family:inherit;outline:none;">
              </div>
              <div style="flex:1;min-width:100px;">
                <div style="font-size:11px;color:var(--text3);letter-spacing:1px;margin-bottom:4px;">COMPETÊNCIA</div>
                <input class="manual-comp" placeholder="ex: 06/2026" value="${competencia}" style="width:100%;background:var(--bg3);border:0.5px solid var(--border2);border-radius:5px;color:var(--text);font-size:12px;padding:6px 10px;font-family:inherit;outline:none;">
              </div>
              <button class="manual-ok" style="background:var(--accent);border:none;border-radius:5px;color:#000;font-size:11px;font-weight:700;letter-spacing:1px;padding:7px 14px;cursor:pointer;font-family:inherit;white-space:nowrap;">CONFIRMAR</button>
              <button class="manual-cancel" style="background:none;border:0.5px solid var(--border2);border-radius:5px;color:var(--text3);font-size:11px;padding:7px 10px;cursor:pointer;font-family:inherit;">✕</button>
            </div>
          `;

          form.querySelector(".manual-cancel").addEventListener("click", () => form.remove());
          form.querySelector(".manual-ok").addEventListener("click", async () => {
            const vStr = form.querySelector(".manual-valor").value;
            const v = parseFloat(vStr.replace(",","."));
            const c = form.querySelector(".manual-comp").value.trim();
            if(!v || v <= 0) { form.querySelector(".manual-valor").style.borderColor="#e91e8c"; return; }
            form.remove();
            uploadBtn.textContent = "⏳ Enviando para o Drive..."; uploadBtn.disabled = true;
            const driveResult = await uploadParaDrive(file, confMes, categoria);
            await salvarDocFirebase(confMes, categoria, {
              nome: file.name, valor: v, competencia: c,
              driveId: driveResult.driveId||"", driveUrl: driveResult.driveUrl||"",
              viewUrl: driveResult.viewUrl||driveResult.driveUrl||"",
            });
            uploadBtn.textContent = `+ Anexar ${categoria === "servicos" ? "nota de serviço" : "guia de imposto"}`;
            uploadBtn.disabled = false;
            renderConferencia(panel, color);
          });

          uploadRow.appendChild(form);
          return;
        }

        // Upload no Drive (opcional — salva mesmo se falhar)
        let driveId = "", driveUrl = "", viewUrl = "";
        try {
          uploadBtn.textContent = "⏳ Enviando para o Drive...";
          const driveResult = await uploadParaDrive(file, confMes, categoria);
          driveId = driveResult.driveId || "";
          driveUrl = driveResult.driveUrl || "";
          viewUrl = driveResult.viewUrl || driveResult.driveUrl || "";
        } catch(e) {
          console.warn("Upload Drive falhou, salvando sem link:", e.message);
        }
        // Salvar no Firebase
        await salvarDocFirebase(confMes, categoria, {
          nome: file.name,
          valor,
          competencia,
          prestador: file._prestador || "",
          numeroNF: file._numeroNF || "",
          cnpj: file._cnpj || "",
          driveId,
          driveUrl,
          viewUrl,
        });
        confDocs = {servicos:[], impostos:[]};
        renderConferencia(panel, color);
      } catch(e) {
        alert("Erro ao enviar: "+e.message);
        uploadBtn.textContent = `+ Anexar ${categoria === "servicos" ? "nota de serviço" : "guia de imposto"}`;
        uploadBtn.disabled = false;
      }
    });
    uploadBtn.addEventListener("click", () => fileInput.click());
    uploadRow.appendChild(uploadBtn); uploadRow.appendChild(fileInput);
    docList.appendChild(uploadRow);

    body.appendChild(docList);
    sec.appendChild(body);
    panel.appendChild(sec);
  }

  // ── Barra de ações ──────────────────────────────────────────────────────
  if(confDocs.servicos.length > 0 || confDocs.impostos.length > 0) {
    const actBar = document.createElement("div");
    actBar.style.cssText = "display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;";

    // Botão CSV Bling
    const btnCSV = document.createElement("button");
    btnCSV.style.cssText = `background:none;border:1px dashed var(--border2);border-radius:6px;color:var(--text3);font-size:11px;letter-spacing:1px;padding:9px 0;cursor:pointer;font-family:inherit;flex:1;text-align:center;`;
    btnCSV.innerHTML = `↓ Gerar CSV Bling`;
    btnCSV.addEventListener("click", async () => {
      btnCSV.textContent = "⏳ Gerando..."; btnCSV.disabled = true;
      try {
        const nfses = [...confDocs.servicos, ...confDocs.impostos].map(d => ({
          fornecedor: d.prestador || d.nome,
          cnpj: d.cnpj || "",
          valor: d.valor || 0,
          emissao: d.competencia ? `01/${d.competencia.split("/").join("/")}` : "",
          numero: d.numeroNF || ""
        }));
        const resp = await fetch(`${VERCEL_BACKEND}/api/google?action=csv&mes=${confMes}`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({nfses})
        });
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `contas_pagar_${confMes}.csv`; a.click();
        URL.revokeObjectURL(url);
      } catch(e) { alert("Erro ao gerar CSV: "+e.message); }
      btnCSV.innerHTML = `<span>↓</span> Gerar CSV Bling`; btnCSV.disabled = false;
    });

    // Botão Rascunho contador
    const btnEmail = document.createElement("button");
    btnEmail.style.cssText = `background:none;border:1px dashed var(--border2);border-radius:6px;color:var(--text3);font-size:11px;letter-spacing:1px;padding:9px 0;cursor:pointer;font-family:inherit;flex:1;text-align:center;`;
    btnEmail.innerHTML = `✉ Rascunho pro contador`;
    btnEmail.addEventListener("click", async () => {
      btnEmail.textContent = "⏳ Criando rascunho..."; btnEmail.disabled = true;
      try {
        const [ano, mes] = confMes.split("-");
        const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
        const nomeMes = `${MESES[parseInt(mes)-1]} ${ano}`;
        const totalServicos = confDocs.servicos.reduce((s,d)=>s+(d.valor||0),0);
        const totalImpostos = confDocs.impostos.reduce((s,d)=>s+(d.valor||0),0);
        const totalGeral = totalServicos + totalImpostos;

        let corpo = `Olá Leonardo,

Segue o resumo das notas fiscais de ${nomeMes} para lançamento.

`;

        if(confDocs.servicos.length > 0) {
          corpo += `NOTAS DE SERVIÇO
${"─".repeat(40)}
`;
          confDocs.servicos.forEach(d => {
            corpo += `• ${d.prestador || d.nome}`;
            if(d.numeroNF) corpo += ` — NF nº ${d.numeroNF}`;
            if(d.competencia) corpo += ` (${d.competencia})`;
            corpo += ` — R$ ${(d.valor||0).toLocaleString("pt-BR",{minimumFractionDigits:2})}
`;
          });
          corpo += `Total serviços: R$ ${totalServicos.toLocaleString("pt-BR",{minimumFractionDigits:2})}

`;
        }

        if(confDocs.impostos.length > 0) {
          corpo += `IMPOSTOS
${"─".repeat(40)}
`;
          confDocs.impostos.forEach(d => {
            corpo += `• ${d.nome}`;
            if(d.competencia) corpo += ` (${d.competencia})`;
            corpo += ` — R$ ${(d.valor||0).toLocaleString("pt-BR",{minimumFractionDigits:2})}
`;
          });
          corpo += `Total impostos: R$ ${totalImpostos.toLocaleString("pt-BR",{minimumFractionDigits:2})}

`;
        }

        corpo += `TOTAL GERAL: R$ ${totalGeral.toLocaleString("pt-BR",{minimumFractionDigits:2})}

Atenciosamente,
Digoo Brasil`;

        const resp = await fetch(`${VERCEL_BACKEND}/api/google?action=rascunho`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({
            para: "geancarlo@resicontabilidade.com.br",
            assunto: `NFs para lançamento — ${nomeMes}`,
            corpo
          })
        });
        const d = await resp.json();
        if(d.ok) {
          btnEmail.innerHTML = `✓ Rascunho criado no Gmail`;
          setTimeout(()=>{ btnEmail.innerHTML = `<span>✉</span> Rascunho pro contador`; btnEmail.disabled = false; }, 3000);
        } else throw new Error(d.error || "Erro desconhecido");
      } catch(e) {
        alert("Erro ao criar rascunho: "+e.message);
        btnEmail.innerHTML = `<span>✉</span> Rascunho pro contador`;
        btnEmail.disabled = false;
      }
    });

    actBar.appendChild(btnCSV);
    actBar.appendChild(btnEmail);
    panel._actBar = actBar;
  }

  renderSecao("Notas de Serviço", servicosFiltrados, "#f77614", "Notas de Serviço", "servicos");
  renderSecao("Impostos", impostosFiltrados, "#e8432d", "Impostos", "impostos");

  if(panel._actBar) panel.appendChild(panel._actBar);
}
// ─── FIM CONFERÊNCIA FINANCEIRA ────────────────────────────────────────────

</script>
  <script src="claude-chat.js"></script>
</body>
</html>

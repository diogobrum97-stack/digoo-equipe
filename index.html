// Decodifica o timestamp embutido no ID gerado pelo push() do Firebase,
// usado como fallback pra tarefas antigas que não têm createdAt salvo.
function decodePushId(id){
  const PUSH_CHARS = "-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz";
  if(!id || id.length<8) return null;
  let ts = 0;
  for(let i=0;i<8;i++){
    const idx = PUSH_CHARS.indexOf(id[i]);
    if(idx<0) return null;
    ts = ts*64 + idx;
  }
  return ts;
}
function taskCreatedAt(task){
  if(task.createdAt) return task.createdAt;
  const decoded = task.id ? decodePushId(task.id) : null;
  return decoded || null;
}
function taskOverdueLabel(task){
  if(!task || task.done) return null;
  const budgetH = BUDGET_HORAS[task.prio];
  if(!budgetH) return null;
  const createdAt = taskCreatedAt(task);
  if(!createdAt) return null;
  const elapsedH = (Date.now()-createdAt)/3600000;
  if(elapsedH <= budgetH) return null;
  return elapsedH < 24 ? `ATRASADA HÁ ${Math.round(elapsedH)}H` : `ATRASADA HÁ ${Math.round(elapsedH/24)}D`;
}
function overdueBadgeHtml(task){
  const label = taskOverdueLabel(task);
  if(!label) return "";
  const pc = themePrio(task.prio);

}

  let noticesChanged=false;
  Object.entries(d.notices||{}).filter(([,n])=>n!=null).forEach(([id,notice])=>{

      sendNotif("Digoo · Tarefa Concluída",`${notice.by} concluiu: ${notice.text}`,"#00ff88");
    seenNotices[id]=true;noticesChanged=true;
  });
  if(noticesChanged)localStorage.setItem("digoo_seen_notices",JSON.stringify(seenNotices));
  window._prevNotices={...(d.notices||{})};
  const seenMsgs=JSON.parse(localStorage.getItem("digoo_seen_msgs")||"{}");
  let seenMsgsChanged=false;
  Object.entries(d.messages||{}).filter(([,m])=>m!=null).forEach(([id,msg])=>{
    if(!seenMsgs[id]&&msg.recipient===currentUser&&Object.keys(window._prevMsgs||{}).length>0)
      sendNotif("Digoo · Nova Mensagem",`${msg.from}: ${msg.text}`,themeColor(msg.from));
    seenMsgs[id]=true;seenMsgsChanged=true;
  });
  if(seenMsgsChanged)localStorage.setItem("digoo_seen_msgs",JSON.stringify(seenMsgs));
  window._prevMsgs={...(d.messages||{})};
  Object.entries(d.tasks).filter(([,t])=>t!=null).forEach(([id,task])=>{
    const prev=prevTasks[id];
    if(prev&&!prev.done&&task.done&&task.member!=="Diogo"){
      completionAlerts[id]={member:task.member,text:task.text};
      set(ref(db,`/flashes/Diogo`),{ts:Date.now(),msg:`${task.member} concluiu uma tarefa!`});
      if(currentUser==="Diogo")sendNotif("Digoo · Tarefa Concluída",`${task.member} concluiu: ${task.text}`,themeColor("Diogo"));
    }
  });
  Object.entries(d.flashes).forEach(([member,val])=>{
    if(val!=null){
      const wasFlashing=flashQueue[member];flashQueue[member]=true;
      if(!wasFlashing&&val.msg){startTabFlash(val.msg,themeColor(member));if(currentUser===member)sendNotif("Digoo · Nova Tarefa",val.msg,themeColor(member));}
    }
  });
  Object.keys(flashQueue).forEach(m=>{if(!d.flashes[m])delete flashQueue[m];});
  const prevBlingToken = state?.bling_token?.access_token;
  const prevFilialToken = state?.ml_token_filial?.access_token;
  prevTasks={...d.tasks};state=d;
  // Se o token Bling mudou e tinha erro, limpar e tentar buscar de novo
  if(d.bling_token?.access_token && d.bling_token.access_token !== prevBlingToken && estoqueBlingErro) {
    estoqueBlingErro = null;
    estoqueBlingData = null;
    estoqueBlingLoading = false;
    fetchBlingProdutos();

  // Se o token ML Filial mudou, resetar estoque automático pra rebuscar com vendas
  if(d.ml_token_filial?.access_token && d.ml_token_filial.access_token !== prevFilialToken) {
    estoqueAutoCheckDone = false;
    estoqueExcelData = null;
    fetchEstoqueAutomatico();
  }
  if(!cmpSalvando)render();

let dashData = null;
let dashLoading = false;

let dashExperiencia = null;
async function fetchExperiencia() {
  try {
    const token = state.ml_token_filial?.access_token;
    if(!token) return;
    const res = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?token=${token}&action=experiencia`);
    const data = await res.json();
    if(data.ok) { dashExperiencia = data; render(); }
  } catch(e) { console.warn("Experiência de compra:", e.message); }
}

async function fetchDashboard() {
  if(dashLoading) return;
  dashLoading = true;
  const loadingTimeout = setTimeout(() => { dashLoading = false; }, 30000);
  render();
  try {
    const tokenFilial = state.ml_token_filial?.access_token;
    const tokenMatriz = state.ml_token?.access_token;
    if(!tokenFilial) throw new Error("Token ML Filial não conectado");
    const hoje = new Date();
    const diaAtualMes = hoje.getDate();

    // Buscar Filial e Matriz em paralelo
    const fetchPromises = [
      fetch(`${VERCEL_BACKEND}/api/ml-vendas?token=${tokenFilial}&today=1`).then(r=>r.json()),
      fetch(`${VERCEL_BACKEND}/api/ml-vendas?token=${tokenFilial}&days=${diaAtualMes}`).then(r=>r.json()),
    ];
    if(tokenMatriz) {
      fetchPromises.push(fetch(`${VERCEL_BACKEND}/api/ml-vendas?token=${tokenMatriz}&today=1`).then(r=>r.json()).catch(()=>null));
      fetchPromises.push(fetch(`${VERCEL_BACKEND}/api/ml-vendas?token=${tokenMatriz}&days=${diaAtualMes}`).then(r=>r.json()).catch(()=>null));
    }
    const [resHoje, resMes, resHojeMatriz, resMesMatriz] = await Promise.all(fetchPromises);

    const minutosDia = 24 * 60;
    const minutosPassados = hoje.getHours() * 60 + hoje.getMinutes();
    const percDia = minutosPassados / minutosDia;
    const fatHoje = resHoje.summary?.totalRevenue || 0;
    const projecaoDia = percDia > 0 ? fatHoje / percDia : 0;
    const fatHojeMatriz = resHojeMatriz?.summary?.totalRevenue || 0;
    const projecaoMatriz = percDia > 0 ? fatHojeMatriz / percDia : 0;

    dashData = {
      fatHoje, projecaoDia,
      fatMes: resMes.summary?.totalRevenue || 0,
      pedidosMes: resMes.summary?.totalOrders || 0,
      percDia: Math.round(percDia * 100),
      hora: hoje.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}),
      top5hoje: [...(resHoje.topSellers || [])].sort((a,b)=>(b.revenue||0)-(a.revenue||0)).slice(0,5),
      top10mes: [...(resMes.topSellers || [])].sort((a,b)=>(b.revenue||0)-(a.revenue||0)).slice(0,10),
      // Matriz
      matriz: tokenMatriz ? {
        fatHoje: fatHojeMatriz,
        projecaoDia: projecaoMatriz,
        fatMes: resMesMatriz?.summary?.totalRevenue || 0,
        pedidosMes: resMesMatriz?.summary?.totalOrders || 0,
        top5hoje: [...(resHojeMatriz?.topSellers || [])].sort((a,b)=>(b.revenue||0)-(a.revenue||0)).slice(0,5),
      } : null,
      _fetchedAt: Date.now(),
    };
    // Expor dados para o claude-chat.js (escopo externo)
    window._dashData = dashData;
    // Buscar experiência em background (mais lento — não bloqueia)
    if(!dashExperiencia) fetchExperiencia();
  } catch(e) {
    dashData = { erro: e.message };
  }
  clearTimeout(loadingTimeout);
  dashLoading = false;
  render();
}

function extrairItemId(texto) {
  if (!texto) return "";
  let t = texto.trim();
  // Aceita ID direto (MLB123456789), link completo, ou só os números
  const matchId = t.match(/MLB-?\d{9,}/i);
  if (matchId) return matchId[0].replace("-", "").toUpperCase();
  // Link com padrão diferente, ex: .../p/MLB123456789 ou .../MLB-1234-5678...
  const matchNum = t.match(/(\d[\d-]{8,})/);
  if (matchNum) {
    const soDigitos = matchNum[1].replace(/-/g, "");
    return "MLB" + soDigitos;
  }
  return t.toUpperCase();
}

      <button id="clonar-origem-matriz" style="flex:1;padding:9px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid ${clonarState.contaOrigem==='matriz'?'#f77614':'#333'};background:${clonarState.contaOrigem==='matriz'?'#f77614':'#111'};color:${clonarState.contaOrigem==='matriz'?'#fff':'#888'};">Matriz RS</button>
      <button id="clonar-origem-filial" style="flex:1;padding:9px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid ${clonarState.contaOrigem==='filial'?'#f77614':'#333'};background:${clonarState.contaOrigem==='filial'?'#f77614':'#111'};color:${clonarState.contaOrigem==='filial'?'#fff':'#888'};">Filial SP</button>
    </div>
    <button id="clonar-btn-buscar" style="width:100%;padding:10px;border-radius:6px;background:#f77614;border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;">${clonarState.buscando ? "Buscando..." : "Buscar anúncio"}</button>
  `;
  alvoEsq.appendChild(buscaCard);

  if (clonarState.erro) {
    const errBox = document.createElement("div");
    errBox.style.cssText = "background:#2a1000;border:1px solid #4a2010;border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:11px;color:#f0a060;white-space:pre-wrap;line-height:1.5;";
    errBox.textContent = clonarState.erro;
    alvoEsq.appendChild(errBox);
  }

  // Preview do item encontrado
  if (clonarState.itemEncontrado && !clonarState.resultado) {
    const item = clonarState.itemEncontrado;
    const contaDestino = clonarState.contaOrigem === "matriz" ? "Filial SP" : "Matriz RS";

    const previewCard = document.createElement("div");

    const foto = item.pictures?.[0]?.source || "";
    previewCard.innerHTML = `
      <div style="display:flex;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #282828;">
        ${foto ? `<img src="${foto}" style="width:64px;height:64px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#111;">` : ""}
        <div style="flex:1;min-width:0;">
          <div style="font-size:12px;font-weight:600;color:#fff;line-height:1.4;">${item.title}</div>
          <div style="font-size:11px;color:#666;margin-top:4px;">Categoria ${item.category_id} · ${item.condition === "new" ? "Novo" : item.condition}</div>
        </div>
      </div>

      ${item.has_variations ? `<div style="background:#2a1000;border:1px solid #4a2010;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:11px;color:#f0a060;">⚠️ Este anúncio tem variações — clonagem de variações ainda não é suportada.</div>` : ""}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
        <div>
          <div style="font-size:10px;color:#666;margin-bottom:5px;">SKU</div>
          <input id="clonar-input-sku" type="text" value="${item.sku || ""}" style="width:100%;background:#111;border:1px solid #333;border-radius:6px;padding:8px 10px;color:#fff;font-size:12px;font-family:Inter,sans-serif;outline:none;box-sizing:border-box;">
        </div>
        <div>
          <div style="font-size:10px;color:#666;margin-bottom:5px;">Quantidade</div>
          <input id="clonar-input-qtd" type="number" value="${item.available_quantity}" style="width:100%;background:#111;border:1px solid #333;border-radius:6px;padding:8px 10px;color:#fff;font-size:12px;font-family:Inter,sans-serif;outline:none;box-sizing:border-box;">
        </div>
      </div>
      <div style="margin-bottom:16px;">
        <div style="font-size:10px;color:#666;margin-bottom:5px;">Preço (mantido igual ao original)</div>
        <div style="font-size:16px;font-weight:700;color:#fff;font-family:'IBM Plex Mono',monospace;">R$ ${Number(item.price).toLocaleString("pt-BR",{minimumFractionDigits:2})}</div>
      </div>

      <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:#1e1e1e;border-radius:6px;margin-bottom:16px;">
        <div style="font-size:11px;color:#888;">Clonando para</div>
        <div style="font-size:12px;font-weight:600;color:#f77614;">${contaDestino}</div>
      </div>

      <button id="clonar-btn-confirmar" ${item.has_variations ? "disabled" : ""} style="width:100%;padding:11px;border-radius:6px;background:${item.has_variations ? "#333" : "#f77614"};border:none;color:${item.has_variations ? "#666" : "#fff"};font-size:12px;font-weight:600;cursor:${item.has_variations ? "not-allowed" : "pointer"};">${clonarState.clonando ? "Clonando..." : "Confirmar e clonar anúncio"}</button>
    `;
    alvoEsq.appendChild(previewCard);

    // ── Coluna direita: prévia visual do anúncio clonado ──
    const colDir = document.createElement("div");
    const listingWrap = document.createElement("div");
    listingWrap.style.cssText = "background:linear-gradient(to top,#252525 0%,#000 100%);border:1px solid #333;border-radius:10px;padding:16px;height:100%;box-sizing:border-box;";
    const listingTitle = document.createElement("div");
    listingTitle.style.cssText = "font-size:11px;color:#888;margin-bottom:12px;";
    listingTitle.textContent = "Prévia do anúncio clonado";
    const previewEl = document.createElement("div");
    listingWrap.appendChild(listingTitle);
    listingWrap.appendChild(previewEl);
    colDir.appendChild(listingWrap);
    row.appendChild(colDir);

    window._clonarAtualizarPreview = function() {
      const skuAtual = document.getElementById("clonar-input-sku")?.value || item.sku || "";
      const qtdAtual = document.getElementById("clonar-input-qtd")?.value || item.available_quantity;
      const fotoP = item.pictures?.[0]?.source || "";
      const contaDestinoP = clonarState.contaOrigem === "matriz" ? "Filial SP" : "Matriz RS";
      const condicaoP = item.condition === "new" ? "Novo" : item.condition;
      const listingTipoP = item.listing_type_id === "gold_special" ? "Clássico" : (item.listing_type_id || "—");
      previewEl.innerHTML = `
        <div style="background:#111;border:1px solid #282828;border-radius:10px;padding:16px;">
          <div style="display:inline-block;padding:3px 10px;border-radius:13px;background:#f77614;color:#fff;font-size:11px;font-weight:600;margin-bottom:14px;">${contaDestinoP}</div>
          <div style="width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#222;margin-bottom:14px;display:flex;align-items:center;justify-content:center;">
            ${fotoP ? `<img src="${fotoP}" style="width:100%;height:100%;object-fit:cover;">` : `<div style="font-size:11px;color:#555;">Sem imagem</div>`}
          </div>
          <div style="font-size:13px;font-weight:700;color:#fff;line-height:1.4;margin-bottom:10px;">${item.title}</div>
          <div style="font-size:22px;font-weight:700;color:#fff;font-family:'IBM Plex Mono',monospace;margin-bottom:10px;">R$ ${Number(item.price).toLocaleString("pt-BR",{minimumFractionDigits:2})}</div>
          <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
            <div style="display:inline-block;padding:3px 10px;border-radius:12px;background:#1a2a1a;border:1px solid #2d5a2d;color:#2dce89;font-size:11px;font-weight:600;">Frete grátis</div>
            <div style="display:inline-block;padding:3px 10px;border-radius:12px;background:#1e1e1e;border:1px solid #333;color:#888;font-size:11px;font-weight:600;">${condicaoP}</div>
            <div style="display:inline-block;padding:3px 10px;border-radius:12px;background:#1e1e1e;border:1px solid #333;color:#888;font-size:11px;font-weight:600;">${listingTipoP}</div>
          </div>
          <div style="padding-top:14px;border-top:1px solid #282828;display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;">
            <div><div style="font-size:10px;color:#666;margin-bottom:3px;">SKU</div><div style="font-size:12px;color:#fff;font-weight:600;">${skuAtual}</div></div>
            <div><div style="font-size:10px;color:#666;margin-bottom:3px;">Quantidade</div><div style="font-size:12px;color:#fff;font-weight:600;">${qtdAtual} unidades</div></div>
            <div><div style="font-size:10px;color:#666;margin-bottom:3px;">Categoria</div><div style="font-size:12px;color:#fff;font-weight:600;">${item.category_id}</div></div>
            <div><div style="font-size:10px;color:#666;margin-bottom:3px;">Fotos</div><div style="font-size:12px;color:#fff;font-weight:600;">${(item.pictures||[]).length} imagens</div></div>
            <div><div style="font-size:10px;color:#666;margin-bottom:3px;">Ficha técnica</div><div style="font-size:12px;color:#fff;font-weight:600;">${(item.attributes||[]).length} atributos</div></div>
          </div>
        </div>
      `;
    };
    // Popula imediatamente — usa a referência direta, não precisa esperar o DOM
    window._clonarAtualizarPreview();
  }

  // Resultado
  if (clonarState.resultado) {
    const res = clonarState.resultado;
    const resCard = document.createElement("div");
    resCard.style.cssText = "background:linear-gradient(to top,#1a2a1a 0%,#000 100%);border:1px solid #2d5a2d;border-radius:10px;padding:16px;margin-bottom:16px;text-align:center;";
    resCard.innerHTML = `
      <div style="font-size:13px;font-weight:700;color:#2dce89;margin-bottom:6px;">Anúncio clonado com sucesso ✓</div>
      <div style="font-size:11px;color:#888;margin-bottom:14px;">${res.item_id}</div>
      <a href="${res.permalink}" target="_blank" style="display:inline-block;padding:9px 18px;background:#f77614;border-radius:6px;color:#fff;font-size:12px;font-weight:600;text-decoration:none;">Abrir anúncio no ML ↗</a>
      <div style="margin-top:14px;">
        <button id="clonar-btn-novo" style="background:none;border:none;color:#666;font-size:11px;cursor:pointer;text-decoration:underline;">Clonar outro anúncio</button>
      </div>
    `;
    wrap.appendChild(resCard);
  }

  container.appendChild(wrap);
  if (window._clonarAtualizarPreview) window._clonarAtualizarPreview();

  // ── Eventos ──
  const inputId = container.querySelector("#clonar-input-id");
  if (inputId) inputId.oninput = (e) => { clonarState.itemBusca = e.target.value; };

  const btnMatriz = container.querySelector("#clonar-origem-matriz");
  const btnFilial = container.querySelector("#clonar-origem-filial");
  if (btnMatriz) btnMatriz.onclick = () => { clonarState.contaOrigem = "matriz"; clonarState.itemEncontrado = null; clonarState.resultado = null; renderClonarTab(container); };
  if (btnFilial) btnFilial.onclick = () => { clonarState.contaOrigem = "filial"; clonarState.itemEncontrado = null; clonarState.resultado = null; renderClonarTab(container); };

  const btnBuscar = container.querySelector("#clonar-btn-buscar");
  if (btnBuscar) btnBuscar.onclick = async () => {
    const itemId = extrairItemId(clonarState.itemBusca);
    if (!itemId) return;
    clonarState.buscando = true;
    clonarState.erro = null;
    clonarState.itemEncontrado = null;
    renderClonarTab(container);

    const tokenOrigem = clonarState.contaOrigem === "matriz" ? state.ml_token?.access_token : state.ml_token_filial?.access_token;
    if (!tokenOrigem) {
      clonarState.buscando = false;
      clonarState.erro = "Token da conta de origem não encontrado. Verifique a conexão ML.";
      renderClonarTab(container);
      return;
    }

    try {
      const r = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?action=buscar-clone&item_id=${itemId}&token=${tokenOrigem}`);
      const data = await r.json();
      clonarState.buscando = false;
      if (!data.ok) {
        clonarState.erro = data.error || "Não foi possível localizar o anúncio.";
      } else {
        clonarState.itemEncontrado = data.item;
      }
      renderClonarTab(container);
    } catch (e) {
      clonarState.buscando = false;
      clonarState.erro = "Erro de conexão ao buscar o anúncio.";
      renderClonarTab(container);
    }
  };

  const inputSku = container.querySelector("#clonar-input-sku");
  if (inputSku) inputSku.oninput = (e) => { clonarState.novoSku = e.target.value; window._clonarAtualizarPreview && window._clonarAtualizarPreview(); };
  const inputQtd = container.querySelector("#clonar-input-qtd");
  if (inputQtd) inputQtd.oninput = (e) => { clonarState.novaQuantidade = e.target.value; window._clonarAtualizarPreview && window._clonarAtualizarPreview(); };

  const btnConfirmar = container.querySelector("#clonar-btn-confirmar");
  if (btnConfirmar) btnConfirmar.onclick = async () => {
    clonarState.clonando = true;
    clonarState.erro = null;
    renderClonarTab(container);

    const tokenDestino = clonarState.contaOrigem === "matriz" ? state.ml_token_filial?.access_token : state.ml_token?.access_token;
    if (!tokenDestino) {
      clonarState.clonando = false;
      clonarState.erro = "Token da conta de destino não encontrado.";
      renderClonarTab(container);
      return;
    }

    try {
      const r = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?action=clonar`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          item: clonarState.itemEncontrado,
          tokenDestino,
          novoSku: inputSku?.value || clonarState.itemEncontrado.sku,
          novaQuantidade: inputQtd?.value ? Number(inputQtd.value) : clonarState.itemEncontrado.available_quantity,
        }),
      });
      const data = await r.json();
      clonarState.clonando = false;
      if (!data.ok) {
        let msg = data.error || "Erro ao clonar o anúncio.";
        if (data.raw) {
          msg += "\n\n" + JSON.stringify(data.raw, null, 2);
        }
        clonarState.erro = msg;
      } else {
        clonarState.resultado = data;
      }
      renderClonarTab(container);
    } catch (e) {
      clonarState.clonando = false;
      clonarState.erro = "Erro de conexão ao clonar o anúncio.";
      renderClonarTab(container);
    }
  };

  const btnNovo = container.querySelector("#clonar-btn-novo");
  if (btnNovo) btnNovo.onclick = () => {
    clonarState = { itemBusca: "", contaOrigem: "matriz", itemEncontrado: null, buscando: false, clonando: false, resultado: null, erro: null, novoSku: "", novaQuantidade: "" };
    renderClonarTab(container);
  };
}

function renderExperienciaTab(container) {
  container.innerHTML = "";

  if(!dashExperiencia) {
    container.innerHTML = '<div style="padding:40px 0;text-align:center;font-size:12px;color:#555;">Carregando experiência de compra...</div>';
    return;
  }

  const todosProblemas = dashExperiencia.problemas || [];
  const ruins = todosProblemas.filter(p => p.color === 'red');
  const regulares = todosProblemas.filter(p => p.color !== 'red');

  let listaFiltrada = todosProblemas;
  if(expPageFiltro === "ruim") listaFiltrada = ruins;
  if(expPageFiltro === "regular") listaFiltrada = regulares;

  // Header
  const header = document.createElement("div");
  header.style.cssText = "display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;";
  header.innerHTML = `
    <div>
      <div style="font-size:16px;font-weight:700;color:#fff;">Experiência de compra</div>
      <div style="font-size:11px;color:#666;margin-top:2px;">${dashExperiencia.total || 0} anúncios ativos · ${todosProblemas.length} com problema</div>
    </div>
    <button onclick="window._expRefresh()" style="background:linear-gradient(to top,#252525 0%,#000 100%);border:1px solid #333;border-radius:6px;padding:7px 14px;color:#ccc;font-size:11px;cursor:pointer;">↻ Atualizar</button>
  `;
  container.appendChild(header);

  window._expRefresh = function() {
    dashExperiencia = null;
    fetchExperiencia();
  };

  // Filtro tabs
  const filterBar = document.createElement("div");
  filterBar.style.cssText = "display:flex;gap:8px;margin-bottom:16px;";
  const filtros = [
    {key:"todos", label:`Todos (${todosProblemas.length})`, cor:"#888"},
    {key:"ruim", label:`Ruim (${ruins.length})`, cor:"#e8432d"},
    {key:"regular", label:`Regular (${regulares.length})`, cor:"#f77614"},
  ];
  filtros.forEach(f => {
    const btn = document.createElement("button");
    const ativo = expPageFiltro === f.key;
    btn.style.cssText = `background:${ativo?f.cor:'linear-gradient(to top,#252525 0%,#000 100%)'};border:1px solid ${ativo?f.cor:'#333'};border-radius:6px;padding:7px 14px;color:${ativo?'#fff':'#888'};font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;`;
    btn.textContent = f.label;
    btn.onclick = () => { expPageFiltro = f.key; renderExperienciaTab(container); };
    filterBar.appendChild(btn);
  });
  container.appendChild(filterBar);

  // Grid de cards
  if(listaFiltrada.length === 0) {
    const empty = document.createElement("div");
    empty.style.cssText = "padding:40px 0;text-align:center;font-size:12px;color:#555;";
    empty.textContent = expPageFiltro === "todos" ? "Nenhum produto com problema de experiência. Tudo certo! ✓" : "Nenhum item nessa categoria.";
    container.appendChild(empty);
    return;
  }

  const grid = document.createElement("div");
  grid.style.cssText = "display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;";

  const circ = 2 * Math.PI * 42;
  window._expPageDetailsCache = [];

  listaFiltrada.forEach((p, i) => {
    const cor = p.color === 'red' ? '#e8432d' : '#f77614';
    const score = p.value || 0;
    const dash = ((score/100)*circ).toFixed(1);
    const label = p.level || (p.color === 'red' ? 'Ruim' : 'Regular');
    const nome = p.title || p.sku || '';
    const nomeShort = nome.length > 40 ? nome.slice(0,40)+'…' : nome;

    const acoesRows = (p.actions||[]).map(a=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1e1e1e;border-radius:6px;margin-bottom:5px;"><div style="width:6px;height:6px;border-radius:50%;background:${cor};flex-shrink:0;"></div><div style="font-size:11px;color:#ccc;">${a}</div></div>`).join('') || '<div style="font-size:11px;color:#555;">Nenhuma recomendação disponível.</div>';
    const principalHTML = p.principalAcao ? `<div style="display:flex;align-items:center;gap:8px;padding:9px 12px;background:${cor}1a;border:1px solid ${cor}44;border-radius:7px;margin-bottom:12px;"><div style="font-size:10px;color:${cor};font-weight:700;text-transform:uppercase;flex-shrink:0;">Prioridade</div><div style="font-size:12px;color:#fff;font-weight:600;">${p.principalAcao}</div></div>` : '';
    const freezeHTML = p.freeze ? `<div style="display:flex;align-items:flex-start;gap:8px;padding:9px 12px;background:#2a1000;border:1px solid #4a2010;border-radius:7px;margin-bottom:12px;"><div style="font-size:13px;flex-shrink:0;">⚠️</div><div style="font-size:11px;color:#f0a060;line-height:1.4;">${p.freeze}</div></div>` : '';
    const statusHTML = p.status && p.status !== 'active' ? `<div style="display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;background:#c0392b22;color:#c0392b;margin-bottom:10px;">Anúncio ${p.status==='paused'?'pausado':'em moderação'}</div>` : '';

    window._expPageDetailsCache[i] = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #1e1e1e;"><div style="font-size:12px;font-weight:600;color:#fff;">${nome}</div><a href="${p.link||'#'}" target="_blank" style="font-size:11px;color:#1a6be0;text-decoration:none;padding:3px 10px;border:1px solid #1a6be033;border-radius:5px;white-space:nowrap;">Abrir no ML ↗</a></div>${statusHTML}${principalHTML}${freezeHTML}<div><div style="font-size:11px;color:#777;margin-bottom:8px;">Ações recomendadas</div>${acoesRows}</div>`;

    const card = document.createElement("div");
    card.className = "exp-page-card";
    card.style.cssText = `background:linear-gradient(to top,#252525 0%,#000 100%);border-top:1px solid #333;border-bottom:1px solid #333;border-right:1px solid #333;border-left:3px solid ${cor};border-radius:10px;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;cursor:pointer;transition:border-color .2s;`;
    card.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;width:100%;">
        <svg width="64" height="64" viewBox="0 0 108 108">
          <circle cx="54" cy="54" r="42" fill="none" stroke="#1e1e1e" stroke-width="7"/>
          <circle cx="54" cy="54" r="42" fill="none" stroke="${cor}" stroke-width="7" stroke-dasharray="${dash} ${circ.toFixed(1)}" stroke-dashoffset="${(circ*0.25).toFixed(1)}" stroke-linecap="round"/>
          <text x="54" y="62" text-anchor="middle" fill="${cor}" font-size="22" font-weight="700" font-family="Inter,sans-serif">${score}</text>
        </svg>
        <div style="font-size:11px;font-weight:600;color:${cor};">${label}</div>
        <div style="font-size:11px;font-weight:600;color:#fff;line-height:1.4;">${nomeShort}</div>
        ${p.sku ? `<div style="font-size:11px;color:#444;">${p.sku}</div>` : ''}
      </div>
    `;
    card.onclick = () => window._expPageToggle(i, container);
    grid.appendChild(card);
  });

  container.appendChild(grid);

  const detailPanel = document.createElement("div");
  detailPanel.id = "exp-page-detail-panel";
  detailPanel.dataset.idx = "-1";
  detailPanel.style.cssText = "display:none;background:linear-gradient(to top,#1e1e1e 0%,#000 100%);border:1px solid #2a2a2a;border-radius:10px;padding:16px;margin-top:12px;";
  container.appendChild(detailPanel);

  window._expPageToggle = function(idx, cont) {
    const cards = cont.querySelectorAll('.exp-page-card');
    const panel = cont.querySelector('#exp-page-detail-panel');
    if(!panel) return;
    const cur = parseInt(panel.dataset.idx||'-1');
    cards.forEach(c => { c.style.borderLeftColor='#333'; });
    if(cur === idx) { panel.style.display='none'; panel.dataset.idx='-1'; return; }
    panel.dataset.idx = idx;
    panel.style.display = 'block';
    panel.innerHTML = window._expPageDetailsCache[idx] || '';
    const corAtual = listaFiltrada[idx].color === 'red' ? '#e8432d' : '#f77614';
    if(cards[idx]) { cards[idx].style.borderLeftColor = corAtual; }
  };
}

function renderDashboard(panel, color) {
  // Rebuscar se dados têm mais de 5 minutos
  const agora = Date.now();

let calPanelOpen = false;

function toggleCalFiscal() {

function renderCalFiscal() {
  const panel = document.getElementById("cal-panel");
  if(!calPanelOpen) { panel.style.display = "none"; return; }
  panel.style.display = "block";

  const hoje = new Date();
  const mesRef = new Date(hoje.getFullYear(), hoje.getMonth() + calMesOffset, 1);
  const mes = mesRef.getMonth();
  const ano = mesRef.getFullYear();
  const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

  // Calcular dias restantes pra cada evento no mês
  const eventosComDias = FISCAL_EVENTS.map(e => {
    const venc = new Date(ano, mes, e.dia);
    const diff = Math.ceil((venc - hoje) / (1000*60*60*24));
    return {...e, venc, diff};
  }).sort((a,b) => a.dia - b.dia);

  // (badge removido — botão agora está no header do card)

  // Montar painel
  const primeiroDia = new Date(ano, mes, 1).getDay();
  const ultimoDia = new Date(ano, mes+1, 0).getDate();

  // Agrupar eventos por dia
  const eventosPorDia = {};
  FISCAL_EVENTS.forEach(e => {
    if(!eventosPorDia[e.dia]) eventosPorDia[e.dia] = [];
    eventosPorDia[e.dia].push(e);
  });

  panel.style.fontFamily = "'Inter', sans-serif";
  panel.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:0.5px solid #1a1a1a;">
      <div style="font-size:11px;font-weight:600;letter-spacing:2px;color:#ccc;text-transform:uppercase;">Calendário Fiscal</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button onclick="calMesOffset--;renderCalFiscal()" style="background:none;border:none;color:#999;font-size:13px;cursor:pointer;padding:2px 5px;">‹</button>
        <div style="font-size:11px;color:#ccc;">${MESES[mes].slice(0,3)} ${ano}</div>
        <button onclick="calMesOffset++;renderCalFiscal()" style="background:none;border:none;color:#999;font-size:13px;cursor:pointer;padding:2px 5px;">›</button>
      </div>
    </div>

    <div style="padding:10px 14px;border-bottom:0.5px solid #1a1a1a;">
      <div style="display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;">
        ${["D","S","T","Q","Q","S","S"].map(d => `<div style="font-size:8px;color:#888;text-align:center;letter-spacing:0.5px;">${d}</div>`).join("")}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;">
        ${Array(primeiroDia).fill('<div style="height:26px;"></div>').join("")}
        ${Array.from({length:ultimoDia},(_,i)=>{
          const d = i+1;
          const isHoje = d===hoje.getDate() && mes===hoje.getMonth() && ano===hoje.getFullYear();
          const evs = eventosPorDia[d] || [];
          const cor = evs.length > 0 ? CAL_CORES[evs[0].tipo] : null;
          return `<div style="height:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;font-size:11px;cursor:pointer;position:relative;${isHoje?"background:#5e72e4;color:#fff;font-weight:700;":"color:"+(evs.length?"#ddd":"#888")+";"}">
            ${d}
            ${cor && !isHoje ? `<div style="width:3px;height:3px;border-radius:50%;background:${cor};position:absolute;bottom:2px;"></div>` : ""}
          </div>`;
        }).join("")}
      </div>
    </div>

    <div style="max-height:200px;overflow-y:auto;">
      <div style="font-size:8px;letter-spacing:1.5px;color:#999;text-transform:uppercase;padding:8px 14px 4px;">Próximos vencimentos</div>
      ${eventosComDias.filter(e => e.diff >= -1).map(e => {
        const cor = CAL_CORES[e.tipo] || "#555";
        const diasCor = e.diff < 0 ? "#e91e8c" : e.diff <= 7 ? "#e91e8c" : e.diff <= 14 ? "#f0b400" : "#888";
        const diasTxt = e.diff < 0 ? `${Math.abs(e.diff)}d atrás` : e.diff === 0 ? "hoje" : `em ${e.diff}d`;
        return `<div style="display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:0.5px solid #111;">
          <div style="font-size:11px;font-weight:700;color:#aaa;width:18px;text-align:center;flex-shrink:0;">${e.dia}</div>
          <div style="width:6px;height:6px;border-radius:50%;background:${cor};flex-shrink:0;"></div>
          <div style="flex:1;">
            <div style="font-size:11px;font-weight:500;color:#ddd;">${e.nome}</div>
            <div style="font-size:11px;color:#888;margin-top:1px;">Ref. ${String(mes).padStart(2,"0")}/${ano}</div>
          </div>
          <div style="font-size:11px;font-weight:600;color:${diasCor};white-space:nowrap;">${diasTxt}</div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function toggleTask(id,done,progress,isRecorrente){
  setSyncing(true);
  if(done){
    // concluído -> pendente (só via botão reabrir para recorrentes)
    if(!isRecorrente){
      update(ref(db,`/tasks/${id}`),{done:false,progress:false});
    }
    return;
  } else if(progress){
    // progresso -> concluído
    update(ref(db,`/tasks/${id}`),{done:true,progress:false});
  } else {
    // pendente -> em progresso
    update(ref(db,`/tasks/${id}`),{done:false,progress:true});
    return;
  }
  if(!done){
    const task=state.tasks&&state.tasks[id];
    if(task&&task.delegatedBy&&task.delegatedBy!=="Diogo"&&task.delegatedBy!==task.member){
      push(ref(db,"/notices"),{forMember:task.delegatedBy,text:task.text,by:task.member,ts:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),ts_raw:Date.now()});
      set(ref(db,`/flashes/${task.delegatedBy}`),{ts:Date.now(),msg:`${task.member} concluiu sua tarefa!`});
    }
    setTimeout(()=>{Object.entries(state.messages||{}).forEach(([msgId,msg])=>{if(msg!=null&&msg.taskId===id)update(ref(db,`/messages/${msgId}`),{closed:true});});},30000);
  }
}

function sendMessage(from,text,taskId,taskText,recipient,delegatedBy){
  setSyncing(true);const rcpt=recipient||"Diogo";
  push(ref(db,"/messages"),{from,text,taskId,taskText,recipient:rcpt,delegatedBy:delegatedBy||null,read:false,ts:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),ts_raw:Date.now()});

}

function makeIcon(color,size){const c=document.createElement("canvas");c.width=c.height=size;const ctx=c.getContext("2d");const r=size/2;ctx.shadowColor=color;ctx.shadowBlur=size*0.25;ctx.beginPath();ctx.arc(r,r,r*0.75,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();return c.toDataURL();}
function sendNotif(title,body,color){if(!("Notification"in window)||Notification.permission!=="granted")return;const n=new Notification(title,{body,icon:makeIcon(color,64),tag:"digoo-task",requireInteraction:true});n.onclick=()=>{window.focus();n.close();};}
function setFavicon(color){const c=document.createElement("canvas");c.width=c.height=32;const ctx=c.getContext("2d");ctx.shadowColor=color;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(16,16,12,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(16,16,6,0,Math.PI*2);ctx.fillStyle="#fff";ctx.globalAlpha=0.5;ctx.fill();ctx.globalAlpha=1;let l=document.querySelector("link[rel*='icon']");if(!l){l=document.createElement("link");l.rel="icon";document.head.appendChild(l);}l.href=c.toDataURL();}
function resetFavicon(){const c=document.createElement("canvas");c.width=c.height=32;const ctx=c.getContext("2d");ctx.beginPath();ctx.arc(16,16,12,0,Math.PI*2);ctx.fillStyle="#333";ctx.fill();let l=document.querySelector("link[rel*='icon']");if(!l){l=document.createElement("link");l.rel="icon";document.head.appendChild(l);}l.href=c.toDataURL();}
function startFaviconCycle(colors){if(faviconInterval)clearInterval(faviconInterval);let idx=0,on=true;setFavicon(colors[0]);faviconInterval=setInterval(()=>{if(on)resetFavicon();else{idx=(idx+1)%colors.length;setFavicon(colors[idx]);}on=!on;},600);}

async function fetchMLData(tab){
  mlLoadingTab=tab;render();
  try{
    const token=state.ml_token?.access_token;
    if(!token){
      if(tab==="canceladas")mlCanceladas={error:"token ausente"};
      else if(tab==="devolucoes")mlDevolucoes={error:"token ausente"};
      else if(tab==="reclamacoes")mlReclamacoes={error:"token ausente"};
      mlLoadingTab=null;render();return;
    }
    const r=await fetch(`${VERCEL_BACKEND}/api/ml-${tab}?token=${token}`);
    const data=await r.json();
    if(tab==="canceladas")mlCanceladas=data;
    else if(tab==="devolucoes")mlDevolucoes=data;

  mlLoadingTab=null;render();
}

async function checkAndCreateRecorrentes() {
  if(recorrentesChecked) return;
  recorrentesChecked = true;

  try {
    const hoje = new Date().toISOString().slice(0,10); // "2026-06-16"
    const logKey = `recorrentes_log/${hoje.replace(/-/g,"_")}`;

    // Verifica se já criou hoje
    const logSnap = await new Promise(resolve => {
      const ref2 = ref(db, logKey);
      onValue(ref2, snap => resolve(snap.val()), { onlyOnce: true });
    });
    if(logSnap) return; // já criou hoje

    // Busca recorrentes configuradas
    const recSnap = await new Promise(resolve => {
      const ref2 = ref(db, "/recorrentes");
      onValue(ref2, snap => resolve(snap.val()), { onlyOnce: true });
    });
    if(!recSnap) return;

    const hoje2 = new Date();
    const diaSemana = hoje2.getDay(); // 0=dom, 1=seg...
    const diaMes = hoje2.getDate();

    const recorrentes = Object.values(recSnap).filter(r => {
      if(!r || !r.active) return false;
      if(r.frequency === "daily") return true;
      if(r.frequency === "weekly") return r.dayOfWeek === diaSemana;
      if(r.frequency === "monthly") return r.dayOfMonth === diaMes;
      return false;
    });

    // Verifica tarefas recorrentes já existentes hoje (evita duplicata)
    const tasksSnap = await new Promise(resolve => {
      onValue(ref(db, "/tasks"), snap => resolve(snap.val()), { onlyOnce: true });
    });
    const existingTexts = Object.values(tasksSnap || {})
      .filter(t => t && t.isRecorrente)
      .map(t => t.text?.toLowerCase());

    // Cria as tarefas do dia
    for(const rec of recorrentes) {
      // Pula se já existe
      if(existingTexts.includes(rec.text?.toLowerCase())) continue;
      await push(ref(db, "/tasks"), {
        member: rec.member || "Diogo",
        text: rec.text,
        prio: rec.prio || "importante",
        done: false,
        progress: false,
        delegatedBy: null,
        isRecorrente: true,
        recorrenteId: rec.id || null,
        frequency: rec.frequency,
        createdAt: Date.now(),
      });
    }

    // Registra log do dia ANTES de criar (evita race condition)
    await set(ref(db, logKey), { createdAt: new Date().toISOString(), count: recorrentes.length });
    console.log(`Recorrentes criadas: ${recorrentes.length}`);
  } catch(e) {
    console.error("Erro ao criar recorrentes:", e.message);
  }
}

async function checkTransferenciasNF() {
  if (nfCheckDone) return;
  nfCheckDone = true;
  try {
    const r = await fetch(`${BLING_PROXY}/api/bling-produtos?notas=1`);
    const data = await r.json();
    if (!r.ok || !data.transferencias) return;

    for (const nf of data.transferencias) {
      const chave = String(nf.numero || nf.id).replace(/[.#$\[\]\/]/g, "_"); // Firebase não aceita esses caracteres em chaves
      if (state.nfes_processadas?.[chave]) continue; // já criou tarefa pra essa nota
      await criarTarefaTransferencia(chave, { dataEmissao: nf.dataEmissao, natureza: nf.natureza, itens: nf.itens });
    }
  } catch (e) {
    console.error("Erro ao checar notas de transferência:", e.message);
  }
}

let processandoNotaManual = false;
async function processarNotaManual(numeroDigitado){
  const chave = String(numeroDigitado || "").trim().replace(/[.#$\[\]\/]/g, "_");
  if (!chave) return;
  if (state.nfes_processadas?.[chave]) {
    alert(`A nota ${chave} já foi processada antes — a tarefa dela já deve estar na sua lista (ou nas concluídas).`);
    return;
  }
  processandoNotaManual = true; render();
  try {
    const r = await fetch(`${BLING_PROXY}/api/bling-produtos?notaCompleta=${encodeURIComponent(chave)}`);
    const data = await r.json();
    if (!r.ok) { alert(`Não achei a nota ${chave}: ${data.error || "erro desconhecido"}`); return; }
    const corpo = data.data || data;
    const itensBrutos = corpo.itens || corpo.itensNota || [];
    const itens = itensBrutos.map(it => ({
      sku: it.codigo || null,
      produto: it.descricao || "",
      ncm: String(it.classificacaoFiscal || "").replace(/\D/g, ""),
      quantidade: Number(it.quantidade) || 0,
      valorUnit: Number(it.valor) || 0,
    })).filter(it => it.sku);
    await criarTarefaTransferencia(chave, {
      dataEmissao: corpo.dataEmissao || null,
      natureza: corpo.naturezaOperacao?.nome || null,
      itens,
      manual: true,
    });
  } catch (e) {
    alert("Erro ao processar a nota: " + e.message);
  }
  processandoNotaManual = false; render();
}

function extrairNumeroNFDaTarefa(task){
  if(task.nfNumero) return task.nfNumero;
  const m = String(task.text||"").match(/NF #(\S+)/);
  return m ? m[1] : null;
}

async function initCalcIpi(task, numeroManual){
  const chave = numeroManual || extrairNumeroNFDaTarefa(task);
  let nfData = state.nfes_processadas?.[chave];
  let erro = null;

  if(!nfData?.itens?.length && chave){
    calcIpiState[task.id] = { produtos: [], frete: 0, ipiOriginal: 0, carregando: true };
    render();
    try{
      const r = await fetch(`${BLING_PROXY}/api/bling-produtos?notaCompleta=${encodeURIComponent(chave)}`);
      const d = await r.json();
      if(r.ok && d?.data){
        const corpo = d.data;
        const itensBrutos = corpo.itens || corpo.itensNota || [];
        const itensExtraidos = itensBrutos.map(it => ({
          sku: it.codigo || null,
          produto: it.descricao || "",
          ncm: String(it.classificacaoFiscal || "").replace(/\D/g, ""),
          quantidade: Number(it.quantidade) || 0,
          valorUnit: Number(it.valor) || 0,
        })).filter(it => it.sku);
        if(!itensExtraidos.length){
          erro = `A nota #${chave} foi encontrada, mas nenhum item com SKU veio nela. Confere se o SKU está cadastrado nos produtos dessa nota no Bling.`;
        }
        nfData = { ...(nfData||{}), itens: itensExtraidos };
        set(ref(db, `/nfes_processadas/${chave}/itens`), itensExtraidos);
      }else{
        erro = d?.error || `Não achei a nota #${chave} no Bling (erro ${r.status}).`;
      }
    }catch(e){
      erro = `Erro de conexão ao buscar a nota #${chave}: ${e.message}`;
    }
  }else if(!chave){
    erro = "Não consegui identificar o número dessa NF a partir da tarefa. Digite o número manualmente abaixo.";
  }

  const itensNF = nfData?.itens || [];
  calcIpiState[task.id] = {
    produtos: itensNF.map(it => {
      const precoSalvo = state.precos_venda_manual?.[normSku(it.sku)];
      const precoRef = PRECOS_VENDA_REFERENCIA_NORM[normSku(it.sku)];
      const precoInicial = precoSalvo!=null ? precoSalvo : (precoRef!=null ? precoRef : null);
      const sugestao = getAliquotaIPI(it.ncm); // só usada como ponto de partida — sempre editável depois
      return {
        sku: it.sku, produto: it.produto, qtd: it.quantidade, valorNf: it.valorUnit,
        ncm: it.ncm, precoVenda: precoInicial, automatico: true,
        aliquotaValor: sugestao.conhecido ? sugestao.valor : null,
      };
    }),
    frete: 0, ipiOriginal: 0,
    erro: erro,
    nfUsada: chave,
  };
  render();
}

function calcularLinhaIpi(p){
  const precoVenda = p.precoVenda;
  if(precoVenda==null || !p.qtd) return { precoAjustado:0, baseUnit:0, baseTotal:0, ipi:0, aliquotaValor:p.aliquotaValor||0 };
  const aliquotaValor = p.aliquotaValor!=null ? p.aliquotaValor : 0;
  const precoAjustado = precoVenda * (1 - REDUCAO_IPI);
  const baseUnit = precoAjustado - p.valorNf;
  const baseTotal = baseUnit * p.qtd;
  const ipi = baseTotal * aliquotaValor;
  return { precoAjustado, baseUnit, baseTotal, ipi, aliquotaValor };
}

        inpSku.addEventListener("input",()=>{p.sku=inpSku.value;});
        tdSku.insertBefore(inpSku, tdSku.firstChild.nextSibling);
      }
      tr.appendChild(tdSku);

      const tdQtd = document.createElement("td"); tdQtd.style.cssText="padding:6px 3px;text-align:center;";
      if(p.automatico){ tdQtd.textContent = p.qtd; }
      else{ const inpQtd=document.createElement("input"); inpQtd.type="number"; inpQtd.value=p.qtd; inpQtd.style.cssText="width:55px;background:var(--bg);border:1px solid var(--border2);border-radius:4px;padding:3px 5px;color:var(--text2);font-family:inherit;font-size:11px;text-align:center;"; inpQtd.addEventListener("click",e=>e.stopPropagation()); inpQtd.addEventListener("input",()=>{p.qtd=parseFloat(inpQtd.value)||0; recalcular();}); tdQtd.appendChild(inpQtd); }
      tr.appendChild(tdQtd);

      const tdValorNf = document.createElement("td"); tdValorNf.style.cssText="padding:6px 3px;text-align:right;";
      if(p.automatico){ tdValorNf.textContent = `R$ ${p.valorNf.toFixed(2)}`; }
      else{ const inpV=document.createElement("input"); inpV.type="number"; inpV.value=p.valorNf; inpV.style.cssText="width:60px;background:var(--bg);border:1px solid var(--border2);border-radius:4px;padding:3px 5px;color:var(--text2);font-family:inherit;font-size:11px;text-align:right;"; inpV.addEventListener("click",e=>e.stopPropagation()); inpV.addEventListener("input",()=>{p.valorNf=parseFloat(inpV.value)||0; recalcular();}); tdValorNf.appendChild(inpV); }
      tr.appendChild(tdValorNf);

      const tdPreco = document.createElement("td"); tdPreco.style.cssText="padding:6px 3px;text-align:right;";
      const inpPreco = document.createElement("input"); inpPreco.type="number"; inpPreco.placeholder="digitar";
      inpPreco.value = p.precoVenda!=null ? p.precoVenda.toFixed(2) : "";
      inpPreco.style.cssText=`width:70px;background:var(--bg);border:1px solid ${p.precoVenda==null?"#e91e8c":"var(--border2)"};border-radius:4px;padding:3px 5px;color:#f0b400;font-family:inherit;font-size:11px;text-align:right;`;
      inpPreco.addEventListener("click",e=>e.stopPropagation());
      // Só recalcula localmente enquanto digita (sem gravar no Firebase a cada
      // tecla — isso disparava um recarregamento da tela inteira e derrubava
      // o foco do campo no meio da digitação). Só grava quando sai do campo.
      inpPreco.addEventListener("input",()=>{
        const v=parseFloat(inpPreco.value); p.precoVenda=isNaN(v)?null:v; recalcular();
      });
      inpPreco.addEventListener("blur",()=>{
        if(p.precoVenda!=null && p.sku) set(ref(db, `/precos_venda_manual/${normSku(p.sku)}`), p.precoVenda);
      });
      tdPreco.appendChild(inpPreco);
      tr.appendChild(tdPreco);

      const tdIpi = document.createElement("td"); tdIpi.className="celulaIpi"; tdIpi.style.cssText="padding:6px 3px;text-align:right;color:#00dfc3;";
      tr.appendChild(tdIpi);

      const tdCmv = document.createElement("td"); tdCmv.className="celulaCmv"; tdCmv.style.cssText="padding:6px 3px;text-align:right;color:#7F77DD;";
      tr.appendChild(tdCmv);

      const tdDel = document.createElement("td"); tdDel.style.cssText="padding:6px 3px;";
      if(!p.automatico){ const delBtn=document.createElement("button"); delBtn.textContent="×"; delBtn.style.cssText="background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;"; delBtn.addEventListener("click",e=>{e.stopPropagation();calc.produtos.splice(i,1);render();}); tdDel.appendChild(delBtn); }
      tr.appendChild(tdDel);

      tr.addEventListener("click", ()=>{
        calc.linhaExpandida = calc.linhaExpandida===i ? null : i;
        montarLinhas();
        recalcular();
      });
      tbody.appendChild(tr);

      if(calc.linhaExpandida===i){
        const trDet = document.createElement("tr");
        trDet.style.cssText = "background:var(--bg);";
        const tdDet = document.createElement("td");
        tdDet.colSpan = 7;
        tdDet.style.cssText = "padding:10px 12px;";
        tdDet.innerHTML = `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
          <div><div style="font-size:11px;color:var(--text3);margin-bottom:3px;">NCM</div><div style="font-size:11px;color:var(--text2);">${p.ncm||"—"}</div></div>
        </div>`;
        const campoAliq = document.createElement("div");
        const lblAliq = document.createElement("div"); lblAliq.style.cssText="font-size:11px;color:var(--text3);margin-bottom:3px;"; lblAliq.textContent="ALÍQUOTA %";
        const inpAliqDet = document.createElement("input"); inpAliqDet.type="number"; inpAliqDet.step="0.01"; inpAliqDet.placeholder="digitar";
        inpAliqDet.value = p.aliquotaValor!=null ? (p.aliquotaValor*100) : "";
        inpAliqDet.style.cssText = "width:80px;background:var(--bg3);border:1px solid #f0b40066;border-radius:4px;padding:5px 8px;color:#f0b400;font-family:inherit;font-size:12px;";
        inpAliqDet.addEventListener("click",e=>e.stopPropagation());
        inpAliqDet.addEventListener("input",()=>{
          const v=parseFloat(inpAliqDet.value);
          p.aliquotaValor=isNaN(v)?null:v/100;
          const badge = tr.querySelector(".aliqBadge");
          if(badge){
            if(p.aliquotaValor==null){ badge.style.color="#e91e8c"; badge.textContent="sem %"; }
            else{ badge.style.color="var(--text3)"; badge.textContent=`${(p.aliquotaValor*100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}%`; }
          }
          recalcular();
        });
        campoAliq.appendChild(lblAliq); campoAliq.appendChild(inpAliqDet);
        tdDet.querySelector("div").appendChild(campoAliq);
        trDet.appendChild(tdDet);
        trDet.addEventListener("click", e=>e.stopPropagation());
        tbody.appendChild(trDet);
      }
    });

    // Rodapé: total de SKUs e total de unidades
    const totalUnidades = calc.produtos.reduce((s,p)=>s+(p.qtd||0),0);
    tfoot.innerHTML = `<tr style="border-top:1px solid var(--border2);position:sticky;bottom:0;background:var(--bg3);">
      <td style="padding:8px 3px;color:var(--text2);font-size:11px;font-weight:600;">${calc.produtos.length} SKUs</td>
      <td style="padding:8px 3px;text-align:center;color:var(--text);font-size:11px;font-weight:600;">${totalUnidades.toLocaleString("pt-BR")} un.</td>
      <td colspan="5"></td>
    </tr>`;
  }

  function recalcular(){
    let total = 0;
    const porAliquota = new Map(); // valorAliquota -> {base, valor}
    const linhas = tbody.querySelectorAll("tr[data-prod-idx]");

    // Base de rateio (pra diluir frete + IPI da NF original proporcionalmente),
    // igual à planilha: soma valorNf*qtd de todos os produtos com qtd>0
    let baseRateio = 0;
    calc.produtos.forEach(p=>{ if(p.qtd>0) baseRateio += p.valorNf * p.qtd; });
    const totalDiluir = (calc.frete||0) + (calc.ipiOriginal||0);

    calc.produtos.forEach((p, i)=>{
      const r = calcularLinhaIpi(p);
      total += r.ipi;
      if(p.precoVenda!=null && p.qtd>0 && p.aliquotaValor!=null){
        const chaveAliq = p.aliquotaValor;
        if(!porAliquota.has(chaveAliq)) porAliquota.set(chaveAliq, {base:0, valor:0});
        const acc = porAliquota.get(chaveAliq);
        acc.base += r.baseTotal;
        acc.valor += r.ipi;
      }
      const celulaIpi = linhas[i]?.querySelector(".celulaIpi");
      if(celulaIpi) celulaIpi.textContent = (p.precoVenda!=null && p.aliquotaValor!=null) ? `R$ ${r.ipi.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}` : "—";

      const celulaCmv = linhas[i]?.querySelector(".celulaCmv");
      if(celulaCmv){
        if(p.precoVenda!=null && p.qtd>0 && baseRateio>0){
          const cmv = p.valorNf + (r.ipi/p.qtd) + (p.valorNf/baseRateio)*totalDiluir;
          celulaCmv.textContent = `R$ ${cmv.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
        }else{
          celulaCmv.textContent = "—";
        }
      }
    });

    cardsWrap.innerHTML = "";
    [...porAliquota.keys()].sort().forEach(aliq=>{
      const d = porAliquota.get(aliq);
      const card = document.createElement("div");
      card.style.cssText = "flex:1;min-width:130px;background:var(--bg);border-radius:8px;overflow:hidden;";
      card.innerHTML = `
        <div style="background:#000;padding:6px;text-align:center;font-size:11px;font-weight:600;color:#fff;">${(aliq*100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}%</div>
        <div style="padding:7px;text-align:center;border-top:1px solid var(--sep);">
          <div style="font-size:11px;color:var(--text3);">BASE</div>
          <div style="font-size:12px;color:var(--text);">R$ ${d.base.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        </div>
        <div style="padding:7px;text-align:center;border-top:1px solid var(--sep);">
          <div style="font-size:11px;color:var(--text3);">VALOR</div>
          <div style="font-size:12px;color:#00dfc3;">R$ ${d.valor.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        </div>`;
      cardsWrap.appendChild(card);
    });

    const semAliquota = calc.produtos.filter(p=>p.precoVenda!=null && p.aliquotaValor==null).length;
    avisoBox.innerHTML = "";
    if(semAliquota>0){
      avisoBox.style.display="block";
      avisoBox.textContent = `⚠ ${semAliquota} produto(s) sem alíquota preenchida (campo em vermelho na tabela) — não entram no total até você preencher.`;
    }else{
      avisoBox.style.display="none";
    }
    const totalEl = totalSpan;
    if(totalEl) totalEl.textContent = `R$ ${total.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  }

  container.appendChild(wrap);
  montarLinhas();
  recalcular();

  // ── Seção Custo Médio Ponderado ───────────────────────────────
  // Estado de expansão do card CMP: 0=pequeno, 1=médio, 2=fullscreen
  if(window._cmpExpand === undefined) window._cmpExpand = 0;

  const cmpWrap = document.createElement("div");
  cmpWrap.style.cssText = "margin-top:16px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;";

  const cmpHeader = document.createElement("div");
  cmpHeader.style.cssText = "display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;";
  const cmpTitle = document.createElement("div");
  cmpTitle.style.cssText = "font-size:11px;color:var(--text3);letter-spacing:1.5px;";
  cmpTitle.textContent = "CUSTO MÉDIO PONDERADO — FILIAL SP";

  const cmpRightBtns = document.createElement("div");
  cmpRightBtns.style.cssText = "display:flex;gap:6px;align-items:center;";

  const cmpBuscarBtn = document.createElement("button");
  cmpBuscarBtn.textContent = "↻ Calcular CMP";
  cmpBuscarBtn.style.cssText = "background:none;border:1px solid #00dfc366;color:#00dfc3;border-radius:4px;padding:4px 12px;font-size:11px;cursor:pointer;font-family:inherit;";

  cmpRightBtns.appendChild(cmpBuscarBtn);
  cmpHeader.appendChild(cmpTitle); cmpHeader.appendChild(cmpRightBtns);
  cmpWrap.appendChild(cmpHeader);

  const cmpContent = document.createElement("div");
  cmpContent.style.cssText = "font-size:11px;color:var(--text3);";
  cmpContent.textContent = "Clique em ↻ Calcular CMP para buscar o custo atual da Filial e calcular o novo custo médio ponderado.";
  cmpWrap.appendChild(cmpContent);

  // Overlay fullscreen
  let fsOverlay = null;
  function aplicarExpansaoCmp() {
    expandBtn.textContent = ["⤢","⤡","✕"][window._cmpExpand];

    if(window._cmpExpand === 0) {
      // Pequeno — remove fullscreen se existir
      if(fsOverlay) { fsOverlay.remove(); fsOverlay = null; }
      cmpWrap.style.position = "";
      cmpWrap.style.zIndex = "";
      cmpWrap.style.top = "";
      cmpWrap.style.left = "";
      cmpWrap.style.width = "";
      cmpWrap.style.height = "";
      cmpWrap.style.borderRadius = "8px";
      cmpWrap.style.overflow = "";
    } else if(window._cmpExpand === 1) {
      // Médio — sem mudança visual, mas panel pai já é largo
      if(fsOverlay) { fsOverlay.remove(); fsOverlay = null; }
      cmpWrap.style.position = "";
      cmpWrap.style.zIndex = "";
    } else {
      // Fullscreen
      fsOverlay = document.createElement("div");
      fsOverlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;display:flex;align-items:center;justify-content:center;";
      fsOverlay.addEventListener("click", e => { if(e.target===fsOverlay){ window._cmpExpand=0; aplicarExpansaoCmp(); }});
      document.body.appendChild(fsOverlay);
      fsOverlay.appendChild(cmpWrap);
      cmpWrap.style.cssText = "background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:20px;width:90vw;max-height:85vh;overflow-y:auto;";
    }
  }

  // Auto-carrega CMP se já foi calculado antes nesta sessão
  if(calcIpiState[task.id]?.cmpDados) {
    cmpBuscarBtn.textContent = "↻ Atualizar CMP";
    setTimeout(() => cmpBuscarBtn.click(), 50);
  }

  cmpBuscarBtn.addEventListener("click", async () => {
    const produtosComCmv = calc.produtos.filter(p => p.precoVenda != null && p.qtd > 0);
    if (produtosComCmv.length === 0) { cmpContent.textContent = "Preencha os preços de venda primeiro."; return; }

    cmpBuscarBtn.textContent = "↻ Buscando...";
    cmpBuscarBtn.disabled = true;
    cmpContent.innerHTML = "";

    try {
      // Busca estoque atual da Filial via ML
      const rEstoque = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?estoque=1`).then(r=>r.json());
      const estoquePorSku = {};
      (rEstoque.rows || []).forEach(r => {
        if(r.sku) estoquePorSku[r.sku.toLowerCase()] = r.aptas || 0;
      });

      // Busca custos salvos no Firebase (último CMP calculado por SKU)
      const custosSalvosSnap = await get(ref(db, "/custos_medios_filial"));
      const custosSalvos = custosSalvosSnap.val() || {};

      // Salva no calcIpiState para persistir entre renders
      calcIpiState[task.id].cmpDados = { estoquePorSku, custosSalvos };

      // Monta tabela editável
      const tbl = document.createElement("table");
      tbl.style.cssText = "width:100%;border-collapse:collapse;font-size:11px;";
      tbl.className = "cmp-table";
      tbl.innerHTML = `<thead><tr style="border-bottom:1px solid var(--sep);">
        <th style="text-align:left;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1px;">SKU</th>
        <th style="text-align:right;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1px;">QTD NF</th>
        <th style="text-align:right;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1px;">CMV NF</th>
        <th style="text-align:right;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1px;">ESTOQUE FILIAL</th>
        <th style="text-align:right;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1px;">CUSTO ATUAL</th>
        <th style="text-align:right;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1px;">NOVO CMP</th>
      </tr></thead><tbody></tbody>`;
      const tbody2 = tbl.querySelector("tbody");

      // Estado local editável
      const linhasCmp = produtosComCmv.map(p => {
        const r = calcularLinhaIpi(p);
        // CMV completo = valorNF + IPI unitário + frete rateado + IPI original rateado
        const baseRateio = produtosComCmv.reduce((s, pp) => s + (pp.valorNf||0) * (pp.qtd||0), 0);
        const totalDiluir = (calc.frete||0) + (calc.ipiOriginal||0);
        const freteProporcional = baseRateio > 0 ? (p.valorNf / baseRateio) * totalDiluir : 0;
        const cmvUnit = p.valorNf + (r.ipi / p.qtd) + freteProporcional;
        const skuKey = (p.sku||"").toLowerCase();
        const fbKey  = skuKey.replace(/-/g, "_");
        // Busca em todas as variações de chave: underscore, hífen, uppercase
        const custoSalvo = 
          custosSalvos[fbKey]?.novoCmp ?? 
          custosSalvos[fbKey]?.custoAtual ?? 
          custosSalvos[skuKey]?.novoCmp ?? 
          custosSalvos[skuKey]?.custoAtual ?? 
          custosSalvos[p.sku]?.novoCmp ?? 
          custosSalvos[p.sku]?.custoAtual ?? null;
        console.log(`[CMP] ${p.sku} custoSalvo: ${custoSalvo}`);
        const estoqueAtual = estoquePorSku[skuKey] ?? 0;
        return { sku: p.sku, skuKey, qtd: p.qtd, cmvUnit, estoqueAtual, custoAtual: custoSalvo, novoCmp: null };
      });

      function calcNovoCmp(l) {
        if (l.custoAtual == null || l.custoAtual === "") return null;
        const ca = parseFloat(String(l.custoAtual).replace(",",".")) || 0;
        return (l.qtd * l.cmvUnit + l.estoqueAtual * ca) / (l.qtd + l.estoqueAtual);
      }

      function renderLinhasCmp() {
        tbody2.innerHTML = "";
        linhasCmp.forEach(l => {
          l.novoCmp = calcNovoCmp(l);
          const tr2 = document.createElement("tr");
          tr2.style.cssText = "border-bottom:1px solid var(--sep);";
          const fmt = v => v != null ? `R$ ${Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}` : "—";
          const semCusto = l.custoAtual == null || l.custoAtual === "";

          // Células fixas — visual igual à tabela de IPI acima
          const tdSku = document.createElement("td"); tdSku.style.cssText="padding:6px 8px;";
          tdSku.innerHTML = `<div style="color:#00dfc3;font-weight:600;">${l.sku||"—"}</div>`;
          const tdQtd = document.createElement("td"); tdQtd.style.cssText="padding:6px 8px;text-align:right;color:var(--text2);"; tdQtd.textContent=l.qtd;
          const tdCmv = document.createElement("td"); tdCmv.style.cssText="padding:6px 8px;text-align:right;color:#7F77DD;"; tdCmv.textContent=fmt(l.cmvUnit);
          const tdEst = document.createElement("td"); tdEst.style.cssText="padding:6px 8px;text-align:right;color:var(--text2);"; tdEst.textContent=l.estoqueAtual;

          // Custo atual — editável
          const tdCusto = document.createElement("td"); tdCusto.style.cssText="padding:6px 8px;text-align:right;";
          const iCusto = document.createElement("input");
          iCusto.type = "number";
          iCusto.step = "0.01";
          iCusto.value = l.custoAtual != null ? parseFloat(String(l.custoAtual).replace(",",".")).toFixed(2) : "";
          iCusto.placeholder = semCusto ? "⚠ preencher" : "";
          iCusto.style.cssText = `width:80px;background:none;border:none;border-bottom:1px solid ${semCusto?"#e91e8c66":"var(--border2)"};color:${semCusto?"#e91e8c":"#f0b400"};font-family:inherit;font-size:11px;text-align:right;outline:none;padding:2px 4px;`;
          iCusto.addEventListener("input", () => {
            l.custoAtual = iCusto.value;
            iCusto.style.borderBottomColor = "var(--border2)";
            iCusto.style.color = "#f0b400";
            l.novoCmp = calcNovoCmp(l);
            tdNovoCmp.textContent = fmt(l.novoCmp);
            tdNovoCmp.style.color = l.novoCmp ? "#4ade80" : "var(--text3)";
          });
          tdCusto.appendChild(iCusto);

          // Novo CMP
          const tdNovoCmp = document.createElement("td");
          tdNovoCmp.style.cssText = `padding:6px 3px;text-align:right;font-weight:600;color:${l.novoCmp?"#4ade80":"var(--text3)"};`;
          tdNovoCmp.textContent = fmt(l.novoCmp);

          tr2.appendChild(tdSku); tr2.appendChild(tdQtd); tr2.appendChild(tdCmv);
          tr2.appendChild(tdEst); tr2.appendChild(tdCusto); tr2.appendChild(tdNovoCmp);
          tbody2.appendChild(tr2);
        });
      }

      renderLinhasCmp();
      cmpContent.appendChild(tbl);

      // Botão salvar CMP
      const salvarCmpBtn = document.createElement("button");
      salvarCmpBtn.textContent = "✓ Salvar CMP";
      salvarCmpBtn.style.cssText = "margin-top:12px;background:none;border:1px solid #00dfc366;color:#00dfc3;border-radius:4px;padding:6px 16px;font-size:11px;cursor:pointer;font-family:inherit;letter-spacing:0.5px;";
      salvarCmpBtn.addEventListener("click", async () => {
        const updates = {};
        let algumVazio = false;
        linhasCmp.forEach(l => {
          const custoNum = parseFloat(String(l.custoAtual||"").replace(",",".")) || 0;
          if (!custoNum) { algumVazio = true; return; }
          // Firebase não aceita - em chaves, usa _ 
          const fbKey = l.skuKey.replace(/-/g, "_");
          updates[fbKey] = {
            sku: l.sku,
            skuOriginal: l.skuKey,
            novoCmp: l.novoCmp || null,
            custoAtual: custoNum,
            atualizadoEm: Date.now(),
            nfOrigem: calc.nfUsada || null,
          };
        });
        if (algumVazio) { alert("Preencha o custo atual de todos os produtos antes de salvar."); return; }
        cmpSalvando = true;
        const custosMerged = { ...custosSalvos, ...updates };
        await update(ref(db, "/custos_medios_filial"), updates);
        cmpSalvando = false;
        salvarCmpBtn.textContent = "✓ Salvo!";
        salvarCmpBtn.style.color = "#4ade80";
        salvarCmpBtn.style.borderColor = "#4ade8066";
        csvAtribBtn.disabled = false;
        csvAtribBtn.style.cssText = "margin-top:0;margin-left:8px;background:none;border:1px solid #f0b40066;color:#f0b400;border-radius:4px;padding:6px 16px;font-size:11px;cursor:pointer;font-family:inherit;letter-spacing:0.5px;opacity:1;";
        csvAtribBtn._custosMerged = custosMerged;
        setTimeout(() => {

async function fetchVendas(days) {
  vendasLoading=true; render();

async function processarPlanilhaML(file) {
  // Usa SheetJS para ler o Excel no browser
  const arrayBuffer = await file.arrayBuffer();
  const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
  const wb = XLSX.read(arrayBuffer, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });

  // Encontra linha de header (tem "N.º de venda")
  let headerIdx = -1;
  for(let i=0; i<rows.length; i++) {
    if(rows[i].some(c => String(c||"").includes("N.º de venda"))) { headerIdx=i; break; }
  }
  if(headerIdx === -1) { alert("Formato de planilha não reconhecido"); return; }

  const headers = rows[headerIdx];
  const colTotal = headers.findIndex(h => String(h||"").includes("Total (BRL)"));
  const colStatus = headers.findIndex(h => String(h||"") === "Estado");
  const colTitulo = headers.findIndex(h => String(h||"").includes("Título do anúncio"));
  const colData = headers.findIndex(h => String(h||"").includes("Data da venda"));
  const colCancel = headers.findIndex(h => String(h||"").includes("Cancelamentos e reembolsos"));

  const dataRows = rows.slice(headerIdx+1).filter(r => r[colTotal] !== undefined && r[colTotal] !== "");
  const negItems = dataRows
    .filter(r => Number(r[colTotal]) < 0)
    .map(r => ({
      titulo: String(r[colTitulo]||"—").slice(0,50),
      status: String(r[colStatus]||"—"),
      data: r[colData] ? String(r[colData]).slice(0,10) : "—",
      total: Number(r[colTotal]),
      cancel: Number(r[colCancel]||0),
    }))
    .sort((a,b) => a.total - b.total);

  const totalNeg = negItems.reduce((s,i) => s + i.total, 0);

  diogoCustoData = {
    fileName: file.name,
    negCount: negItems.length,
    totalNeg: Math.round(totalNeg*100)/100,
    negItems,
  };
  render();
}

function buildContext(memberName) {
  const tasks = tasksFor(memberName);
  const active = tasks.filter(t=>!t.done);
  const done = tasks.filter(t=>t.done);
  let ctx = `Membro: ${memberName}
`;
  ctx += `Tarefas ativas (${active.length}): ${active.map(t=>`"${t.text}" [${t.prio}]`).join(", ") || "nenhuma"}
`;
  ctx += `Tarefas concluídas hoje (${done.length}): ${done.map(t=>`"${t.text}"`).join(", ") || "nenhuma"}
`;

  if(memberName === "Diogo") {
    if(diogoDevolucoes?.data) {
      ctx += `
Devoluções do mês: ${diogoDevolucoes.count} devoluções, custo total R$ ${diogoDevolucoes.totalCost?.toFixed(2)}
`;
      const urgent = diogoDevolucoes.data.filter(d=>d.refundedAmount>0).length;
      ctx += `Com custo: ${urgent}
`;
    }
    if(mlReclamacoes?.data) {
      const aguarda = mlReclamacoes.data.filter(d=>d.stage==="waiting_seller"||d.returnStatusKey==="waiting");
      ctx += `
Reclamações abertas: ${mlReclamacoes.data.length} total, ${aguarda.length} aguardando você
`;
    }
    if(mlCanceladas?.data) {
      ctx += `Cancelamentos abertos: ${mlCanceladas.data.length}
`;
    }
    if(estoqueExcelData?.rows?.length) {
      const rows = estoqueExcelData.rows;
      let totalValor=0, totalAptas=0, semCusto=0;
      const enriched = rows.map(r=>{
        const custo = estoqueBlingData ? (estoqueBlingData[normSku(r.sku)]||0) : 0;
        const valor = custo * r.aptas;
        if(!custo) semCusto++;
        totalValor += valor; totalAptas += r.aptas;
        const vendas30 = r.vendas30||0;
        const dias = vendas30>0 ? Math.round(r.aptas/(vendas30/30)) : 999;
        return {...r, custo, valor, dias};
      });
      ctx += `
ESTOQUE Filial SP (ML Full): ${rows.length} SKUs, valor total R$ ${totalValor.toFixed(2)}, ${totalAptas} unidades aptas, ${semCusto} SKUs sem custo cadastrado no Bling
`;
      const parados = enriched.filter(r=>r.dias>=999 && r.aptas>0).slice(0,10);
      if(parados.length) ctx += `Sem venda nos últimos 30 dias (${parados.length}): ${parados.map(r=>r.sku).join(", ")}
`;
      const acabando = enriched.filter(r=>r.dias<=15 && r.aptas>0).sort((a,b)=>a.dias-b.dias).slice(0,10);
      if(acabando.length) ctx += `Estoque acabando rápido (<=15 dias de giro): ${acabando.map(r=>`${r.sku} (${r.dias}d)`).join(", ")}
`;
    } else {
      ctx += `
ESTOQUE Filial SP: nenhuma planilha importada ainda na aba Estoque.
`;
    }
    if(matrizRows?.length) {
      const totalValorM = matrizRows.reduce((s,r)=>s+r.valor,0);
      const totalQtyM = matrizRows.reduce((s,r)=>s+r.qty,0);
      ctx += `ESTOQUE Matriz RS: ${matrizRows.length} SKUs, valor total R$ ${totalValorM.toFixed(2)}, ${totalQtyM} unidades
`;
    }
  }
  if(memberName === "Larissa") {
    if(mlDevolucoes?.data) {
      const pendentes = mlDevolucoes.data.filter(d=>d.needsReview);
      ctx += `
Devoluções pendentes de revisão: ${pendentes.length}
`;
      pendentes.forEach(d=>{ ctx += `- ${d.product} (${d.buyer})${d.dueDate?`, prazo: ${new Date(d.dueDate).toLocaleDateString("pt-BR")}`:""})
`; });
    }
    if(mlReclamacoes?.data) {
      ctx += `
Reclamações abertas: ${mlReclamacoes.data.length}
`;
    }
  }
  return ctx;
}

function formatChatMsg(text) {
  const lines = text.split("\n");
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.trim() === "") {
      if (out.length > 0) out.push('<div style="height:16px;"></div>');
      continue;
    }
    if (/^---+$/.test(line.trim())) {
      out.push('<hr style="border:none;border-top:1px solid var(--border);margin:14px 0;">');
      continue;
    }
    const hMatch = line.match(/^#{1,3} (.+)$/);
    if (hMatch) {
      out.push('<div style="font-weight:500;color:var(--text);margin:14px 0 6px;">' + hMatch[1] + '</div>');
      continue;
    }
    const liMatch = line.match(/^[-•] (.+)$/);
    if (liMatch) {
      out.push('<div style="padding:4px 0 4px 12px;border-left:2px solid var(--border);margin:6px 0;color:var(--text2);">' + liMatch[1] + '</div>');
      continue;
    }
    const numMatch = line.match(/^(\d+)\.\s+(.+)$/);
    if (numMatch) {
      out.push('<div style="padding:4px 0 4px 12px;border-left:2px solid var(--border);margin:6px 0;color:var(--text2);"><strong style="color:var(--text);">' + numMatch[1] + '.</strong> ' + numMatch[2] + '</div>');
      continue;
    }
    let l = line
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`([^`]+)`/g, '<code style="background:var(--bg2);padding:1px 5px;border-radius:3px;font-size:11px;font-family:monospace;">$1</code>');
    out.push('<div style="line-height:1.75;">' + l + '</div>');
  }
  return out.join("");
}

    const typing = document.createElement("div");
    typing.className = "chat-typing";
    typing.innerHTML = '<span class="spinning">↻</span> Digitando...';
    msgs.appendChild(typing);
  }

  modal.appendChild(msgs);
  setTimeout(() => { msgs.scrollTop = msgs.scrollHeight; }, 50);

  // Input
  const inputRow = document.createElement("div");
  inputRow.className = "chat-input-row";
  const input = document.createElement("textarea");
  input.className = "chat-input";
  input.placeholder = "Mensagem...";
  input.rows = 1;
  input.style.maxHeight = "80px";
  input.addEventListener("input", () => { input.style.height="auto"; input.style.height=input.scrollHeight+"px"; });
  const sendBtn = document.createElement("button");
  sendBtn.className = "chat-send";
  sendBtn.style.cssText = `background:${color};color:#000;`;
  sendBtn.textContent = "↑";
  sendBtn.disabled = cs.loading;

  const doSend = async () => {
    const text = input.value.trim();
    if(!text || cs.loading) return;
    input.value = ""; input.style.height="auto";
    cs.messages.push({ role:"user", content:text });
    cs.loading = true;
    renderChatModal(memberName, color);

    try {
      const r = await fetch(`${VERCEL_BACKEND}/api/claude-chat`, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          member: memberName,
          message: text,
          history: cs.messages.slice(-10),
          context: buildContext(memberName),
        }),
      });
      let data;
      try { data = await r.json(); } catch { data = null; }
      if(!r.ok) {
        cs.messages.push({ role:"assistant", content: data?.error || `Erro ${r.status} no servidor. Tente uma pergunta mais curta ou tente de novo em instantes.` });
      } else {
        cs.messages.push({ role:"assistant", content: data?.reply || data?.error || "Erro" });
        if(Array.isArray(data?.actions)){
          data.actions.forEach(action=>{
            try{
              if(action.type==="criar_tarefa"){
                const {member:taskMember,text:taskText,prio:taskPrio}=action.input||{};
                if(taskMember&&taskText&&taskPrio){
                  const norm=s=>String(s||"").trim().toLowerCase();
                  const jaExiste=Object.values(state.tasks||{}).some(t=>t!=null&&!t.done&&t.member===taskMember&&norm(t.text)===norm(taskText));
                  if(jaExiste){
                    cs.messages.push({ role:"assistant", content:`Já existe uma tarefa igual ("${taskText}") pendente pra ${taskMember} — não criei de novo pra não duplicar.` });
                  }else{
                    addTask(taskMember,taskText,taskPrio,memberName);
                    cs.messages.push({ role:"assistant", content:`✓ Tarefa criada para ${taskMember}: "${taskText}" [${PRIO[taskPrio]?.label||taskPrio}]` });
                  }
                }
              }else if(action.type==="criar_tarefa_recorrente"){
                const {member:taskMember,text:taskText,prio:taskPrio,frequency,dayOfWeek,dayOfMonth}=action.input||{};
                if(taskMember&&taskText&&taskPrio&&frequency){
                  const norm=s=>String(s||"").trim().toLowerCase();
                  const jaExiste=Object.values(state.recorrentes||{}).some(r=>r!=null&&r.active&&r.member===taskMember&&norm(r.text)===norm(taskText));
                  if(jaExiste){
                    cs.messages.push({ role:"assistant", content:`Já existe uma tarefa recorrente igual ("${taskText}") ativa pra ${taskMember} — não criei de novo pra não duplicar.` });
                  }else{
                    push(ref(db,"/recorrentes"),{
                      member:taskMember,text:taskText,prio:taskPrio,frequency,
                      dayOfWeek:frequency==="weekly"?(dayOfWeek??null):null,
                      dayOfMonth:frequency==="monthly"?(dayOfMonth??null):null,
                      active:true,createdBy:memberName,createdAt:Date.now(),
                    });
                    const freqLabel={daily:"todo dia",weekly:"toda semana",monthly:"todo mês"}[frequency]||frequency;
                    cs.messages.push({ role:"assistant", content:`✓ Tarefa recorrente criada para ${taskMember}: "${taskText}" [${PRIO[taskPrio]?.label||taskPrio}] — ${freqLabel}` });
                  }
                }
              }
            }catch(err){console.error("Erro ao executar ação do Claude:",err);cs.messages.push({ role:"assistant", content:"Não consegui confirmar se a ação foi salva. Confere na lista de tarefas." });}
          });
        }
      }
    } catch(e) {
      cs.messages.push({ role:"assistant", content:"Erro de conexão. Tente novamente." });
    }
    cs.loading = false;
    renderChatModal(memberName, color);
  };

  sendBtn.addEventListener("click", doSend);
  input.addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey) { e.preventDefault(); doSend(); } });
  inputRow.appendChild(input); inputRow.appendChild(sendBtn);
  modal.appendChild(inputRow);
  setTimeout(()=>input.focus(), 100);
}

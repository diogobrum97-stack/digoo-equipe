// ─── CALENDÁRIO FISCAL ────────────────────────────────────────────────────────



const CAL_CORES = {
  difal: "#f0b400",
  dare:  "#a855f7",
  ipi:   "#5e72e4",
  inss:  "#22c55e",
};

let calPanelOpen = false;
let calMesOffset = 0; // 0 = mês atual

function toggleCalFiscal() {
  calPanelOpen = !calPanelOpen;
  renderCalFiscal();
}

function renderCalFiscal() {
  const panel = document.getElementById("cal-panel");
  if(!calPanelOpen) { panel.style.display = "none"; return; }
  panel.style.display = "block";

  const hoje = new Date();
  const mesRef = new Date(hoje.getFullYear(), hoje.getMonth() + calMesOffset, 1);
  const mes = mesRef.getMonth();
  const ano = mesRef.getFullYear();
  const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

  // Calcular dias restantes pra cada evento no mês
  const eventosComDias = FISCAL_EVENTS.map(e => {
    const venc = new Date(ano, mes, e.dia);
    const diff = Math.ceil((venc - hoje) / (1000*60*60*24));
    return {...e, venc, diff};
  }).sort((a,b) => a.dia - b.dia);

  // (badge removido — botão agora está no header do card)

  // Montar painel
  const primeiroDia = new Date(ano, mes, 1).getDay();
  const ultimoDia = new Date(ano, mes+1, 0).getDate();

  // Agrupar eventos por dia
  const eventosPorDia = {};
  FISCAL_EVENTS.forEach(e => {
    if(!eventosPorDia[e.dia]) eventosPorDia[e.dia] = [];
    eventosPorDia[e.dia].push(e);
  });

  panel.style.fontFamily = "'Inter', sans-serif";
  panel.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:0.5px solid #1a1a1a;">
      <div style="font-size:11px;font-weight:600;letter-spacing:2px;color:${T.text2};text-transform:uppercase;">Calendário Fiscal</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button onclick="calMesOffset--;renderCalFiscal()" style="background:none;border:none;color:#999;font-size:13px;cursor:pointer;padding:2px 5px;">‹</button>
        <div style="font-size:11px;color:${T.text2};">${MESES[mes].slice(0,3)} ${ano}</div>
        <button onclick="calMesOffset++;renderCalFiscal()" style="background:none;border:none;color:#999;font-size:13px;cursor:pointer;padding:2px 5px;">›</button>
      </div>
    </div>

    <div style="padding:10px 14px;border-bottom:0.5px solid #1a1a1a;">
      <div style="display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;">
        ${["D","S","T","Q","Q","S","S"].map(d => `<div style="font-size:8px;color:${T.text3};text-align:center;letter-spacing:0.5px;">${d}</div>`).join("")}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;">
        ${Array(primeiroDia).fill('<div style="height:26px;"></div>').join("")}
        ${Array.from({length:ultimoDia},(_,i)=>{
          const d = i+1;
          const isHoje = d===hoje.getDate() && mes===hoje.getMonth() && ano===hoje.getFullYear();
          const evs = eventosPorDia[d] || [];
          const cor = evs.length > 0 ? CAL_CORES[evs[0].tipo] : null;
          return `<div style="height:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;font-size:11px;cursor:pointer;position:relative;${isHoje?"background:#5e72e4;color:${T.text};font-weight:700;":"color:"+(evs.length?"#ddd":"#888")+";"}">
            ${d}
            ${cor && !isHoje ? `<div style="width:3px;height:3px;border-radius:50%;background:${cor};position:absolute;bottom:2px;"></div>` : ""}
          </div>`;
        }).join("")}
      </div>
    </div>

    <div style="max-height:200px;overflow-y:auto;">
      <div style="font-size:8px;letter-spacing:1.5px;color:#999;text-transform:uppercase;padding:8px 14px 4px;">Próximos vencimentos</div>
      ${eventosComDias.filter(e => e.diff >= -1).map(e => {
        const cor = CAL_CORES[e.tipo] || "#555";
        const diasCor = e.diff < 0 ? "#e91e8c" : e.diff <= 7 ? "#e91e8c" : e.diff <= 14 ? "#f0b400" : "#888";
        const diasTxt = e.diff < 0 ? `${Math.abs(e.diff)}d atrás` : e.diff === 0 ? "hoje" : `em ${e.diff}d`;
        return `<div style="display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:0.5px solid #111;">
          <div style="font-size:11px;font-weight:700;color:${T.text3};width:18px;text-align:center;flex-shrink:0;">${e.dia}</div>
          <div style="width:6px;height:6px;border-radius:50%;background:${cor};flex-shrink:0;"></div>
          <div style="flex:1;">
            <div style="font-size:11px;font-weight:500;color:#ddd;">${e.nome}</div>
            <div style="font-size:11px;color:${T.text3};margin-top:1px;">Ref. ${String(mes).padStart(2,"0")}/${ano}</div>
          </div>
          <div style="font-size:11px;font-weight:600;color:${diasCor};white-space:nowrap;">${diasTxt}</div>
        </div>`;
      }).join("")}
    </div>
  `;
}

// initCalFiscal — sem fab fixo, badge gerenciado pelo render()
function initCalFiscal() {
  // noop — botão está no header do card, gerenciado pelo render()
}

  if(done){
    // concluído -> pendente (só via botão reabrir para recorrentes)
    if(!isRecorrente){
      update(ref(db,`/tasks/${id}`),{done:false,progress:false});
    }
    return;
  } else if(progress){
    // progresso -> concluído
    update(ref(db,`/tasks/${id}`),{done:true,progress:false});
  } else {
    // pendente -> em progresso
    update(ref(db,`/tasks/${id}`),{done:false,progress:true});
    return;
  }
  if(!done){
    const task=state.tasks&&state.tasks[id];
    if(task&&task.delegatedBy&&task.delegatedBy!=="Diogo"&&task.delegatedBy!==task.member){
      push(ref(db,"/notices"),{forMember:task.delegatedBy,text:task.text,by:task.member,ts:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),ts_raw:Date.now()});
      set(ref(db,`/flashes/${task.delegatedBy}`),{ts:Date.now(),msg:`${task.member} concluiu sua tarefa!`});
    }
    setTimeout(()=>{Object.entries(state.messages||{}).forEach(([msgId,msg])=>{if(msg!=null&&msg.taskId===id)update(ref(db,`/messages/${msgId}`),{closed:true});});},30000);
  }
}

async function checkAndCreateRecorrentes() {
  if(recorrentesChecked) return;
  recorrentesChecked = true;

  try {
    const hoje = new Date().toISOString().slice(0,10); // "2026-06-16"
    const logKey = `recorrentes_log/${hoje.replace(/-/g,"_")}`;

    // Verifica se já criou hoje
    const logSnap = await new Promise(resolve => {
      const ref2 = ref(db, logKey);
      onValue(ref2, snap => resolve(snap.val()), { onlyOnce: true });
    });
    if(logSnap) return; // já criou hoje

    // Busca recorrentes configuradas
    const recSnap = await new Promise(resolve => {
      const ref2 = ref(db, "/recorrentes");
      onValue(ref2, snap => resolve(snap.val()), { onlyOnce: true });
    });
    if(!recSnap) return;

    const hoje2 = new Date();
    const diaSemana = hoje2.getDay(); // 0=dom, 1=seg...
    const diaMes = hoje2.getDate();

    const recorrentes = Object.values(recSnap).filter(r => {
      if(!r || !r.active) return false;
      if(r.frequency === "daily") return true;
      if(r.frequency === "weekly") return r.dayOfWeek === diaSemana;
      if(r.frequency === "monthly") return r.dayOfMonth === diaMes;
      return false;
    });

    // Verifica tarefas recorrentes já existentes hoje (evita duplicata)
    const tasksSnap = await new Promise(resolve => {
      onValue(ref(db, "/tasks"), snap => resolve(snap.val()), { onlyOnce: true });
    });
    const existingTexts = Object.values(tasksSnap || {})
      .filter(t => t && t.isRecorrente)
      .map(t => t.text?.toLowerCase());

    // Cria as tarefas do dia
    for(const rec of recorrentes) {
      // Pula se já existe
      if(existingTexts.includes(rec.text?.toLowerCase())) continue;
      await push(ref(db, "/tasks"), {
        member: rec.member || "Diogo",
        text: rec.text,
        prio: rec.prio || "importante",
        done: false,
        progress: false,
        delegatedBy: null,
        isRecorrente: true,
        recorrenteId: rec.id || null,
        frequency: rec.frequency,
        createdAt: Date.now(),
      });
    }

    // Registra log do dia ANTES de criar (evita race condition)
    await set(ref(db, logKey), { createdAt: new Date().toISOString(), count: recorrentes.length });
    console.log(`Recorrentes criadas: ${recorrentes.length}`);
  } catch(e) {
    console.error("Erro ao criar recorrentes:", e.message);
  }
}

async function initCalcIpi(task, numeroManual){
  const chave = numeroManual || extrairNumeroNFDaTarefa(task);
  let nfData = state.nfes_processadas?.[chave];
  let erro = null;

  if(!nfData?.itens?.length && chave){
    calcIpiState[task.id] = { produtos: [], frete: 0, ipiOriginal: 0, carregando: true };
    render();
    try{
      const r = await fetch(`${BLING_PROXY}/api/bling-produtos?notaCompleta=${encodeURIComponent(chave)}`);
      const d = await r.json();
      if(r.ok && d?.data){
        const corpo = d.data;
        const itensBrutos = corpo.itens || corpo.itensNota || [];
        const itensExtraidos = itensBrutos.map(it => ({
          sku: it.codigo || null,
          produto: it.descricao || "",
          ncm: String(it.classificacaoFiscal || "").replace(/\D/g, ""),
          quantidade: Number(it.quantidade) || 0,
          valorUnit: Number(it.valor) || 0,
        })).filter(it => it.sku);
        if(!itensExtraidos.length){
          erro = `A nota #${chave} foi encontrada, mas nenhum item com SKU veio nela. Confere se o SKU está cadastrado nos produtos dessa nota no Bling.`;
        }
        nfData = { ...(nfData||{}), itens: itensExtraidos };
        set(ref(db, `/nfes_processadas/${chave}/itens`), itensExtraidos);
      }else{
        erro = d?.error || `Não achei a nota #${chave} no Bling (erro ${r.status}).`;
      }
    }catch(e){
      erro = `Erro de conexão ao buscar a nota #${chave}: ${e.message}`;
    }
  }else if(!chave){
    erro = "Não consegui identificar o número dessa NF a partir da tarefa. Digite o número manualmente abaixo.";
  }

  const itensNF = nfData?.itens || [];
  calcIpiState[task.id] = {
    produtos: itensNF.map(it => {
      const precoSalvo = state.precos_venda_manual?.[normSku(it.sku)];
      const precoRef = PRECOS_VENDA_REFERENCIA_NORM[normSku(it.sku)];
      const precoInicial = precoSalvo!=null ? precoSalvo : (precoRef!=null ? precoRef : null);
      const freteManual = state.frete_ml_manual?.[normSku(it.sku)];
      const sugestao = getAliquotaIPI(it.ncm); // só usada como ponto de partida — sempre editável depois
      return {
        sku: it.sku, produto: it.produto, qtd: it.quantidade, valorNf: it.valorUnit,
        ncm: it.ncm, precoVenda: precoInicial, automatico: true,
        aliquotaValor: sugestao.conhecido ? sugestao.valor : null,
        freteML: freteManual != null ? freteManual : null,
      };
    }),
    frete: 0, ipiOriginal: 0,
    erro: erro,
    nfUsada: chave,
    freteComponentes: null, // carregado do Firebase
  };
  // Tenta carregar frete médio por componente já calculado
  try {
    const frSnap = await get(ref(db, "/frete_medio_componentes"));
    const frVal = frSnap.val();
    if (frVal?.dados) {
      calcIpiState[task.id].freteComponentes = frVal.dados;
      calcIpiState[task.id].freteAtualizadoEm = frVal.atualizadoEm;
    }
  } catch(e) {}
  render();
}

function calcularLinhaIpi(p, freteUnitario){
  const precoVenda = p.precoVenda;
  if(precoVenda==null || !p.qtd) return { precoAjustado:0, baseUnit:0, baseTotal:0, ipi:0, aliquotaValor:p.aliquotaValor||0, freteUnitario:0 };
  const aliquotaValor = p.aliquotaValor!=null ? p.aliquotaValor : 0;
  const freteUn = Number(p.freteML != null ? p.freteML : (freteUnitario || 0));
  const precoAjustado = (precoVenda - freteUn) * (1 - REDUCAO_IPI);
  const baseUnit = precoAjustado - p.valorNf;
  const baseTotal = baseUnit * p.qtd;
  const ipi = baseTotal * aliquotaValor;
  return { precoAjustado, baseUnit, baseTotal, ipi, aliquotaValor, freteUnitario: freteUn };
}

  freteMLBtn.style.cssText = `padding:7px 14px;background:none;border:1px solid ${T.border};border-radius:6px;font-size:11px;font-weight:600;color:${T.text2};cursor:pointer;font-family:inherit;`;
  const freteAtualizado = calc.freteAtualizadoEm ? new Date(calc.freteAtualizadoEm).toLocaleDateString("pt-BR") : null;
  const temFrete = calc.freteComponentes && Object.keys(calc.freteComponentes).length > 0;
  const skusComFrete = temFrete ? calc.produtos.filter(p => calc.freteComponentes[p.sku] > 0).length : 0;
  freteMLBtn.textContent = temFrete ? `Atualizar frete ML${freteAtualizado ? " ("+freteAtualizado+")" : ""}` : "Calcular frete médio ML";

  // Cards por alíquota (BASE e VALOR), igual à planilha — ficam em cima da tabela

  const table = document.createElement("table");

  // Wrapper com scroll pra tabela não empurrar CMP pra fora

    <th style="text-align:right;padding:5px 3px;color:var(--text3);font-weight:400;">VALOR NF</th>
    <th style="text-align:right;padding:5px 3px;color:#f0b400;font-weight:400;">PREÇO VENDA</th>
    <th style="text-align:right;padding:5px 3px;color:var(--text3);font-weight:400;">VALOR DO IPI</th>
    <th style="text-align:right;padding:5px 3px;color:var(--text3);font-weight:400;">CMV C/ IPI+FRETE</th>
    <th style="width:16px;"></th>
  </tr></thead><tbody></tbody><tfoot></tfoot>`;
  const tbody = table.querySelector("tbody");
  const tfoot = table.querySelector("tfoot");
  tableScrollWrap.appendChild(table);
  wrap.appendChild(tableScrollWrap);

  if(!calc.linhaExpandida) calc.linhaExpandida = null; // índice do produto expandido pra editar NCM/alíquota, ou null

  const avisoBox = document.createElement("div");
  avisoBox.style.cssText = "margin-top:8px;font-size:11px;color:#f0b400;display:none;";
  wrap.appendChild(avisoBox);

  const addBtn = document.createElement("button");
  addBtn.textContent = "+ adicionar produto";
  addBtn.style.cssText = "margin-top:8px;width:100%;background:none;border:1px dashed #00dfc366;color:#00dfc3;border-radius:5px;padding:6px;font-size:11px;cursor:pointer;font-family:inherit;letter-spacing:0.5px;";
  addBtn.addEventListener("click", ()=>{ calc.produtos.push({sku:"",produto:"",qtd:0,valorNf:0,ncm:"",precoVenda:null,aliquotaValor:null,automatico:false}); render(); });
  wrap.appendChild(addBtn);

  const totalRow = document.createElement("div");
  totalRow.style.cssText = "margin-top:12px;padding-top:10px;border-top:1px solid var(--sep);display:flex;justify-content:space-between;align-items:center;";

  totalRow.appendChild(totalSpan);
  wrap.appendChild(totalRow);

  function montarLinhas(){
    tbody.innerHTML = "";
    calc.produtos.forEach((p, i)=>{
      const tr = document.createElement("tr");
      tr.style.cssText = "border-bottom:1px solid var(--sep);cursor:pointer;";
      tr.dataset.prodIdx = i;

      const tdSku = document.createElement("td"); tdSku.style.cssText="padding:6px 3px;";
      const aliqTextoHtml = (val) => val==null
        ? `<span class="aliqBadge" style="color:#e91e8c;font-size:11px;">sem %</span>`
        : `<span class="aliqBadge" style="color:var(--text3);font-size:11px;">${(val*100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}%</span>`;
      const seta = calc.linhaExpandida===i ? "▾" : "▸";
      if(p.automatico){
        tdSku.innerHTML = `<div style="color:#00dfc3;font-weight:600;">${p.sku} <span style="color:var(--border2);">·</span> ${aliqTextoHtml(p.aliquotaValor)} <span style="color:var(--text3);font-size:11px;">${seta}</span></div><div style="color:var(--text3);font-size:9.5px;margin-top:2px;">${p.produto||""}</div>`;
      }else{
        tdSku.innerHTML = `<div style="color:#00dfc3;font-weight:600;">· ${aliqTextoHtml(p.aliquotaValor)} <span style="color:var(--text3);font-size:11px;">${seta}</span></div>`;
        const inpSku=document.createElement("input"); inpSku.value=p.sku; inpSku.placeholder="SKU";
        inpSku.style.cssText="width:100px;background:var(--bg);border:1px solid var(--border2);border-radius:4px;padding:3px 5px;color:#00dfc3;font-family:inherit;font-size:11px;margin-top:2px;";
        inpSku.addEventListener("click",e=>e.stopPropagation());
        inpSku.addEventListener("input",()=>{p.sku=inpSku.value;});

      }
      tr.appendChild(tdSku);

      const tdQtd = document.createElement("td"); tdQtd.style.cssText="padding:6px 3px;text-align:center;";
      if(p.automatico){ tdQtd.textContent = p.qtd; }
      else{ const inpQtd=document.createElement("input"); inpQtd.type="number"; inpQtd.value=p.qtd; inpQtd.style.cssText="width:55px;background:var(--bg);border:1px solid var(--border2);border-radius:4px;padding:3px 5px;color:var(--text2);font-family:inherit;font-size:11px;text-align:center;"; inpQtd.addEventListener("click",e=>e.stopPropagation()); inpQtd.addEventListener("input",()=>{p.qtd=parseFloat(inpQtd.value)||0; recalcular();}); tdQtd.appendChild(inpQtd); }
      tr.appendChild(tdQtd);

      const tdValorNf = document.createElement("td"); tdValorNf.style.cssText="padding:6px 3px;text-align:right;";
      if(p.automatico){ tdValorNf.textContent = `R$ ${p.valorNf.toFixed(2)}`; }
      else{ const inpV=document.createElement("input"); inpV.type="number"; inpV.value=p.valorNf; inpV.style.cssText="width:60px;background:var(--bg);border:1px solid var(--border2);border-radius:4px;padding:3px 5px;color:var(--text2);font-family:inherit;font-size:11px;text-align:right;"; inpV.addEventListener("click",e=>e.stopPropagation()); inpV.addEventListener("input",()=>{p.valorNf=parseFloat(inpV.value)||0; recalcular();}); tdValorNf.appendChild(inpV); }
      tr.appendChild(tdValorNf);

      const tdPreco = document.createElement("td"); tdPreco.style.cssText="padding:6px 3px;text-align:right;";
      const inpPreco = document.createElement("input"); inpPreco.type="number"; inpPreco.placeholder="digitar";
      inpPreco.value = p.precoVenda!=null ? p.precoVenda.toFixed(2) : "";
      inpPreco.style.cssText=`width:70px;background:var(--bg);border:1px solid ${p.precoVenda==null?"#e91e8c":"var(--border2)"};border-radius:4px;padding:3px 5px;color:#f0b400;font-family:inherit;font-size:11px;text-align:right;`;
      inpPreco.addEventListener("click",e=>e.stopPropagation());
      // Só recalcula localmente enquanto digita (sem gravar no Firebase a cada
      // tecla — isso disparava um recarregamento da tela inteira e derrubava
      // o foco do campo no meio da digitação). Só grava quando sai do campo.
      inpPreco.addEventListener("input",()=>{
        const v=parseFloat(inpPreco.value); p.precoVenda=isNaN(v)?null:v; recalcular();
      });
      inpPreco.addEventListener("blur",()=>{
        if(p.precoVenda!=null && p.sku) set(ref(db, `/precos_venda_manual/${normSku(p.sku)}`), p.precoVenda);
      });
      tdPreco.appendChild(inpPreco);
      tr.appendChild(tdPreco);

      const tdIpi = document.createElement("td"); tdIpi.className="celulaIpi"; tdIpi.style.cssText="padding:6px 3px;text-align:right;color:#00dfc3;";
      tr.appendChild(tdIpi);

      const tdCmv = document.createElement("td"); tdCmv.className="celulaCmv"; tdCmv.style.cssText="padding:6px 3px;text-align:right;color:#7F77DD;";
      tr.appendChild(tdCmv);

      const tdDel = document.createElement("td"); tdDel.style.cssText="padding:6px 3px;";
      if(!p.automatico){ const delBtn=document.createElement("button"); delBtn.textContent="×"; delBtn.style.cssText="background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;"; delBtn.addEventListener("click",e=>{e.stopPropagation();calc.produtos.splice(i,1);render();}); tdDel.appendChild(delBtn); }
      tr.appendChild(tdDel);

      tr.addEventListener("click", ()=>{
        calc.linhaExpandida = calc.linhaExpandida===i ? null : i;
        montarLinhas();
        recalcular();
      });
      tbody.appendChild(tr);

      if(calc.linhaExpandida===i){
        const trDet = document.createElement("tr");
        trDet.style.cssText = "background:var(--bg);";
        const tdDet = document.createElement("td");
        tdDet.colSpan = 7;
        tdDet.style.cssText = "padding:10px 12px;";
        tdDet.innerHTML = `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
          <div><div style="font-size:11px;color:var(--text3);margin-bottom:3px;">NCM</div><div style="font-size:11px;color:var(--text2);">${p.ncm||"—"}</div></div>
        </div>`;
        const campoAliq = document.createElement("div");
        const lblAliq = document.createElement("div"); lblAliq.style.cssText="font-size:11px;color:var(--text3);margin-bottom:3px;"; lblAliq.textContent="ALÍQUOTA %";
        const inpAliqDet = document.createElement("input"); inpAliqDet.type="number"; inpAliqDet.step="0.01"; inpAliqDet.placeholder="digitar";
        inpAliqDet.value = p.aliquotaValor!=null ? (p.aliquotaValor*100) : "";
        inpAliqDet.style.cssText = "width:80px;background:var(--bg3);border:1px solid #f0b40066;border-radius:4px;padding:5px 8px;color:#f0b400;font-family:inherit;font-size:12px;";
        inpAliqDet.addEventListener("click",e=>e.stopPropagation());
        inpAliqDet.addEventListener("input",()=>{
          const v=parseFloat(inpAliqDet.value);
          p.aliquotaValor=isNaN(v)?null:v/100;
          const badge = tr.querySelector(".aliqBadge");
          if(badge){
            if(p.aliquotaValor==null){ badge.style.color="#e91e8c"; badge.textContent="sem %"; }
            else{ badge.style.color="var(--text3)"; badge.textContent=`${(p.aliquotaValor*100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}%`; }
          }
          recalcular();
        });
        campoAliq.appendChild(lblAliq); campoAliq.appendChild(inpAliqDet);
        tdDet.querySelector("div").appendChild(campoAliq);
        trDet.appendChild(tdDet);
        trDet.addEventListener("click", e=>e.stopPropagation());
        tbody.appendChild(trDet);
      }
    });

    // Rodapé: total de SKUs e total de unidades
    const totalUnidades = calc.produtos.reduce((s,p)=>s+(p.qtd||0),0);
    tfoot.innerHTML = `<tr style="border-top:1px solid var(--border2);position:sticky;bottom:0;background:var(--bg3);">
      <td style="padding:8px 3px;color:var(--text2);font-size:11px;font-weight:600;">${calc.produtos.length} SKUs</td>
      <td style="padding:8px 3px;text-align:center;color:var(--text);font-size:11px;font-weight:600;">${totalUnidades.toLocaleString("pt-BR")} un.</td>
      <td colspan="5"></td>
    </tr>`;
  }

  function recalcular(){
    let total = 0;
    const porAliquota = new Map(); // valorAliquota -> {base, valor}
    const linhas = tbody.querySelectorAll("tr[data-prod-idx]");

    // Base de rateio (pra diluir frete + IPI da NF original proporcionalmente),
    // igual à planilha: soma valorNf*qtd de todos os produtos com qtd>0
    let baseRateio = 0;
    calc.produtos.forEach(p=>{ if(p.qtd>0) baseRateio += p.valorNf * p.qtd; });
    const totalDiluir = (calc.frete||0) + (calc.ipiOriginal||0);

    calc.produtos.forEach((p, i)=>{
      const freteUn = calc.freteComponentes?.[p.sku] || 0;
      const r = calcularLinhaIpi(p, freteUn);
      total += r.ipi;
      if(p.precoVenda!=null && p.qtd>0 && p.aliquotaValor!=null){
        const chaveAliq = p.aliquotaValor;
        if(!porAliquota.has(chaveAliq)) porAliquota.set(chaveAliq, {base:0, valor:0});
        const acc = porAliquota.get(chaveAliq);
        acc.base += r.baseTotal;
        acc.valor += r.ipi;
      }
      const celulaIpi = linhas[i]?.querySelector(".celulaIpi");
      if(celulaIpi) celulaIpi.textContent = (p.precoVenda!=null && p.aliquotaValor!=null) ? `R$ ${r.ipi.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}` : "—";

      const celulaCmv = linhas[i]?.querySelector(".celulaCmv");
      if(celulaCmv){
        if(p.precoVenda!=null && p.qtd>0 && baseRateio>0){
          const cmv = p.valorNf + (r.ipi/p.qtd) + (p.valorNf/baseRateio)*totalDiluir;
          celulaCmv.textContent = `R$ ${cmv.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
        }else{
          celulaCmv.textContent = "—";
        }
      }
    });

    cardsWrap.innerHTML = "";
    [...porAliquota.keys()].sort().forEach(aliq=>{
      const d = porAliquota.get(aliq);
      const card = document.createElement("div");
      card.style.cssText = "flex:1;min-width:130px;background:var(--bg);border-radius:8px;overflow:hidden;";
      card.innerHTML = `
        <div style="background:${T.bg};padding:6px;text-align:center;font-size:11px;font-weight:600;color:${T.text};">${(aliq*100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}%</div>
        <div style="padding:7px;text-align:center;border-top:1px solid var(--sep);">
          <div style="font-size:11px;color:var(--text3);">BASE</div>
          <div style="font-size:12px;color:var(--text);">R$ ${d.base.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        </div>
        <div style="padding:7px;text-align:center;border-top:1px solid var(--sep);">
          <div style="font-size:11px;color:var(--text3);">VALOR</div>
          <div style="font-size:12px;color:#00dfc3;">R$ ${d.valor.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        </div>`;
      cardsWrap.appendChild(card);
    });

    const semAliquota = calc.produtos.filter(p=>p.precoVenda!=null && p.aliquotaValor==null).length;
    avisoBox.innerHTML = "";
    if(semAliquota>0){
      avisoBox.style.display="block";
      avisoBox.textContent = `⚠ ${semAliquota} produto(s) sem alíquota preenchida (campo em vermelho na tabela) — não entram no total até você preencher.`;
    }else{
      avisoBox.style.display="none";
    }
    const totalEl = totalSpan;
    if(totalEl) totalEl.textContent = `R$ ${total.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  }

  container.appendChild(wrap);
  montarLinhas();
  recalcular();

  // ── Seção Custo Médio Ponderado ───────────────────────────────
  // Estado de expansão do card CMP: 0=pequeno, 1=médio, 2=fullscreen
  if(window._cmpExpand === undefined) window._cmpExpand = 0;

  const cmpWrap = document.createElement("div");
  cmpWrap.style.cssText = "margin-top:16px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;";

  const cmpHeader = document.createElement("div");
  cmpHeader.style.cssText = "display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;";
  const cmpTitle = document.createElement("div");
  cmpTitle.style.cssText = "font-size:11px;color:var(--text3);letter-spacing:1.5px;";
  cmpTitle.textContent = "CUSTO MÉDIO PONDERADO — FILIAL SP";

  const cmpRightBtns = document.createElement("div");
  cmpRightBtns.style.cssText = "display:flex;gap:6px;align-items:center;";

  const cmpBuscarBtn = document.createElement("button");
  cmpBuscarBtn.textContent = "↻ Calcular CMP";
  cmpBuscarBtn.style.cssText = "background:none;border:1px solid #00dfc366;color:#00dfc3;border-radius:4px;padding:4px 12px;font-size:11px;cursor:pointer;font-family:inherit;";

  cmpRightBtns.appendChild(cmpBuscarBtn);
  cmpHeader.appendChild(cmpTitle); cmpHeader.appendChild(cmpRightBtns);
  cmpWrap.appendChild(cmpHeader);

  const cmpContent = document.createElement("div");
  cmpContent.style.cssText = "font-size:11px;color:var(--text3);";
  cmpContent.textContent = "Clique em ↻ Calcular CMP para buscar o custo atual da Filial e calcular o novo custo médio ponderado.";
  cmpWrap.appendChild(cmpContent);

  // Overlay fullscreen
  let fsOverlay = null;
  function aplicarExpansaoCmp() {
    expandBtn.textContent = ["⤢","⤡","✕"][window._cmpExpand];

    if(window._cmpExpand === 0) {
      // Pequeno — remove fullscreen se existir
      if(fsOverlay) { fsOverlay.remove(); fsOverlay = null; }
      cmpWrap.style.position = "";
      cmpWrap.style.zIndex = "";
      cmpWrap.style.top = "";
      cmpWrap.style.left = "";
      cmpWrap.style.width = "";
      cmpWrap.style.height = "";
      cmpWrap.style.borderRadius = "8px";
      cmpWrap.style.overflow = "";
    } else if(window._cmpExpand === 1) {
      // Médio — sem mudança visual, mas panel pai já é largo
      if(fsOverlay) { fsOverlay.remove(); fsOverlay = null; }
      cmpWrap.style.position = "";
      cmpWrap.style.zIndex = "";
    } else {
      // Fullscreen
      fsOverlay = document.createElement("div");
      fsOverlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;display:flex;align-items:center;justify-content:center;";
      fsOverlay.addEventListener("click", e => { if(e.target===fsOverlay){ window._cmpExpand=0; aplicarExpansaoCmp(); }});
      document.body.appendChild(fsOverlay);
      fsOverlay.appendChild(cmpWrap);
      cmpWrap.style.cssText = "background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:20px;width:90vw;max-height:85vh;overflow-y:auto;";
    }
  }

  // Auto-carrega CMP se já foi calculado antes nesta sessão
  if(calcIpiState[task.id]?.cmpDados) {
    cmpBuscarBtn.textContent = "↻ Atualizar CMP";
    setTimeout(() => cmpBuscarBtn.click(), 50);
  }

  cmpBuscarBtn.addEventListener("click", async () => {
    const produtosComCmv = calc.produtos.filter(p => p.precoVenda != null && p.qtd > 0);
    if (produtosComCmv.length === 0) { cmpContent.textContent = "Preencha os preços de venda primeiro."; return; }

    cmpBuscarBtn.textContent = "↻ Buscando...";
    cmpBuscarBtn.disabled = true;
    cmpContent.innerHTML = "";

    try {
      // Busca estoque atual da Filial via ML
      const rEstoque = await fetch(`${VERCEL_BACKEND}/api/ml-vendas?estoque=1`).then(r=>r.json());
      const estoquePorSku = {};
      (rEstoque.rows || []).forEach(r => {
        if(r.sku) estoquePorSku[r.sku.toLowerCase()] = r.aptas || 0;
      });

      // Busca custos salvos no Firebase (último CMP calculado por SKU)
      const custosSalvosSnap = await get(ref(db, "/custos_medios_filial"));
      const custosSalvos = custosSalvosSnap.val() || {};

      // Salva no calcIpiState para persistir entre renders
      calcIpiState[task.id].cmpDados = { estoquePorSku, custosSalvos };

      // Monta tabela editável
      const tbl = document.createElement("table");
      tbl.style.cssText = "width:100%;border-collapse:collapse;font-size:11px;";
      tbl.className = "cmp-table";
      tbl.innerHTML = `<thead><tr style="border-bottom:1px solid var(--sep);">
        <th style="text-align:left;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1px;">SKU</th>
        <th style="text-align:right;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1px;">QTD NF</th>
        <th style="text-align:right;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1px;">CMV NF</th>
        <th style="text-align:right;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1px;">ESTOQUE FILIAL</th>
        <th style="text-align:right;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1px;">CUSTO ATUAL</th>
        <th style="text-align:right;padding:6px 8px;font-size:11px;color:var(--text3);font-weight:400;letter-spacing:1px;">NOVO CMP</th>
      </tr></thead><tbody></tbody>`;
      const tbody2 = tbl.querySelector("tbody");

      // Estado local editável
      const linhasCmp = produtosComCmv.map(p => {
        const r = calcularLinhaIpi(p);
        // CMV completo = valorNF + IPI unitário + frete rateado + IPI original rateado
        const baseRateio = produtosComCmv.reduce((s, pp) => s + (pp.valorNf||0) * (pp.qtd||0), 0);
        const totalDiluir = (calc.frete||0) + (calc.ipiOriginal||0);
        const freteProporcional = baseRateio > 0 ? (p.valorNf / baseRateio) * totalDiluir : 0;
        const cmvUnit = p.valorNf + (r.ipi / p.qtd) + freteProporcional;
        const skuKey = (p.sku||"").toLowerCase();
        const fbKey  = skuKey.replace(/-/g, "_");
        // Busca em todas as variações de chave: underscore, hífen, uppercase
        const custoSalvo = 
          custosSalvos[fbKey]?.novoCmp ?? 
          custosSalvos[fbKey]?.custoAtual ?? 
          custosSalvos[skuKey]?.novoCmp ?? 
          custosSalvos[skuKey]?.custoAtual ?? 
          custosSalvos[p.sku]?.novoCmp ?? 
          custosSalvos[p.sku]?.custoAtual ?? null;
        console.log(`[CMP] ${p.sku} custoSalvo: ${custoSalvo}`);
        const estoqueAtual = estoquePorSku[skuKey] ?? 0;
        return { sku: p.sku, skuKey, qtd: p.qtd, cmvUnit, estoqueAtual, custoAtual: custoSalvo, novoCmp: null };
      });

      function calcNovoCmp(l) {
        if (l.custoAtual == null || l.custoAtual === "") return null;
        const ca = parseFloat(String(l.custoAtual).replace(",",".")) || 0;
        return (l.qtd * l.cmvUnit + l.estoqueAtual * ca) / (l.qtd + l.estoqueAtual);
      }

      function renderLinhasCmp() {
        tbody2.innerHTML = "";
        linhasCmp.forEach(l => {
          l.novoCmp = calcNovoCmp(l);
          const tr2 = document.createElement("tr");
          tr2.style.cssText = "border-bottom:1px solid var(--sep);";
          const fmt = v => v != null ? `R$ ${Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}` : "—";
          const semCusto = l.custoAtual == null || l.custoAtual === "";

          // Células fixas — visual igual à tabela de IPI acima
          const tdSku = document.createElement("td"); tdSku.style.cssText="padding:6px 8px;";
          tdSku.innerHTML = `<div style="color:#00dfc3;font-weight:600;">${l.sku||"—"}</div>`;
          const tdQtd = document.createElement("td"); tdQtd.style.cssText="padding:6px 8px;text-align:right;color:var(--text2);"; tdQtd.textContent=l.qtd;
          const tdCmv = document.createElement("td"); tdCmv.style.cssText="padding:6px 8px;text-align:right;color:#7F77DD;"; tdCmv.textContent=fmt(l.cmvUnit);
          const tdEst = document.createElement("td"); tdEst.style.cssText="padding:6px 8px;text-align:right;color:var(--text2);"; tdEst.textContent=l.estoqueAtual;

          // Custo atual — editável
          const tdCusto = document.createElement("td"); tdCusto.style.cssText="padding:6px 8px;text-align:right;";
          const iCusto = document.createElement("input");
          iCusto.type = "number";
          iCusto.step = "0.01";
          iCusto.value = l.custoAtual != null ? parseFloat(String(l.custoAtual).replace(",",".")).toFixed(2) : "";
          iCusto.placeholder = semCusto ? "⚠ preencher" : "";
          iCusto.style.cssText = `width:80px;background:none;border:none;border-bottom:1px solid ${semCusto?"#e91e8c66":"var(--border2)"};color:${semCusto?"#e91e8c":"#f0b400"};font-family:inherit;font-size:11px;text-align:right;outline:none;padding:2px 4px;`;
          iCusto.addEventListener("input", () => {
            l.custoAtual = iCusto.value;
            iCusto.style.borderBottomColor = "var(--border2)";
            iCusto.style.color = "#f0b400";
            l.novoCmp = calcNovoCmp(l);
            tdNovoCmp.textContent = fmt(l.novoCmp);
            tdNovoCmp.style.color = l.novoCmp ? "#4ade80" : "var(--text3)";
          });
          tdCusto.appendChild(iCusto);

          // Novo CMP
          const tdNovoCmp = document.createElement("td");
          tdNovoCmp.style.cssText = `padding:6px 3px;text-align:right;font-weight:600;color:${l.novoCmp?"#4ade80":"var(--text3)"};`;
          tdNovoCmp.textContent = fmt(l.novoCmp);

          tr2.appendChild(tdSku); tr2.appendChild(tdQtd); tr2.appendChild(tdCmv);
          tr2.appendChild(tdEst); tr2.appendChild(tdCusto); tr2.appendChild(tdNovoCmp);
          tbody2.appendChild(tr2);
        });
      }

      renderLinhasCmp();
      cmpContent.appendChild(tbl);

      // Botão salvar CMP
      const salvarCmpBtn = document.createElement("button");
      salvarCmpBtn.textContent = "✓ Salvar CMP";
      salvarCmpBtn.style.cssText = "margin-top:12px;background:none;border:1px solid #00dfc366;color:#00dfc3;border-radius:4px;padding:6px 16px;font-size:11px;cursor:pointer;font-family:inherit;letter-spacing:0.5px;";
      salvarCmpBtn.addEventListener("click", async () => {
        const updates = {};
        let algumVazio = false;
        linhasCmp.forEach(l => {
          const custoNum = parseFloat(String(l.custoAtual||"").replace(",",".")) || 0;
          if (!custoNum) { algumVazio = true; return; }
          // Firebase não aceita - em chaves, usa _ 
          const fbKey = l.skuKey.replace(/-/g, "_");
          updates[fbKey] = {
            sku: l.sku,
            skuOriginal: l.skuKey,
            novoCmp: l.novoCmp || null,
            custoAtual: custoNum,
            atualizadoEm: Date.now(),
            nfOrigem: calc.nfUsada || null,
          };
        });
        if (algumVazio) { alert("Preencha o custo atual de todos os produtos antes de salvar."); return; }
        cmpSalvando = true;
        const custosMerged = { ...custosSalvos, ...updates };
        await update(ref(db, "/custos_medios_filial"), updates);
        cmpSalvando = false;
        salvarCmpBtn.textContent = "✓ Salvo!";
        salvarCmpBtn.style.color = "#4ade80";
        salvarCmpBtn.style.borderColor = "#4ade8066";
        csvAtribBtn.disabled = false;
        csvAtribBtn.style.cssText = "margin-top:0;margin-left:8px;background:none;border:1px solid #f0b40066;color:#f0b400;border-radius:4px;padding:6px 16px;font-size:11px;cursor:pointer;font-family:inherit;letter-spacing:0.5px;opacity:1;";
        csvAtribBtn._custosMerged = custosMerged;
        setTimeout(() => {
          salvarCmpBtn.textContent = "✓ Salvar CMP";
          salvarCmpBtn.style.color = "#00dfc3";
          salvarCmpBtn.style.borderColor = "#00dfc366";
        }, 2500);

        // Gera CSV de atributos atualizado automaticamente
        // CSV gerado só quando usuário clicar no botão manual
      });

      // Botão gerar CSV separado
      const csvAtribBtn = document.createElement("button");
      csvAtribBtn.textContent = "↓ Gerar CSV de Atributos";
      csvAtribBtn.disabled = true;
      csvAtribBtn.style.cssText = "margin-top:0;margin-left:8px;background:none;border:1px solid #f0b40033;color:#f0b40066;border-radius:4px;padding:6px 16px;font-size:11px;cursor:not-allowed;font-family:inherit;letter-spacing:0.5px;opacity:0.5;";
      csvAtribBtn.addEventListener("click", async () => {
        const custos = csvAtribBtn._custosMerged || (await get(ref(db, "/custos_medios_filial"))).val() || {};
        gerarCSVAtributos(custos);
      });
      cmpContent.appendChild(salvarCmpBtn);
      cmpContent.appendChild(csvAtribBtn);

    } catch(e) {
      cmpContent.textContent = `Erro: ${e.message}`;
    }
    cmpBuscarBtn.textContent = "↻ Calcular CMP";
    cmpBuscarBtn.disabled = false;
  });

  container.appendChild(cmpWrap);

}

// ── Preview e emissão da NF complementar de IPI ──────────────────────────────
async function renderNfComplementarPreview(container, task, calc) {
  // Remover botão e mostrar painel de preview
  const overlay = document.createElement("div");
  overlay.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;`;

  const box = document.createElement("div");
  box.style.cssText = `background:${T.card};border:1px solid ${T.border};border-radius:14px;padding:24px;max-width:680px;width:100%;max-height:90vh;overflow-y:auto;box-sizing:border-box;`;

  // Header
  box.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <div style="font-size:15px;font-weight:700;color:${T.text};">NF Complementar de IPI</div>
        <div style="font-size:11px;color:${T.text3};margin-top:2px;">CFOP 6.152 · Natureza: Complementar de IPI · Matriz RS → Filial SP</div>
      </div>
      <button id="nf-comp-fechar" style="background:none;border:none;color:${T.text3};font-size:20px;cursor:pointer;padding:4px 8px;">×</button>
    </div>
  `;

  // Referência NF original
  const refBlock = document.createElement("div");
  refBlock.style.cssText = `background:${T.bg3};border:1px solid ${T.border};border-radius:8px;padding:12px 14px;margin-bottom:16px;`;
  const nfRef = calc.nfUsada || task?.nfNumero || "";
  const chaveRef = calc.chaveAcesso || "";
  refBlock.innerHTML = `
    <div style="font-size:11px;color:${T.text3};margin-bottom:8px;">Referência à NF original</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div>
        <div style="font-size:10px;color:${T.text3};margin-bottom:3px;">Número da NF</div>
        <input id="nf-comp-numero-ref" type="text" value="${nfRef}" placeholder="ex: 020061" style="width:100%;background:${T.bg};border:1px solid ${T.border};border-radius:4px;padding:7px 10px;color:${T.text};font-size:12px;font-family:inherit;outline:none;box-sizing:border-box;">
      </div>
      <div>
        <div style="font-size:10px;color:${T.text3};margin-bottom:3px;">Chave de Acesso (44 dígitos) <span style="color:${T.text3};">— opcional se informar número</span></div>
        <input id="nf-comp-chave-ref" type="text" value="${chaveRef}" placeholder="ex: 35240812345..." style="width:100%;background:${T.bg};border:1px solid ${T.border};border-radius:4px;padding:7px 10px;color:${T.text};font-size:12px;font-family:inherit;outline:none;box-sizing:border-box;">
      </div>
    </div>
  `;
  box.appendChild(refBlock);

  // Tabela de itens com IPI
  const itensBlock = document.createElement("div");
  itensBlock.style.cssText = `margin-bottom:16px;`;
  itensBlock.innerHTML = `<div style="font-size:11px;color:${T.text3};margin-bottom:8px;">Itens — valores de IPI a complementar</div>`;

  const produtosComIpi = (calc.produtos || []).filter(p => p.aliquotaValor > 0 && p.qtd > 0 && p.precoVenda != null).map(p => { const r = calcularLinhaIpi(p, calc.freteComponentes?.[p.sku] || 0); return { ...p, aliquota: p.aliquotaValor, quantidade: p.qtd, ipiUnitario: p.qtd > 0 ? r.ipi / p.qtd : 0, produto: p.produto || p.sku }; });

  if (!produtosComIpi.length) {
    // Se veio da NF de transferência sem dados de IPI, mostra aviso diferente
    const semCalc = !calc.produtos?.length;
    itensBlock.innerHTML += `<div style="font-size:12px;color:${T.text2};padding:10px;background:${T.bg3};border:1px solid ${T.border};border-radius:6px;">${semCalc ? "Informe o número da NF acima e acesse a calculadora de IPI na tarefa para calcular os valores antes de emitir." : "Nenhum produto com IPI calculado. Calcule o IPI antes de gerar a NF complementar."}</div>`;
    box.appendChild(itensBlock);
  } else {
    const tbl = document.createElement("table");
    tbl.style.cssText = `width:100%;border-collapse:collapse;font-size:11px;`;
    tbl.innerHTML = `
      <thead>
        <tr style="border-bottom:1px solid ${T.border};">
          <th style="text-align:left;padding:6px 8px;color:${T.text3};font-weight:500;">Produto / SKU</th>
          <th style="text-align:center;padding:6px 8px;color:${T.text3};font-weight:500;">NCM</th>
          <th style="text-align:center;padding:6px 8px;color:${T.text3};font-weight:500;">Qtd</th>
          <th style="text-align:center;padding:6px 8px;color:${T.text3};font-weight:500;">Alíq. IPI</th>
          <th style="text-align:right;padding:6px 8px;color:${T.text3};font-weight:500;">Vl. IPI Unit</th>
          <th style="text-align:right;padding:6px 8px;color:${T.text3};font-weight:500;">Vl. IPI Total</th>
        </tr>
      </thead>
      <tbody>
        ${produtosComIpi.map(p => {
          const ipiUnit = parseFloat(p.ipiUnitario || 0);
          const ipiTotal = ipiUnit * Number(p.quantidade);
          return `<tr style="border-bottom:1px solid ${T.sep};">
            <td style="padding:8px;color:${T.text};">${p.produto || p.sku}<br><span style="color:${T.text3};font-size:10px;">${p.sku}</span></td>
            <td style="padding:8px;text-align:center;color:${T.text2};">${p.ncm || "—"}</td>
            <td style="padding:8px;text-align:center;color:${T.text2};">${p.quantidade}</td>
            <td style="padding:8px;text-align:center;color:${T.text2};">${Number(p.aliquota*100).toFixed(0)}%</td>
            <td style="padding:8px;text-align:right;color:${T.text};font-family:'IBM Plex Mono',monospace;">R$ ${ipiUnit.toLocaleString("pt-BR",{minimumFractionDigits:2})}</td>
            <td style="padding:8px;text-align:right;color:${T.text};font-family:'IBM Plex Mono',monospace;font-weight:600;">R$ ${ipiTotal.toLocaleString("pt-BR",{minimumFractionDigits:2})}</td>
          </tr>`;
        }).join("")}
      </tbody>
      <tfoot>
        <tr style="border-top:2px solid ${T.border};">
          <td colspan="5" style="padding:10px 8px;text-align:right;color:${T.text3};font-size:11px;">Total IPI Complementar</td>
          <td style="padding:10px 8px;text-align:right;color:#00dfc3;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;">R$ ${produtosComIpi.reduce((s,p)=>{const u=parseFloat(p.ipiUnitario||0);return s+u*Number(p.quantidade);},0).toLocaleString("pt-BR",{minimumFractionDigits:2})}</td>
        </tr>
      </tfoot>
    `;
    itensBlock.appendChild(tbl);
    box.appendChild(itensBlock);

    // Aviso + botão emitir
    const avisoBlock = document.createElement("div");
    avisoBlock.style.cssText = `background:${T.infoBg};border:1px solid ${T.infoBor};border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:11px;color:${T.infoTxt};line-height:1.6;`;
    avisoBlock.innerHTML = `ℹ️ A NF será emitida com CFOP 6152, finalidade <strong>Complementar</strong>, referenciando a NF original. Valor dos itens = R$ 0,00. Apenas o IPI será destacado. Verifique os dados antes de emitir.`;
    box.appendChild(avisoBlock);

    // Status de emissão
    const statusEl = document.createElement("div");
    statusEl.id = "nf-comp-status";
    box.appendChild(statusEl);

    // Botão emitir
    const emitirBtn = document.createElement("button");
    emitirBtn.id = "nf-comp-emitir";
    emitirBtn.textContent = "Emitir NF Complementar de IPI";
    emitirBtn.style.cssText = `width:100%;padding:12px;border-radius:6px;background:#00dfc3;border:none;color:#000;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;`;
    emitirBtn.addEventListener("click", async () => {
      const chaveRefInput = document.getElementById("nf-comp-chave-ref")?.value?.trim() || "";
      const numeroRefInput = document.getElementById("nf-comp-numero-ref")?.value?.trim() || "";
      if (!chaveRefInput && !numeroRefInput) {
        statusEl.innerHTML = `<div style="background:${T.errBg};border:1px solid ${T.errBor};border-radius:6px;padding:10px;font-size:11px;color:${T.errText};margin-bottom:12px;">Informe o número ou a chave de acesso da NF original.</div>`;
        return;
      }

      emitirBtn.disabled = true;
      emitirBtn.textContent = "Emitindo...";
      statusEl.innerHTML = `<div style="font-size:11px;color:${T.text3};padding:8px 0;">Enviando para o Bling e transmitindo para a SEFAZ...</div>`;

      try {
        const payload = {
          chaveRefOriginal: chaveRefInput || null,
          numeroOriginal: numeroRefInput || null,
          itens: produtosComIpi.map(p => ({
            sku: p.sku,
            descricao: p.produto || p.sku,
            ncm: p.ncm || "",
            quantidade: Number(p.quantidade),
            aliquota: Number(p.aliquota),
            valorIpi: parseFloat(p.ipiUnitario || 0), // unitário — Bling multiplica pela qtd internamente
          })),
        };

        const r = await fetch(`${BLING_PROXY}/api/bling-produtos?action=emitir-complementar-ipi`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await r.json();

        if (!r.ok || !data.ok) {
          statusEl.innerHTML = `<div style="background:${T.errBg};border:1px solid ${T.errBor};border-radius:6px;padding:10px 12px;font-size:11px;color:${T.errText};margin-bottom:12px;white-space:pre-wrap;">Erro: ${data.erro || "Falha ao emitir"}
${JSON.stringify(data.detalhe||data.raw||"",null,2)}</div>`;
          emitirBtn.disabled = false;
          emitirBtn.textContent = "Tentar novamente";
          return;
        }

        // Sucesso
        statusEl.innerHTML = `
          <div style="background:${T.okBg};border:1px solid ${T.okBor};border-radius:8px;padding:14px;margin-bottom:12px;">
            <div style="font-size:13px;font-weight:700;color:${T.okTxt};margin-bottom:8px;">✓ NF emitida com sucesso!</div>
            <div style="font-size:11px;color:${T.text2};margin-bottom:4px;">Número: <strong style="color:${T.text};">${data.numero || "—"}</strong></div>
            <div style="font-size:11px;color:${T.text2};margin-bottom:8px;">Chave: <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:${T.text};">${data.chaveAcesso || "—"}</span></div>
            <div style="font-size:10px;color:${T.text3};">Status SEFAZ: ${data.status || "—"}</div>
          </div>
        `;
        emitirBtn.style.background = T.okBg;
        emitirBtn.style.color = T.okTxt;
        emitirBtn.style.border = `1px solid ${T.okBor}`;
        emitirBtn.textContent = "✓ Emitida";
        emitirBtn.disabled = true;

        // Salva chave no Firebase para referência futura
        if (data.chaveAcesso && calc.nfUsada) {
          const chaveKey = String(calc.nfUsada).replace(/[.#$\[\]\/]/g, "_");
          await update(ref(db, `/nfes_processadas/${chaveKey}`), { chaveAcesso: data.chaveAcesso, nfComplementarNumero: data.numero });
        }

        // Marca subtarefa "Gerar complemento de IPI" como feita na tarefa correspondente
        const nfRef = document.getElementById("nf-comp-numero-ref")?.value?.trim() || calc.nfUsada || "";
        if (nfRef) {
          const tarefas = Object.entries(state.tasks || {});
          const taskAlvo = tarefas.find(([id, t]) =>
            t.subtarefas && String(t.nfNumero || t.text || "").includes(String(nfRef))
          );
          if (taskAlvo) {
            const [taskId, taskObj] = taskAlvo;
            const idx = (taskObj.subtarefas || []).findIndex(s => s.texto?.toLowerCase().includes("complemento"));
            if (idx >= 0) {
              update(ref(db, `/tasks/${taskId}/subtarefas/${idx}`), { feito: true });
            }
          }
        }

      } catch (e) {
        statusEl.innerHTML = `<div style="background:${T.errBg};border:1px solid ${T.errBor};border-radius:6px;padding:10px;font-size:11px;color:${T.errText};margin-bottom:12px;">${e.message}</div>`;
        emitirBtn.disabled = false;
        emitirBtn.textContent = "Tentar novamente";
      }
    });
    box.appendChild(emitirBtn);
  }

  overlay.appendChild(box);
  document.body.appendChild(overlay);

  document.getElementById("nf-comp-fechar")?.addEventListener("click", () => overlay.remove());
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
}

async function fetchVendas(days) {
  vendasLoading=true; render();
  try {
    const token=state.ml_token?.access_token;
    if(!token){vendasData={error:"token ausente"};vendasLoading=false;render();return;}
    const r=await fetch(`${VERCEL_BACKEND}/api/ml-vendas?token=${token}&days=${days}`);
    vendasData=await r.json();
  }catch(e){vendasData={error:e.message};}
  vendasLoading=false; render();
}

async function processarPlanilhaML(file) {
  // Usa SheetJS para ler o Excel no browser
  const arrayBuffer = await file.arrayBuffer();
  const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
  const wb = XLSX.read(arrayBuffer, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });

  // Encontra linha de header (tem "N.º de venda")
  let headerIdx = -1;
  for(let i=0; i<rows.length; i++) {
    if(rows[i].some(c => String(c||"").includes("N.º de venda"))) { headerIdx=i; break; }
  }
  if(headerIdx === -1) { alert("Formato de planilha não reconhecido"); return; }

  const headers = rows[headerIdx];
  const colTotal = headers.findIndex(h => String(h||"").includes("Total (BRL)"));
  const colStatus = headers.findIndex(h => String(h||"") === "Estado");
  const colTitulo = headers.findIndex(h => String(h||"").includes("Título do anúncio"));
  const colData = headers.findIndex(h => String(h||"").includes("Data da venda"));
  const colCancel = headers.findIndex(h => String(h||"").includes("Cancelamentos e reembolsos"));

  const dataRows = rows.slice(headerIdx+1).filter(r => r[colTotal] !== undefined && r[colTotal] !== "");
  const negItems = dataRows
    .filter(r => Number(r[colTotal]) < 0)
    .map(r => ({
      titulo: String(r[colTitulo]||"—").slice(0,50),
      status: String(r[colStatus]||"—"),
      data: r[colData] ? String(r[colData]).slice(0,10) : "—",
      total: Number(r[colTotal]),
      cancel: Number(r[colCancel]||0),
    }))
    .sort((a,b) => a.total - b.total);

  const totalNeg = negItems.reduce((s,i) => s + i.total, 0);

  diogoCustoData = {
    fileName: file.name,
    negCount: negItems.length,
    totalNeg: Math.round(totalNeg*100)/100,
    negItems,
  };
  render();
}

function buildContext(memberName) {
  const tasks = tasksFor(memberName);
  const active = tasks.filter(t=>!t.done);
  const done = tasks.filter(t=>t.done);
  let ctx = `Membro: ${memberName}
`;
  ctx += `Tarefas ativas (${active.length}): ${active.map(t=>`"${t.text}" [${t.prio}]`).join(", ") || "nenhuma"}
`;
  ctx += `Tarefas concluídas hoje (${done.length}): ${done.map(t=>`"${t.text}"`).join(", ") || "nenhuma"}
`;

  if(memberName === "Diogo") {
    if(diogoDevolucoes?.data) {
      ctx += `
Devoluções do mês: ${diogoDevolucoes.count} devoluções, custo total R$ ${diogoDevolucoes.totalCost?.toFixed(2)}
`;
      const urgent = diogoDevolucoes.data.filter(d=>d.refundedAmount>0).length;
      ctx += `Com custo: ${urgent}
`;
    }
    if(mlReclamacoes?.data) {
      const aguarda = mlReclamacoes.data.filter(d=>d.stage==="waiting_seller"||d.returnStatusKey==="waiting");
      ctx += `
Reclamações abertas: ${mlReclamacoes.data.length} total, ${aguarda.length} aguardando você
`;
    }
    if(mlCanceladas?.data) {
      ctx += `Cancelamentos abertos: ${mlCanceladas.data.length}
`;
    }
    if(estoqueExcelData?.rows?.length) {
      const rows = estoqueExcelData.rows;
      let totalValor=0, totalAptas=0, semCusto=0;
      const enriched = rows.map(r=>{
        const custo = estoqueBlingData ? (estoqueBlingData[normSku(r.sku)]||0) : 0;
        const valor = custo * r.aptas;
        if(!custo) semCusto++;
        totalValor += valor; totalAptas += r.aptas;
        const vendas30 = r.vendas30||0;
        const dias = vendas30>0 ? Math.round(r.aptas/(vendas30/30)) : 999;
        return {...r, custo, valor, dias};
      });
      ctx += `
ESTOQUE Filial SP (ML Full): ${rows.length} SKUs, valor total R$ ${totalValor.toFixed(2)}, ${totalAptas} unidades aptas, ${semCusto} SKUs sem custo cadastrado no Bling
`;
      const parados = enriched.filter(r=>r.dias>=999 && r.aptas>0).slice(0,10);
      if(parados.length) ctx += `Sem venda nos últimos 30 dias (${parados.length}): ${parados.map(r=>r.sku).join(", ")}
`;
      const acabando = enriched.filter(r=>r.dias<=15 && r.aptas>0).sort((a,b)=>a.dias-b.dias).slice(0,10);
      if(acabando.length) ctx += `Estoque acabando rápido (<=15 dias de giro): ${acabando.map(r=>`${r.sku} (${r.dias}d)`).join(", ")}
`;
    } else {
      ctx += `
ESTOQUE Filial SP: nenhuma planilha importada ainda na aba Estoque.
`;
    }
    if(matrizRows?.length) {
      const totalValorM = matrizRows.reduce((s,r)=>s+r.valor,0);
      const totalQtyM = matrizRows.reduce((s,r)=>s+r.qty,0);
      ctx += `ESTOQUE Matriz RS: ${matrizRows.length} SKUs, valor total R$ ${totalValorM.toFixed(2)}, ${totalQtyM} unidades
`;
    }
  }
  if(memberName === "Larissa") {
    if(mlDevolucoes?.data) {
      const pendentes = mlDevolucoes.data.filter(d=>d.needsReview);
      ctx += `
Devoluções pendentes de revisão: ${pendentes.length}
`;
      pendentes.forEach(d=>{ ctx += `- ${d.product} (${d.buyer})${d.dueDate?`, prazo: ${new Date(d.dueDate).toLocaleDateString("pt-BR")}`:""})
`; });
    }
    if(mlReclamacoes?.data) {
      ctx += `
Reclamações abertas: ${mlReclamacoes.data.length}
`;
    }
  }
  return ctx;
}

function formatChatMsg(text) {
  const lines = text.split("\n");
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.trim() === "") {
      if (out.length > 0) out.push('<div style="height:16px;"></div>');
      continue;
    }
    if (/^---+$/.test(line.trim())) {
      out.push('<hr style="border:none;border-top:1px solid var(--border);margin:14px 0;">');
      continue;
    }
    const hMatch = line.match(/^#{1,3} (.+)$/);
    if (hMatch) {
      out.push('<div style="font-weight:500;color:var(--text);margin:14px 0 6px;">' + hMatch[1] + '</div>');
      continue;
    }
    const liMatch = line.match(/^[-•] (.+)$/);
    if (liMatch) {
      out.push('<div style="padding:4px 0 4px 12px;border-left:2px solid var(--border);margin:6px 0;color:var(--text2);">' + liMatch[1] + '</div>');
      continue;
    }
    const numMatch = line.match(/^(\d+)\.\s+(.+)$/);
    if (numMatch) {
      out.push('<div style="padding:4px 0 4px 12px;border-left:2px solid var(--border);margin:6px 0;color:var(--text2);"><strong style="color:var(--text);">' + numMatch[1] + '.</strong> ' + numMatch[2] + '</div>');
      continue;
    }
    let l = line
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`([^`]+)`/g, '<code style="background:var(--bg2);padding:1px 5px;border-radius:3px;font-size:11px;font-family:monospace;">$1</code>');
    out.push('<div style="line-height:1.75;">' + l + '</div>');
  }
  return out.join("");
}

  header.innerHTML = `<div style="display:flex;align-items:center;gap:8px;"><span style="color:${color};font-size:14px;">✦</span><span style="font-size:11px;letter-spacing:2px;color:${color};">ASSISTENTE · ${memberName.toUpperCase()}</span></div>`;
  const closeBtn = document.createElement("button");
  closeBtn.textContent = "✕";
  closeBtn.style.cssText = "background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;";
  closeBtn.addEventListener("click", () => { cs.open=false; renderChatModal(memberName,color); });
  header.appendChild(closeBtn);
  modal.appendChild(header);

  // Messages
  const msgs = document.createElement("div");
  msgs.className = "chat-messages";
  msgs.id = `chat-msgs-${memberName}`;

  if(cs.messages.length === 0) {
    const welcome = document.createElement("div");
    welcome.className = "chat-bubble assistant";
    welcome.textContent = `Olá${memberName==="Diogo"?", Diogo":memberName==="Larissa"?", Lari":""} 👋 Como posso ajudar?`;
    msgs.appendChild(welcome);
  }

  cs.messages.forEach(msg => {
    const bubble = document.createElement("div");
    bubble.className = `chat-bubble ${msg.role}`;
    if(msg.role === "user") {
      bubble.style.cssText = `background:${color}22;color:${color};border:1px solid ${color}44;align-self:flex-end;`;
    }
    bubble.innerHTML = formatChatMsg(msg.content);
    msgs.appendChild(bubble);
  });

  if(cs.loading) {
    const typing = document.createElement("div");
    typing.className = "chat-typing";
    typing.innerHTML = '<span class="spinning">↻</span> Digitando...';
    msgs.appendChild(typing);
  }

  modal.appendChild(msgs);
  setTimeout(() => { msgs.scrollTop = msgs.scrollHeight; }, 50);

  // Input
  const inputRow = document.createElement("div");
  inputRow.className = "chat-input-row";
  const input = document.createElement("textarea");
  input.className = "chat-input";
  input.placeholder = "Mensagem...";
  input.rows = 1;
  input.style.maxHeight = "80px";
  input.addEventListener("input", () => { input.style.height="auto"; input.style.height=input.scrollHeight+"px"; });
  const sendBtn = document.createElement("button");
  sendBtn.className = "chat-send";
  sendBtn.style.cssText = `background:${color};color:#000;`;
  sendBtn.textContent = "↑";
  sendBtn.disabled = cs.loading;

  const doSend = async () => {
    const text = input.value.trim();
    if(!text || cs.loading) return;
    input.value = ""; input.style.height="auto";
    cs.messages.push({ role:"user", content:text });
    cs.loading = true;
    renderChatModal(memberName, color);

    try {
      const r = await fetch(`${VERCEL_BACKEND}/api/claude-chat`, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          member: memberName,
          message: text,
          history: cs.messages.slice(-10),
          context: buildContext(memberName),
        }),
      });
      let data;
      try { data = await r.json(); } catch { data = null; }
      if(!r.ok) {
        cs.messages.push({ role:"assistant", content: data?.error || `Erro ${r.status} no servidor. Tente uma pergunta mais curta ou tente de novo em instantes.` });
      } else {
        cs.messages.push({ role:"assistant", content: data?.reply || data?.error || "Erro" });
        if(Array.isArray(data?.actions)){
          data.actions.forEach(action=>{
            try{
              if(action.type==="criar_tarefa"){
                const {member:taskMember,text:taskText,prio:taskPrio}=action.input||{};
                if(taskMember&&taskText&&taskPrio){
                  const norm=s=>String(s||"").trim().toLowerCase();
                  const jaExiste=Object.values(state.tasks||{}).some(t=>t!=null&&!t.done&&t.member===taskMember&&norm(t.text)===norm(taskText));
                  if(jaExiste){
                    cs.messages.push({ role:"assistant", content:`Já existe uma tarefa igual ("${taskText}") pendente pra ${taskMember} — não criei de novo pra não duplicar.` });
                  }else{
                    addTask(taskMember,taskText,taskPrio,memberName);
                    cs.messages.push({ role:"assistant", content:`✓ Tarefa criada para ${taskMember}: "${taskText}" [${PRIO[taskPrio]?.label||taskPrio}]` });
                  }
                }
              }else if(action.type==="criar_tarefa_recorrente"){
                const {member:taskMember,text:taskText,prio:taskPrio,frequency,dayOfWeek,dayOfMonth}=action.input||{};
                if(taskMember&&taskText&&taskPrio&&frequency){
                  const norm=s=>String(s||"").trim().toLowerCase();
                  const jaExiste=Object.values(state.recorrentes||{}).some(r=>r!=null&&r.active&&r.member===taskMember&&norm(r.text)===norm(taskText));
                  if(jaExiste){
                    cs.messages.push({ role:"assistant", content:`Já existe uma tarefa recorrente igual ("${taskText}") ativa pra ${taskMember} — não criei de novo pra não duplicar.` });
                  }else{
                    push(ref(db,"/recorrentes"),{
                      member:taskMember,text:taskText,prio:taskPrio,frequency,
                      dayOfWeek:frequency==="weekly"?(dayOfWeek??null):null,
                      dayOfMonth:frequency==="monthly"?(dayOfMonth??null):null,
                      active:true,createdBy:memberName,createdAt:Date.now(),
                    });
                    const freqLabel={daily:"todo dia",weekly:"toda semana",monthly:"todo mês"}[frequency]||frequency;
                    cs.messages.push({ role:"assistant", content:`✓ Tarefa recorrente criada para ${taskMember}: "${taskText}" [${PRIO[taskPrio]?.label||taskPrio}] — ${freqLabel}` });
                  }
                }
              }
            }catch(err){console.error("Erro ao executar ação do Claude:",err);cs.messages.push({ role:"assistant", content:"Não consegui confirmar se a ação foi salva. Confere na lista de tarefas." });}
          });
        }
      }
    } catch(e) {
      cs.messages.push({ role:"assistant", content:"Erro de conexão. Tente novamente." });
    }
    cs.loading = false;
    renderChatModal(memberName, color);
  };

  sendBtn.addEventListener("click", doSend);
  input.addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey) { e.preventDefault(); doSend(); } });
  inputRow.appendChild(input); inputRow.appendChild(sendBtn);
  modal.appendChild(inputRow);
  setTimeout(()=>input.focus(), 100);
}

async function processarExcelEstoque(file) {
  const arrayBuffer = await file.arrayBuffer();
  const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
  const wb = XLSX.read(arrayBuffer, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });

  // SheetJS ignora col A vazia → índices deslocados -1
  // idx 2=SKU, idx 5=Produto, idx 17=Aptas, idx 15=Transf, idx 14=Pendente

  // Encontra primeira linha com SKU real em idx 2
  let startIdx = 0;
  for (let i = 0; i < raw.length; i++) {
    const v = String(raw[i][2] || "").trim();
    if (v && /[A-Za-z]/.test(v) && !["SKU","Código ML","Status","Boa","Total","Produto"].includes(v)) {
      startIdx = i;
      break;
    }
  }

  const dados = [];
  let lastSku = "";
  for (let i = startIdx; i < raw.length; i++) {
    const row   = raw[i];
    const sku     = String(row[2] || "").trim();
    const produto = String(row[5] || "").trim();

    // SKU vazio mas produto preenchido = célula mesclada no Excel
    // usa SKU da linha anterior ou gera um a partir do produto
    const skuReal = sku || lastSku + "_v2";
    if (sku) lastSku = sku;

    if (!produto) continue;

    const aptas    = Number(row[17]) || 0;
    const transf   = Number(row[15]) || 0;
    const pendente = Number(row[14]) || 0;

    // Só inclui se tem produto válido
    if (!skuReal) continue;

    // Agrega linhas com mesmo SKU (células mescladas aparecem em linhas separadas)
    const existing = dados.find(d => d.sku === skuReal);
    if (existing) {
      existing.aptas    += aptas;
      existing.transf   += transf;
      existing.pendente += pendente;
      existing.vendas30 = (existing.vendas30||0) + (Number(row[10])||0);
    } else {
      const vendas30 = Number(row[10]) || 0;
      dados.push({ sku: skuReal, produto, aptas, transf, pendente, vendas30 });
    }
  }

  estoqueExcelData = { fileName: file.name, rows: dados };
  if (!estoqueBlingData && !estoqueBlingLoading) await fetchBlingProdutos();
  render();
}

async function processarRelatorioMatriz(file) {
  const arrayBuffer = await file.arrayBuffer();
  const XLSX = await import("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm");
  const wb = XLSX.read(arrayBuffer, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
  const dados = [];
  for (let i = 1; i < raw.length; i++) {
    const row = raw[i];
    const sku = String(row[0] || "").trim();
    const produto = String(row[1] || "").trim();
    if (!produto || produto.toLowerCase().includes("totai")) continue;
    const parseNum = v => parseFloat(String(v||"0").replace(/\./g,"").replace(",",".")) || 0;
    const qty = Math.round(parseNum(row[3]));
    const custo = parseNum(row[4]);
    const valor = parseNum(row[5]);
    if (qty <= 0) continue; // só produtos com estoque positivo
    dados.push({ sku: sku || "—", produto, qty, custo, valor });
  }
  return dados;
}

let cancelamentosData = null;     // null = não carregado ainda, [] = carregado vazio
let cancelamentosLoading = false;
let cancelamentosErro = null;

async function fetchCancelamentos(forcar) {
  if (cancelamentosLoading) return;
  if (cancelamentosData !== null && !forcar) return;
  cancelamentosLoading = true; cancelamentosErro = null;
  try {
    const r = await fetch(`${VERCEL_BACKEND}/api/ml-canceladas`);
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || "falha ao buscar cancelamentos");
    cancelamentosData = d.itens || [];
  } catch (e) {
    cancelamentosErro = e.message;
    cancelamentosData = [];
    console.error("Erro ao buscar cancelamentos:", e.message);
  }
  cancelamentosLoading = false;
  // Atualiza só o painel de cancelamentos diretamente, sem re-renderizar o card todo
  const painelAlvo = document.getElementById("cancelamentos-panel");
  if (painelAlvo) {
    painelAlvo.innerHTML = "";
    renderCancelamentos(painelAlvo);
  }
}

function renderCancelamentos(panel) {
  if (cancelamentosLoading || cancelamentosData === null) {
    const l = document.createElement("div");
    l.style.cssText = "text-align:center;padding:30px 0;font-size:12px;color:var(--text3);";
    l.innerHTML = '<span class="spinning">↻</span> Buscando cancelamentos no ML...';
    panel.appendChild(l); return;
  }

  const topRow = document.createElement("div");
  topRow.style.cssText = "display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;";
  const refreshBtn = document.createElement("button");
  refreshBtn.textContent = "↻ Atualizar";
  refreshBtn.style.cssText = "background:none;border:1px solid var(--border2);color:var(--text3);border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;";
  refreshBtn.addEventListener("click", () => {
    cancelamentosData = null; // reseta pra forçar nova busca
    const p = document.getElementById("cancelamentos-panel");
    if(p){ p.innerHTML=""; renderCancelamentos(p); }
    fetchCancelamentos(true);
  });
  topRow.appendChild(refreshBtn);
  panel.appendChild(topRow);

  if (cancelamentosErro) {
    const err = document.createElement("div");
    err.style.cssText = "padding:10px;background:#e91e8c10;border:1px solid #e91e8c33;border-radius:5px;font-size:11px;color:#e91e8c;margin-bottom:12px;";
    err.textContent = `Erro: ${cancelamentosErro}`;
    panel.appendChild(err);
    return;
  }

  if (!cancelamentosData || cancelamentosData.length === 0) {
    const vazio = document.createElement("div");
    vazio.style.cssText = "text-align:center;padding:30px 0;font-size:12px;color:var(--text3);";
    vazio.textContent = cancelamentosData ? "Nenhum cancelamento encontrado no período." : "Clique em Atualizar para carregar.";
    panel.appendChild(vazio); return;
  }

  // 4 status — definição de cor, ícone e texto do badge
  const statusDefs = {
    nf_pendente:        { cor: "#e91e8c", texto: "Cancelar NF",          icone: "⚠" },
    devolucao_pendente: { cor: "#f0b400", texto: "Devolução — processar", icone: "↩" },
    nf_cancelada:       { cor: "#00dfc3", texto: "NF cancelada",          icone: "✓" },
  };

  // Ordena: cancelar NF direto primeiro, depois devolução pendente, depois já ok
  const ordemStatus = { nf_pendente: 0, devolucao_pendente: 1, nf_cancelada: 2 };
  const filtrados = cancelamentosData.filter(it => it.status !== "sem_nf").sort((a, b) => {
    const ds = (ordemStatus[a.status] ?? 9) - (ordemStatus[b.status] ?? 9);
    if (ds !== 0) return ds;
    return new Date(b.dataCancelamento || 0) - new Date(a.dataCancelamento || 0);
  });

  if (filtrados.length === 0) {
    const vazio = document.createElement("div");
    vazio.style.cssText = "padding:10px 0;font-size:12px;color:var(--text3);";
    vazio.textContent = "Nenhum item nessa categoria.";
    panel.appendChild(vazio); return;
  }

  function badgeSituacao(situacao) {
    const s = String(situacao||"").toLowerCase();
    if(/cancelad/.test(s)) return { bg:"#33333380", cor:"#888", borda:"#44444480" };
    if(/autoriz/.test(s))  return { bg:"#00dfc318", cor:"#00dfc3", borda:"#00dfc333" };
    return { bg:"#f0b40018", cor:"#f0b400", borda:"#f0b40033" };
  }

  function copiavel(texto, exibir) {
    const span = document.createElement("span");
    span.textContent = exibir || texto;
    span.style.cssText = "cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-color:${T.text2};color:var(--text2);";
    span.title = "Clique pra copiar";
    span.addEventListener("click", e => {
      e.stopPropagation();
      navigator.clipboard.writeText(texto).catch(()=>{});
      const orig = span.style.color;
      span.style.color = "#00dfc3";
      setTimeout(()=>span.style.color=orig, 800);
    });
    return span;
  }

  filtrados.forEach(it => {
    const card = document.createElement("div");
    const sd = statusDefs[it.status] || { cor: "#888", texto: it.status || "—", icone: "?" };
    const borderColor = sd.cor === "var(--text3)" ? "var(--border)" : sd.cor;
    card.style.cssText = `background:var(--bg3);border:1px solid ${borderColor}33;border-left:3px solid ${borderColor};border-radius:6px;padding:10px 12px;margin-bottom:8px;${it.status==="nf_cancelada"?"opacity:0.55;":""}`;

    const dataStr = it.dataCancelamento ? new Date(it.dataCancelamento).toLocaleDateString("pt-BR") : "—";
    const valorStr = `R$ ${Number(it.valor).toLocaleString("pt-BR", {minimumFractionDigits:2})}`;

    // Linha 1: produto + badge de status
    const linha1 = document.createElement("div");
    linha1.style.cssText = "display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;";
    const prodInfo = document.createElement("div");
    prodInfo.style.cssText = "flex:1;min-width:0;";
    const prodNome = document.createElement("div");
    prodNome.style.cssText = "font-size:11px;font-weight:600;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;";
    prodNome.textContent = it.produto;
    const compradorRow = document.createElement("div");
    compradorRow.style.cssText = "display:flex;gap:8px;align-items:center;font-size:11px;color:var(--text3);flex-wrap:wrap;";
    compradorRow.appendChild(copiavel(it.comprador, `👤 ${it.comprador}`));
    const dataValor = document.createElement("span");
    dataValor.textContent = `${dataStr} · ${valorStr}`;
    compradorRow.appendChild(dataValor);
    prodInfo.appendChild(prodNome); prodInfo.appendChild(compradorRow);
    const badgeAlerta = document.createElement("span");
    badgeAlerta.style.cssText = `background:${sd.cor}18;color:${sd.cor};border:1px solid ${sd.cor}55;border-radius:4px;padding:2px 8px;font-size:11px;white-space:nowrap;flex-shrink:0;letter-spacing:0.02em;font-weight:500;`;
    badgeAlerta.textContent = `${sd.icone} ${sd.texto}`;
    linha1.appendChild(prodInfo); linha1.appendChild(badgeAlerta);
    card.appendChild(linha1);

    // Linha 2: pedido, NF e badge de situação da nota
    const linha2 = document.createElement("div");
    linha2.style.cssText = "display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;font-size:11px;color:var(--text3);";
    const pedidoLabel = document.createElement("span");
    pedidoLabel.textContent = "Pedido ML ";
    pedidoLabel.appendChild(copiavel(it.numeroPedido));
    linha2.appendChild(pedidoLabel);
    if(it.nf){
      const sep = document.createElement("span"); sep.style.color="var(--border2)"; sep.textContent="·";
      const nfLabel = document.createElement("span"); nfLabel.textContent = "NF ";
      nfLabel.appendChild(copiavel(it.nf.nfNumero));

      badgeNF.style.cssText = `background:${bs.bg};color:${bs.cor};border:1px solid ${bs.borda};border-radius:3px;padding:1px 6px;font-size:11px;`;
      badgeNF.textContent = it.nf.nfSituacao;
      linha2.appendChild(sep); linha2.appendChild(nfLabel); linha2.appendChild(badgeNF);
    }
    card.appendChild(linha2);

    if (it.status !== "nf_cancelada") {
      const delegarRow = document.createElement("div");
      delegarRow.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;";
      const textoTarefa = it.status === "devolucao_pendente"
        ? `↩ Processar devolução no Bling — NF ${it.nf?.nfNumero || "s/n"} — Pedido ML ${it.numeroPedido} (${it.produto}, ${valorStr})`
        : `Cancelar NF ${it.nf?.nfNumero || "s/n"} — Pedido ML ${it.numeroPedido} (${it.produto}, ${valorStr})`;
      ["Bruno","Larissa"].forEach(membro => {
        const cor = themeColor(membro);
        const btn = document.createElement("button");
        btn.textContent = `→ ${membro}`;
        btn.title = `Delegar para ${membro}`;
        btn.style.cssText = `background:none;border:1px solid ${cor}44;color:${cor};border-radius:4px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:inherit;`;
        btn.addEventListener("click", () => {

            member: membro, text: textoTarefa, prio: "urgente",

          set(ref(db, `/flashes/${membro}`), { ts: Date.now(), msg: "Nova tarefa de Diogo!" });
          btn.textContent = "✓";
          btn.disabled = true;
        });
        delegarRow.appendChild(btn);

      card.appendChild(delegarRow);
    }

    panel.appendChild(card);
  });
}

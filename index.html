function renderCpFormulario(card, mainPanel, overlay) {
  // Upload PDF
  const uploadArea = document.createElement("div");
  uploadArea.style.cssText = `display:flex;align-items:center;gap:8px;padding:10px 12px;background:${T.bg3};border:0.5px dashed ${T.border};border-radius:10px;cursor:pointer;margin-bottom:18px;transition:border-color .15s;`;
  uploadArea.innerHTML = `<span style="font-size:18px;">📄</span><div><div style="font-size:12px;font-weight:500;color:${T.text};">Upload de NF</div><div style="font-size:11px;color:${T.text3};">PDF preenchido automaticamente com IA</div></div>`;
  const fileInput = document.createElement("input");
  fileInput.type = "file"; fileInput.accept = ".pdf"; fileInput.style.display = "none";
  fileInput.addEventListener("change", async (e) => {
    const file = e.target.files[0]; if (!file) return;
    uploadArea.innerHTML = `<span style="font-size:14px;">↻</span><span style="font-size:12px;color:#2dce89;">Extraindo dados com IA...</span>`;
    const base64 = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.readAsDataURL(file); });
    try {
      const resp = await fetch(`${BLING_PROXY}/api/bling-produtos?action=extrair-nf-cp`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({pdfBase64:base64}) });
      const aiData = await resp.json();
      if (!aiData.ok) throw new Error(aiData.erro);
      preencherCampos(aiData.dados);
      cpState._nfBase64 = base64; cpState._nfNome = file.name;
      uploadArea.innerHTML = `<span style="font-size:14px;">✓</span><span style="font-size:12px;color:#2dce89;">${file.name}</span>`;
    } catch(e) {
      uploadArea.innerHTML = `<span style="font-size:14px;">⚠</span><span style="font-size:12px;color:#ff3d3d;">Erro na extração — preencha manualmente</span>`;
    }
  });
  uploadArea.addEventListener("click", () => fileInput.click());
  uploadArea.appendChild(fileInput);
  card.appendChild(uploadArea);

  // Grid de campos
  const campos = {};
  const campo = (label, key, tipo, ph) => {
    const wrap = document.createElement("div"); wrap.style.cssText = "margin-bottom:12px;";
    const lbl = document.createElement("div"); lbl.style.cssText = `font-size:10px;font-weight:600;color:${T.text3};margin-bottom:4px;letter-spacing:.4px;`; lbl.textContent = label;
    const inp = document.createElement("input");
    inp.type = tipo==="number"?"number":"text"; inp.placeholder = ph||"";
    inp.style.cssText = `width:100%;padding:8px 10px;background:${T.bg};border:0.5px solid ${T.border};border-radius:8px;color:${T.text};font-size:13px;font-family:'Inter',sans-serif;box-sizing:border-box;outline:none;`;
    campos[key] = inp;
    wrap.appendChild(lbl); wrap.appendChild(inp); return wrap;
  };

  // Layout 2 colunas
  const grid2 = (a, b) => { const d=document.createElement("div"); d.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:12px;"; d.appendChild(a); d.appendChild(b); return d; };

  card.appendChild(campo("FORNECEDOR","fornecedor","text","Nome do fornecedor"));
  card.appendChild(grid2(campo("CNPJ","cnpj","text","00.000.000/0001-00"), campo("Nº DOCUMENTO","numeroDoc","text","Ex: 3742")));
  // Valor
  card.appendChild(campo("VALOR (R$)","valor","number","0,00"));

  // Competência + Vencimento
  const gridComp = document.createElement("div"); gridComp.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;";
  (() => {
    // Competência (mês/ano)
    const wc=document.createElement("div");
    const lc=document.createElement("div"); lc.style.cssText=`font-size:10px;font-weight:600;color:${T.text3};margin-bottom:4px;letter-spacing:.4px;`; lc.textContent="COMPETÊNCIA";
    const ic=document.createElement("input"); ic.type="month";
    ic.style.cssText=`width:100%;padding:8px 10px;background:${T.bg};border:0.5px solid ${T.border};border-radius:8px;color:${T.text};font-size:13px;font-family:'Inter',sans-serif;box-sizing:border-box;outline:none;`;
    campos["competencia"]=ic;
    wc.appendChild(lc); wc.appendChild(ic); gridComp.appendChild(wc);
    // Vencimento
    const wv=document.createElement("div");
    const lv=document.createElement("div"); lv.style.cssText=lc.style.cssText; lv.textContent="VENCIMENTO";
    const iv=document.createElement("input"); iv.type="date";
    iv.style.cssText=ic.style.cssText;
    campos["vencimento"]=iv; wv.appendChild(lv); wv.appendChild(iv); gridComp.appendChild(wv);
  })();
  card.appendChild(gridComp);

  // Checkbox "Usar data de competência como vencimento"
  const checkWrap = document.createElement("label");
  checkWrap.style.cssText = "display:flex;align-items:center;gap:8px;margin-top:-6px;margin-bottom:14px;cursor:pointer;user-select:none;";
  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.style.cssText = "width:14px;height:14px;accent-color:#2dce89;cursor:pointer;";
  checkbox.addEventListener("change", () => {
    if(checkbox.checked && campos.competencia.value) {
      const [y,m] = campos.competencia.value.split("-");
      const ultimoDia = new Date(parseInt(y), parseInt(m), 0).getDate();
      campos.vencimento.value = `${y}-${m}-${String(ultimoDia).padStart(2,"0")}`;
      campos.vencimento.disabled = true;
      campos.vencimento.style.opacity = "0.4";
    } else {
      campos.vencimento.disabled = false;
      campos.vencimento.style.opacity = "1";
      campos.vencimento.value = "";
    }
  });
  const checkLabel = document.createElement("span");
  checkLabel.style.cssText = `font-size:11px;color:${T.text3};`;
  checkLabel.textContent = "Usar data de competência como vencimento";
  checkWrap.appendChild(checkbox);
  checkWrap.appendChild(checkLabel);
  card.appendChild(checkWrap);

  // Categoria
  const wCat=document.createElement("div"); wCat.style.cssText="margin-bottom:12px;";
  const lCat=document.createElement("div"); lCat.style.cssText=`font-size:10px;font-weight:600;color:${T.text3};margin-bottom:4px;letter-spacing:.4px;`; lCat.textContent="CATEGORIA";
  const selCat=document.createElement("select");
  selCat.style.cssText=`width:100%;padding:8px 10px;background:${T.bg};border:0.5px solid ${T.border};border-radius:8px;color:${T.text};font-size:13px;font-family:'Inter',sans-serif;box-sizing:border-box;outline:none;`;
  selCat.innerHTML="<option value=''>— Selecionar —</option>";
  let grupoAtual="";
  CATEGORIAS_CP.forEach(c => {
    if(c.grupo!==grupoAtual){grupoAtual=c.grupo;const og=document.createElement("optgroup");og.label=c.grupo;selCat.appendChild(og);}
    const opt=document.createElement("option"); opt.value=c.id; opt.textContent=c.label; selCat.appendChild(opt);
  });
  campos["categoriaId"]=selCat; wCat.appendChild(lCat); wCat.appendChild(selCat); card.appendChild(wCat);

  card.appendChild(campo("HISTÓRICO / DISCRIMINAÇÃO","historico","text","Descrição do serviço ou produto"));

  // Badge IA
  const badge=document.createElement("div");
  badge.style.cssText="font-size:11px;color:#2dce89;margin-top:-8px;margin-bottom:12px;display:none;";
  card.appendChild(badge);

  // Badge Filial
  const filialBadge=document.createElement("div");
  filialBadge.style.cssText="display:none;align-items:center;gap:6px;margin-bottom:12px;";
  filialBadge.innerHTML=`<span style="background:#5e72e422;color:#5e72e4;border-radius:20px;padding:3px 12px;font-size:11px;font-weight:600;">🏢 Filial SP</span><span style="font-size:11px;color:${T.text3};">NF emitida pela filial de São Paulo</span>`;
  card.appendChild(filialBadge);

  const preencherCampos = (dados) => {
    if(dados.fornecedor) campos.fornecedor.value=dados.fornecedor;
    if(dados.cnpj) campos.cnpj.value=dados.cnpj;
    if(dados.valor) campos.valor.value=dados.valor;
    if(dados.competencia) campos.competencia.value=dados.competencia;
    if(dados.dataVencimento) campos.vencimento.value=dados.dataVencimento;
    if(dados.discriminacao) campos.historico.value=dados.discriminacao;
    if(dados.numeroDoc) campos.numeroDoc.value=dados.numeroDoc;
    if(dados.categoria_sugerida){
      const match=CATEGORIAS_CP.find(c=>c.label.toLowerCase().includes(dados.categoria_sugerida.toLowerCase()));
      if(match){campos.categoriaId.value=match.id; badge.textContent=`✦ IA sugeriu: ${dados.categoria_sugerida}`; badge.style.display="block";}
    }
    const cnpjTomador = (dados.cnpjTomador||"").replace(/\D/g,"");
    if(cnpjTomador === CNPJ_FILIAL) {
      filialBadge.style.display = "flex";
      cpState._filial = true;
    } else {
      filialBadge.style.display = "none";
      cpState._filial = false;
    }
  };

  // Botão criar
  const btnCriar=document.createElement("button");
  btnCriar.textContent="Criar no Bling";
  btnCriar.style.cssText="width:100%;padding:12px;background:#2dce89;border:none;border-radius:10px;color:#000;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;margin-top:8px;";
  btnCriar.addEventListener("click", async () => {
    const valor=parseFloat(String(campos.valor.value).replace(",","."));
    const competencia=campos.competencia.value;
    const vencimento=campos.vencimento.value||null;
    if(!valor){alert("Preencha o valor.");return;}
    if(!competencia){alert("Preencha a competência.");return;}
    btnCriar.disabled=true; btnCriar.textContent="Salvando...";
    try {
      const competencia=campos.competencia.value || vencimento.slice(0,7);
      const mesPath=competencia.replace("-","/");
      const id="cp_"+Date.now();
      const catId=campos.categoriaId.value;
      const catLabel=CATEGORIAS_CP.find(c=>c.id==catId)?.label||"";
      const entrada={
        fornecedor:campos.fornecedor.value, cnpj:campos.cnpj.value.replace(/\D/g,""),
        numeroDoc:campos.numeroDoc.value, valor, vencimento, competencia,
        historico:campos.historico.value, categoriaId:catId, categoriaLabel:catLabel,
        situacao:"aberto", criadoEm:new Date().toISOString(),
        filial: cpState._filial === true,
      };
      if(cpState._nfBase64){entrada.nfBase64=cpState._nfBase64; entrada.nfNome=cpState._nfNome;}
      await set(ref(db,`/contas_pagar/${mesPath}/${id}`),entrada);
      try {
        const r=await fetch(`${BLING_PROXY}/api/bling-produtos?action=criar-conta-pagar`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fornecedor:campos.fornecedor.value,cnpj:campos.cnpj.value,valor,vencimento,historico:campos.historico.value,categoriaId:catId,numeroDoc:campos.numeroDoc.value,portador:PORTADOR_ITAU})});
        const d=await r.json();
        if(d.ok&&d.id) await set(ref(db,`/contas_pagar/${mesPath}/${id}/blingId`),d.id);
      }catch(e){}
      btnCriar.textContent="✓ Salvo!";
      cpState._nfBase64=null; cpState._nfNome=null; cpState.mes=competencia;
      if(overlay) overlay.remove();
      await carregarContasFirebase();
      renderContasPagar(mainPanel);
    }catch(e){
      btnCriar.style.background="#ff3d3d"; btnCriar.style.color="#fff";
      btnCriar.textContent=`Erro: ${e.message}`;
      setTimeout(()=>{btnCriar.disabled=false;btnCriar.textContent="Criar no Bling";btnCriar.style.background="#2dce89";btnCriar.style.color="#000";},3000);
    }
  });
  card.appendChild(btnCriar);
}

function preencherFormCP(card, dados) {
  // Remove form anterior se existir
  const formAnt = card.querySelector(".cp-form");
  if (formAnt) formAnt.remove();

  const form = document.createElement("div");
  form.className = "cp-form";

  const campo = (label, key, tipo="text", valor="") => {
    const wrap = document.createElement("div");
    wrap.style.cssText = "margin-bottom:12px;";
    const lbl = document.createElement("div");
    lbl.style.cssText = "font-size:10px;font-weight:600;color:#888;margin-bottom:4px;letter-spacing:.5px;";
    lbl.textContent = label;
    const inp = document.createElement(tipo === "select" ? "select" : "input");
    inp.dataset.key = key;
    inp.style.cssText = `width:100%;padding:8px 10px;background:${T.bg};border:1px solid #2a2a2a;border-radius:6px;color:${T.text};font-size:12px;font-family:'Inter',sans-serif;box-sizing:border-box;`;
    if (tipo !== "select") { inp.type = tipo === "number" ? "number" : "text"; inp.value = valor || dados[key] || ""; }
    wrap.appendChild(lbl);
    wrap.appendChild(inp);
    return { wrap, inp };
  };

  // Row 2 col
  const row2 = (a, b) => { const d = document.createElement("div"); d.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:10px;"; d.appendChild(a); d.appendChild(b); return d; };

  const { wrap: wForn, inp: inpForn } = campo("FORNECEDOR", "fornecedor");
  const { wrap: wCnpj, inp: inpCnpj } = campo("CNPJ", "cnpj");
  const { wrap: wNum, inp: inpNum } = campo("NÚMERO DOC", "numeroDoc");
  const { wrap: wData, inp: inpData } = campo("VENCIMENTO", "vencimento", "date", dados.dataEmissao || new Date().toISOString().split("T")[0]);
  const { wrap: wVal, inp: inpVal } = campo("VALOR (R$)", "valor", "number");
  const { wrap: wHist, inp: inpHist } = campo("HISTÓRICO / DISCRIMINAÇÃO", "historico");
  inpHist.value = dados.discriminacao || "";
  inpVal.value = dados.valor || "";
  inpVal.step = "0.01";

  // Categoria select
  const wCat = document.createElement("div"); wCat.style.cssText = "margin-bottom:12px;";
  const lCat = document.createElement("div"); lCat.style.cssText = "font-size:10px;font-weight:600;color:#888;margin-bottom:4px;letter-spacing:.5px;"; lCat.textContent = "CATEGORIA";
  const selCat = document.createElement("select");
  selCat.dataset.key = "categoriaId";
  selCat.style.cssText = `width:100%;padding:8px 10px;background:${T.bg};border:1px solid #2a2a2a;border-radius:6px;color:${T.text};font-size:12px;font-family:'Inter',sans-serif;`;
  selCat.innerHTML = `<option value="">— Selecionar —</option>`;
  let grupoAtual = "";
  CATEGORIAS_CP.forEach(c => {
    if (c.grupo !== grupoAtual) {
      grupoAtual = c.grupo;
      const og = document.createElement("optgroup"); og.label = c.grupo; selCat.appendChild(og);
    }
    const opt = document.createElement("option"); opt.value = c.id; opt.textContent = c.label;
    if (dados.categoria_sugerida && c.label.toLowerCase().includes(dados.categoria_sugerida.toLowerCase())) opt.selected = true;
    selCat.appendChild(opt);
  });
  wCat.appendChild(lCat); wCat.appendChild(selCat);

  form.appendChild(row2(wForn, wCnpj));
  form.appendChild(row2(wNum, wData));
  form.appendChild(row2(wVal, wCat));
  form.appendChild(wHist);

  // Badge categoria sugerida
  if (dados.categoria_sugerida) {
    const badge = document.createElement("div");
    badge.style.cssText = "font-size:10px;color:#2dce89;margin-top:-8px;margin-bottom:12px;";
    badge.textContent = `✦ IA sugeriu: ${dados.categoria_sugerida}`;
    form.appendChild(badge);
  }

  // Botão enviar
  const btnEnviar = document.createElement("button");
  btnEnviar.textContent = "Criar no Bling";
  btnEnviar.style.cssText = "width:100%;padding:12px;background:#2dce89;border:none;border-radius:6px;color:#000;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;margin-top:4px;";
  btnEnviar.addEventListener("click", async () => {
    const get = key => form.querySelector(`[data-key="${key}"]`)?.value?.trim();
    const valor = parseFloat(get("valor"));
    const vencimento = get("vencimento");
    if (!valor || !vencimento) { alert("Preencha valor e vencimento."); return; }
    btnEnviar.disabled = true; btnEnviar.textContent = "Enviando...";
    try {
      const r = await fetch(`${BLING_PROXY}/api/bling-produtos?action=criar-conta-pagar`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          fornecedor: get("fornecedor"),
          cnpj: get("cnpj"),
          valor, vencimento,
          historico: get("historico"),
          categoriaId: get("categoriaId"),
          numeroDoc: get("numeroDoc"),
          portador: PORTADOR_ITAU,
        })
      });
      const d = await r.json();
      if (!r.ok || !d.ok) throw new Error(d.erro || "Erro ao criar");
      btnEnviar.style.background = "#2dce89";
      btnEnviar.textContent = `✓ Criado no Bling (ID ${d.id})`;
      setTimeout(() => { btnEnviar.disabled = false; btnEnviar.textContent = "Criar no Bling"; btnEnviar.style.background = "#2dce89"; }, 3000);
    } catch(e) {
      btnEnviar.style.background = "#ff3d3d"; btnEnviar.style.color = "#fff";
      btnEnviar.textContent = `Erro: ${e.message}`;
      setTimeout(() => { btnEnviar.disabled = false; btnEnviar.textContent = "Criar no Bling"; btnEnviar.style.background = "#2dce89"; btnEnviar.style.color = "#000"; }, 3000);
    }
  });
  form.appendChild(btnEnviar);
  card.appendChild(form);
}

async function renderCpLista(panel) {
  if (!cpState.contas.length) {
    const vazio = document.createElement("div");
    vazio.style.cssText = `color:${T.text3};font-size:12px;padding:40px;text-align:center;`;
    vazio.textContent = "Nenhum lançamento neste mês.";
    panel.appendChild(vazio);
    return;
  }

  const tabWrap = document.createElement("div");
  tabWrap.style.cssText = `background:${T.card};border:0.5px solid ${T.border};border-radius:12px;overflow:hidden;`;

  const thead = document.createElement("div");
  thead.style.cssText = `display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr 120px;align-items:center;padding:8px 16px;border-bottom:0.5px solid ${T.border};background:${T.bg3};`;
  thead.innerHTML = `
    <div style="font-size:11px;font-weight:500;color:${T.text3};">PRESTADOR</div>

      : "";
    const row = document.createElement("div");
    row.style.cssText = `display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr 120px;align-items:center;padding:11px 16px;border-bottom:0.5px solid ${T.border};${i%2===1?"background:"+T.bg3+";":""}cursor:pointer;`;

      <div style="font-size:13px;color:${T.text};text-align:right;width:100%;font-family:'IBM Plex Mono',monospace;">R$ ${valor.toLocaleString("pt-BR",{minimumFractionDigits:2})}</div>
      <div style="font-size:12px;color:${T.text2};text-align:center;">${c.competencia ? c.competencia.slice(5,7)+"/"+c.competencia.slice(0,4) : "—"}</div>
      <div style="text-align:center;"><span style="font-size:11px;font-weight:600;padding:3px 12px;border-radius:20px;background:${sitCor};color:${sit==="pago"?"#000":"#000"};letter-spacing:.2px;">${sit}</span></div>`;

    // Clique expande preview com NF
    row.addEventListener("click", () => {

      let nfBtn = "";
      if (c.nfBase64) nfBtn = `<button onclick="(()=>{const b=atob('${c.nfBase64}');const bytes=new Uint8Array(b.length);for(let i=0;i<b.length;i++)bytes[i]=b.charCodeAt(i);const blob=new Blob([bytes],{type:'application/pdf'});window.open(URL.createObjectURL(blob),'_blank');})()" style="background:${T.bg3};border:0.5px solid ${T.border};border-radius:6px;padding:6px 14px;font-size:11px;font-weight:500;color:${T.text};cursor:pointer;font-family:'Inter',sans-serif;">📄 Ver NF</button>`;
      detail.innerHTML = `
        <div style="flex:1;font-size:12px;color:${T.text2};line-height:1.8;">

          <div><b style="color:${T.text};font-weight:500;">Nº Doc:</b> ${c.numeroDoc||"—"}</div>
          <div><b style="color:${T.text};font-weight:500;">Categoria:</b> ${c.categoriaLabel||"—"}</div>
          <div><b style="color:${T.text};font-weight:500;">Bling ID:</b> ${c.blingId||"não enviado"}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${nfBtn}
          <button data-sit="${c.id}" style="background:${sit==="pago"?"#f0b40018":"#2dce8918"};border:0.5px solid ${sit==="pago"?"#f0b40044":"#2dce8944"};border-radius:6px;padding:6px 14px;font-size:11px;font-weight:500;color:${sit==="pago"?"#f0b400":"#2dce89"};cursor:pointer;font-family:'Inter',sans-serif;">${sit==="pago"?"↩ Reabrir":"✓ Pago"}</button>
        </div>`;
      detail.querySelector("[data-sit]")?.addEventListener("click", async (e) => {
        e.stopPropagation();

        await set(ref(db, `/contas_pagar/${cpState.mes.replace("-","/")}/${c.id}/situacao`), novaSit);
        detail.remove();

  const tfootLeft = document.createElement("div");

  const tfootCenter = document.createElement("div");
  tfootCenter.style.cssText = "font-size:14px;font-weight:600;color:"+T.text+";font-family:'IBM Plex Mono',monospace;text-align:right;width:100%;";
  tfootCenter.textContent = "R$ "+total.toLocaleString("pt-BR",{minimumFractionDigits:2});

  const btnMarcarTodos = document.createElement("button");
  const naoPageis = cpState.contas.filter(c => c.situacao !== "pago" && c.situacao !== "cancelado");
  btnMarcarTodos.textContent = "✓ Marcar todos como pago";
  btnMarcarTodos.style.cssText = `background:none;border:0.5px solid ${T.border};border-radius:8px;padding:5px 12px;color:${T.text2};font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;justify-self:end;`;
  if (!naoPageis.length) {
    btnMarcarTodos.disabled = true;
    btnMarcarTodos.style.opacity = "0.4";
    btnMarcarTodos.style.cursor = "default";
  }
  btnMarcarTodos.addEventListener("click", async () => {
    if (!naoPageis.length) return;
    const confirma = confirm(`Marcar ${naoPageis.length} conta(s) como paga(s)?`);
    if (!confirma) return;
    btnMarcarTodos.disabled = true;
    btnMarcarTodos.textContent = "↻ Salvando...";
    const mesPath = cpState.mes.replace("-","/");
    try {
      await Promise.all(naoPageis.map(c =>
        set(ref(db, `/contas_pagar/${mesPath}/${c.id}/situacao`), "pago")
      ));
      await carregarContasFirebase();
      renderContasPagar(panel.closest(".cp-container") || panel.parentElement);
    } catch(e) {
      btnMarcarTodos.textContent = "Erro: "+e.message;
      setTimeout(() => { btnMarcarTodos.disabled=false; btnMarcarTodos.textContent="✓ Marcar todos como pago"; }, 3000);
    }
  });

  const tfootSpacer = document.createElement("div"); // col 4 — competência
  tfoot.appendChild(tfootLeft);
  tfoot.appendChild(tfootCenter);
  tfoot.appendChild(tfootSpacer);
  tfoot.appendChild(btnMarcarTodos);
  tabWrap.appendChild(tfoot);
  panel.appendChild(tabWrap);
}

async function carregarContasFirebase() {
  const mes = cpState.mes || new Date().toISOString().slice(0,7);
  const mesPath = mes.replace("-","/");
  const snap = await get(ref(db, `/contas_pagar/${mesPath}`));
  const dados = snap.val() || {};
  let contas = Object.entries(dados).map(([id, v]) => ({ id, ...v }));
  // Filtro situação
  if (cpState.filtroSituacao === "pendente") contas = contas.filter(c => c.situacao === "pendente" || c.situacao === "rascunho");
  if (cpState.filtroSituacao === "aberto") contas = contas.filter(c => c.situacao === "aberto");
  if (cpState.filtroSituacao === "pago") contas = contas.filter(c => c.situacao === "pago");
  if (cpState.filtroSituacao === "cancelado") contas = contas.filter(c => c.situacao === "cancelado");
  // Filtro empresa
  if (cpState.filtroEmpresa === "matriz") contas = contas.filter(c => {
    const cnpj = (c.tomadorCnpj || c.cnpj || "").replace(/\D/g,"");
    return !cnpj || cnpj === "40981026000182";
  });
  if (cpState.filtroEmpresa === "filial") contas = contas.filter(c => {
    const cnpj = (c.tomadorCnpj || c.cnpj || "").replace(/\D/g,"");
    return cnpj === "40981026000344";
  });
  // Ordena por vencimento
  contas.sort((a,b) => (a.vencimento||"").localeCompare(b.vencimento||""));
  cpState.contas = contas;
}

async function renderPainelFiscal(panel) {
  panel.innerHTML = "";
  panel.style.cssText = "padding:16px 20px;font-family:'Inter',sans-serif;";

  // Header
  const header = document.createElement("div");
  header.style.cssText = "display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;";
  header.innerHTML = `
    <div>
      <div style="font-size:16px;font-weight:600;color:${T.text};">Painel Fiscal</div>
      <div style="font-size:12px;color:${T.text3};margin-top:2px;">NFS-e · NF-e · CT-e dos últimos 3 meses</div>
    </div>`;
  const btnRef = document.createElement("button");
  btnRef.textContent = "↻ Atualizar";
  btnRef.style.cssText = `background:none;border:0.5px solid ${T.border};border-radius:8px;padding:6px 14px;font-size:12px;color:${T.text2};cursor:pointer;font-family:inherit;`;
  btnRef.addEventListener("click", () => { panel.querySelector(".pf-container") && renderPainelFiscal(panel); });
  header.appendChild(btnRef);
  panel.appendChild(header);

  // Calcula meses (últimos 3)
  const meses = [];
  const agora = new Date();
  for (let i = 0; i < 3; i++) {
    const d = new Date(agora.getFullYear(), agora.getMonth() - i, 1);
    meses.push(d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0"));
  }

  // Busca dados dos 3 tipos no Firebase
  const loading = document.createElement("div");
  loading.style.cssText = `color:${T.text3};font-size:12px;padding:40px;text-align:center;`;
  loading.textContent = "↻ Carregando dados fiscais...";
  panel.appendChild(loading);

  const [snapNfse, snapCte, snapNfe] = await Promise.all([
    get(ref(db, "/nfse_tomadas")),
    get(ref(db, "/cte_tomados")),
    get(ref(db, "/nfe_tomadas")),
  ]);

  loading.remove();

  const nfseData = snapNfse.val() || {};
  const cteData = snapCte.val() || {};
  const nfeData = snapNfe.val() || {};

  // Agrega totais
  let totalNfse = 0, valorNfse = 0;
  let totalCte = 0, valorCte = 0;
  let totalNfe = 0, valorNfe = 0;

  // Por mês para gráfico
  const porMes = {};

  const agregar = (dados, tipo) => {
    Object.entries(dados).forEach(([ano, mesesObj]) => {
      Object.entries(mesesObj || {}).forEach(([mes, notas]) => {
        const mesKey = ano + "/" + mes;
        if (!porMes[mesKey]) porMes[mesKey] = {nfse:0, cte:0, nfe:0, vNfse:0, vCte:0, vNfe:0};
        Object.values(notas || {}).forEach(n => {
          const v = Number(n.valorServicos || n.valorTotal || n.valor || 0);
          if (tipo === "nfse") { totalNfse++; valorNfse += v; porMes[mesKey].nfse++; porMes[mesKey].vNfse += v; }
          if (tipo === "cte")  { totalCte++;  valorCte  += v; porMes[mesKey].cte++;  porMes[mesKey].vCte  += v; }
          if (tipo === "nfe")  { totalNfe++;  valorNfe  += v; porMes[mesKey].nfe++;  porMes[mesKey].vNfe  += v; }
        });
      });
    });
  };

  agregar(nfseData, "nfse");
  agregar(cteData, "cte");
  agregar(nfeData, "nfe");

  const fmt = v => "R$ " + Number(v).toLocaleString("pt-BR", {minimumFractionDigits: 2});

  // Cards de totais
  const cardsWrap = document.createElement("div");
  cardsWrap.style.cssText = "display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;";

  [
    { label: "NFS-e Recebidas", icon: "📄", total: totalNfse, valor: valorNfse, cor: "#3B82F6" },
    { label: "CT-e Recebidos", icon: "🚛", total: totalCte, valor: valorCte, cor: "#f0b400" },
    { label: "NF-e Recebidas", icon: "📦", total: totalNfe, valor: valorNfe, cor: "#2dce89" },
  ].forEach(c => {
    const card = document.createElement("div");
    card.style.cssText = `background:${T.card};border:0.5px solid ${T.border};border-radius:12px;padding:16px;`;
    card.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
        <span style="font-size:18px;">${c.icon}</span>
        <span style="font-size:12px;font-weight:500;color:${T.text2};">${c.label}</span>
      </div>
      <div style="font-size:28px;font-weight:700;color:${c.cor};margin-bottom:4px;">${c.total.toLocaleString("pt-BR")}</div>
      <div style="font-size:12px;color:${T.text2};">${fmt(c.valor)}</div>`;
    cardsWrap.appendChild(card);
  });
  panel.appendChild(cardsWrap);

  // Card total geral
  const totalCard = document.createElement("div");
  totalCard.style.cssText = `background:${T.card};border:0.5px solid ${T.border};border-radius:12px;padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;`;
  totalCard.innerHTML = `
    <div>
      <div style="font-size:11px;color:${T.text3};margin-bottom:4px;">TOTAL DE DOCUMENTOS</div>
      <div style="font-size:22px;font-weight:700;color:${T.text};">${(totalNfse+totalCte+totalNfe).toLocaleString("pt-BR")}</div>
    </div>
    <div>
      <div style="font-size:11px;color:${T.text3};margin-bottom:4px;">VOLUME FINANCEIRO</div>
      <div style="font-size:22px;font-weight:700;color:${T.text};">${fmt(valorNfse+valorCte+valorNfe)}</div>
    </div>
    <div>
      <div style="font-size:11px;color:${T.text3};margin-bottom:4px;">PERÍODO</div>
      <div style="font-size:16px;font-weight:600;color:${T.text};">Últimos 3 meses</div>
    </div>`;
  panel.appendChild(totalCard);

  // Tabela por mês
  const tabelaWrap = document.createElement("div");
  tabelaWrap.style.cssText = `background:${T.card};border:0.5px solid ${T.border};border-radius:12px;overflow:hidden;`;

  const thead = document.createElement("div");
  thead.style.cssText = `display:grid;grid-template-columns:120px 1fr 1fr 1fr 1fr;padding:8px 16px;border-bottom:0.5px solid ${T.border};background:${T.bg3};`;
  thead.innerHTML = `
    <div style="font-size:11px;font-weight:500;color:${T.text3};">MÊS</div>
    <div style="font-size:11px;font-weight:500;color:#3B82F6;text-align:right;">NFS-e</div>
    <div style="font-size:11px;font-weight:500;color:#f0b400;text-align:right;">CT-e</div>
    <div style="font-size:11px;font-weight:500;color:#2dce89;text-align:right;">NF-e</div>
    <div style="font-size:11px;font-weight:500;color:${T.text3};text-align:right;">TOTAL</div>`;
  tabelaWrap.appendChild(thead);

  const nomesMes = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

  Object.entries(porMes).sort((a,b) => b[0].localeCompare(a[0])).forEach(([ mesKey, d], i) => {
    const [ano, mes] = mesKey.split("/");
    const label = nomesMes[parseInt(mes)-1] + " " + ano;
    const totalV = d.vNfse + d.vCte + d.vNfe;
    const row = document.createElement("div");
    row.style.cssText = `display:grid;grid-template-columns:120px 1fr 1fr 1fr 1fr;padding:11px 16px;border-bottom:0.5px solid ${T.border};${i%2===1?"background:"+T.bg3+";":""}`;
    row.innerHTML = `
      <div style="font-size:13px;font-weight:500;color:${T.text};">${label}</div>
      <div style="text-align:right;">
        <div style="font-size:12px;color:#3B82F6;font-weight:600;">${d.nfse}</div>
        <div style="font-size:10px;color:${T.text3};">${fmt(d.vNfse)}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:12px;color:#f0b400;font-weight:600;">${d.cte}</div>
        <div style="font-size:10px;color:${T.text3};">${fmt(d.vCte)}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:12px;color:#2dce89;font-weight:600;">${d.nfe}</div>
        <div style="font-size:10px;color:${T.text3};">${fmt(d.vNfe)}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:13px;font-weight:600;color:${T.text};">${fmt(totalV)}</div>
      </div>`;
    tabelaWrap.appendChild(row);
  });

  panel.appendChild(tabelaWrap);
}


async function renderNfsEmitidas(panel) {
  panel.innerHTML = "";
  panel.style.cssText = "padding:16px 20px;font-family:'Inter',sans-serif;";

  const header = document.createElement("div");
  header.style.cssText = "display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;";
  header.innerHTML = `
    <div>
      <div style="font-size:16px;font-weight:600;color:${T.text};">NFs Emitidas</div>
      <div style="font-size:12px;color:${T.text3};margin-top:2px;">Notas fiscais geradas pelo sistema</div>
    </div>`;
  const btnRefresh = document.createElement("button");
  btnRefresh.textContent = "↻ Atualizar";
  btnRefresh.style.cssText = `background:none;border:0.5px solid ${T.border};border-radius:8px;padding:6px 14px;font-size:12px;color:${T.text2};cursor:pointer;font-family:inherit;`;
  btnRefresh.addEventListener("click", () => renderNfsEmitidas(panel));
  header.appendChild(btnRefresh);
  panel.appendChild(header);

  const snap = await get(ref(db, "/nfes_processadas"));
  const dados = snap.val() || {};

  const nfs = Object.entries(dados).map(([chave, v]) => ({ chave, ...v }))
    .sort((a, b) => (b.processedAt || 0) - (a.processedAt || 0));

  if (!nfs.length) {
    const vazio = document.createElement("div");
    vazio.style.cssText = `color:${T.text3};font-size:12px;padding:60px;text-align:center;`;
    vazio.innerHTML = `<div style="font-size:32px;margin-bottom:12px;">📄</div><div>Nenhuma NF emitida ainda.</div>`;
    panel.appendChild(vazio);
    return;
  }

  const lista = document.createElement("div");
  lista.style.cssText = "display:flex;flex-direction:column;gap:8px;";

  nfs.forEach(nf => {
    const data = nf.processedAt ? new Date(nf.processedAt).toLocaleDateString("pt-BR") : "—";
    const hora = nf.processedAt ? new Date(nf.processedAt).toLocaleTimeString("pt-BR", {hour:"2-digit",minute:"2-digit"}) : "";
    const natureza = nf.natureza || "Transferência Full";
    const itens = Array.isArray(nf.itens) ? nf.itens.length : "—";
    const temComp = !!nf.nfComplementarNumero;
    const numero = nf.chave?.replace(/_/g, "/") || "—";

    const card = document.createElement("div");
    card.style.cssText = `background:${T.card};border:0.5px solid ${T.border};border-radius:6px;padding:5px 12px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s;`;
    card.addEventListener("mouseenter", () => card.style.borderColor = T.border2 || "#3a3a3a");
    card.addEventListener("mouseleave", () => card.style.borderColor = T.border);

    // Bloco número
    const numBloco = document.createElement("div");
    numBloco.style.cssText = `background:${T.bg3};border:0.5px solid ${T.border};border-radius:6px;padding:5px 10px;text-align:center;min-width:56px;flex-shrink:0;cursor:pointer;transition:border-color .15s;`;
    numBloco.title = "Clique para copiar";
    numBloco.innerHTML = `
      <div style="font-size:9px;font-weight:600;color:${T.text3};letter-spacing:.8px;margin-bottom:2px;">NF</div>
      <div style="font-size:16px;font-weight:700;color:#3B82F6;font-family:'Inter',sans-serif;">${numero}</div>`;
    numBloco.addEventListener("click", (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(numero);
      // Mostra toast de copiado sem esconder o número
      let toast = document.getElementById("nf-copy-toast");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "nf-copy-toast";
        toast.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2dce89;color:#000;font-size:12px;font-weight:600;padding:7px 18px;border-radius:20px;z-index:9999;font-family:'Inter',sans-serif;pointer-events:none;opacity:0;transition:opacity .15s;`;
        document.body.appendChild(toast);
      }
      toast.textContent = `NF ${numero} copiada`;
      toast.style.opacity = "1";
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { toast.style.opacity = "0"; }, 1500);
    });

    // Info central
    const info = document.createElement("div");
    info.style.cssText = "flex:1;min-width:0;";
    info.innerHTML = `
      <div style="font-size:13px;font-weight:500;color:${T.text};margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${natureza}</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:12px;color:${T.text2};">${data} · ${hora}</span>
        <span style="font-size:11px;color:${T.text3};">${itens} ${itens === 1 ? "item" : "itens"}</span>
      </div>`;

    // Direita
    const direita = document.createElement("div");
    direita.style.cssText = "display:flex;align-items:center;gap:10px;flex-shrink:0;";

    // Badge complementar
    if (temComp) {
      const badge = document.createElement("span");
      badge.style.cssText = "font-size:11px;font-weight:600;background:#2dce8918;color:#2dce89;border-radius:20px;padding:3px 12px;border:0.5px solid #2dce8944;white-space:nowrap;";
      badge.textContent = `✓ Complementar NF ${nf.nfComplementarNumero}`;
      direita.appendChild(badge);
    } else {
      const badge = document.createElement("span");
      badge.style.cssText = "font-size:11px;font-weight:500;background:#ff3d3d14;color:#e8432d;border-radius:20px;padding:3px 12px;border:0.5px solid #ff3d3d33;white-space:nowrap;";
      badge.textContent = "Sem complementar";
      direita.appendChild(badge);
    }

    // Botão copiar chave
    if (nf.chaveAcesso) {
      const btnCopy = document.createElement("button");
      btnCopy.textContent = "Copiar chave";
      btnCopy.style.cssText = `background:none;border:0.5px solid ${T.border};border-radius:6px;padding:4px 10px;font-size:11px;color:${T.text2};cursor:pointer;font-family:inherit;white-space:nowrap;`;
      btnCopy.addEventListener("click", (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(nf.chaveAcesso);
        btnCopy.textContent = "✓ Copiado";
        setTimeout(() => btnCopy.textContent = "Copiar chave", 1500);
      });
      direita.appendChild(btnCopy);
    }

    card.appendChild(numBloco);
    card.appendChild(info);
    card.appendChild(direita);

    // Expande itens ao clicar
    card.addEventListener("click", () => {
      const existing = card.nextElementSibling;
      if (existing?.classList.contains("nf-itens-detail")) { existing.remove(); return; }
      if (!Array.isArray(nf.itens) || !nf.itens.length) return;
      const detail = document.createElement("div");
      detail.className = "nf-itens-detail";
      detail.style.cssText = `background:${T.bg3};border:0.5px solid ${T.border};border-radius:8px;padding:12px 16px;`;
      detail.innerHTML = `
        <div style="font-size:11px;font-weight:500;color:${T.text3};margin-bottom:8px;">Itens</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${nf.itens.map(it => `<span style="background:${T.card};border:0.5px solid ${T.border};border-radius:6px;padding:3px 10px;font-size:11px;color:${T.text2};">${it.sku||it.codigo||it}${it.quantidade ? ` × ${it.quantidade}` : ""}</span>`).join("")}
        </div>
        ${nf.chaveAcesso ? `<div style="margin-top:10px;font-size:10px;color:${T.text3};font-family:'IBM Plex Mono',monospace;word-break:break-all;">${nf.chaveAcesso}</div>` : ""}`;
      card.insertAdjacentElement("afterend", detail);
    });

    lista.appendChild(card);
  });

  panel.appendChild(lista);

  const rodape = document.createElement("div");
  rodape.style.cssText = `font-size:12px;color:${T.text3};margin-top:10px;`;
  rodape.textContent = `${nfs.length} nota${nfs.length !== 1 ? "s" : ""} emitida${nfs.length !== 1 ? "s" : ""}`;
  panel.appendChild(rodape);
}


async function renderConferencia(panel, color) {
  panel.innerHTML = "";

  if(!confMes) confMes = mesAtual();

  // Título
  const titleRow = document.createElement("div");
  titleRow.style.cssText = "display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;";
  const titleEl = document.createElement("div");
  titleEl.style.cssText = "font-size:8px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;font-weight:500;";
  titleEl.textContent = "Conferência Financeira";

  // Seletor de mês
  const meses = [];
  const hoje = new Date();
  for(let i=0; i<12; i++) {
    const d = new Date(hoje.getFullYear(), hoje.getMonth()-i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    meses.push(key);
  }
  const selMes = document.createElement("select");
  selMes.style.cssText = "background:var(--bg3);border:0.5px solid var(--border2);border-radius:7px;color:var(--text3);font-size:11px;padding:6px 12px;cursor:pointer;font-family:inherit;outline:none;";
  meses.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m; opt.textContent = formatarMes(m);
    if(m === confMes) opt.selected = true;
    selMes.appendChild(opt);
  });
  selMes.addEventListener("change", () => {
    confMes = selMes.value;
    confFiltroTipo = null;
    confDocs = {servicos:[], impostos:[]};
    renderConferencia(panel, color);
  });

  titleRow.appendChild(titleEl); titleRow.appendChild(selMes);
  panel.appendChild(titleRow);

  // Carrega docs
  await carregarDocsDrive(confMes);

  // Filtra por tipo se necessário
  const servicosFiltrados = confFiltroTipo ? confDocs.servicos : confDocs.servicos;
  const impostosFiltrados = confFiltroTipo
    ? confDocs.impostos.filter(d => detectarTipoImposto(d.nome) === confFiltroTipo)
    : confDocs.impostos;

  // Totais
  const totalServicos = servicosFiltrados.reduce((s,d) => s+Number(d.valor||0), 0);
  const totalImpostos = impostosFiltrados.reduce((s,d) => s+Number(d.valor||0), 0);
  const totalGeral = totalServicos + totalImpostos;

  // Cards de resumo
  const summary = document.createElement("div");
  summary.style.cssText = "display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;";

  function sumCard(label, valor, cor, count) {
    const c = document.createElement("div");
    c.style.cssText = `background:${T.card};border:1px solid ${T.border};border-radius:12px;padding:16px;position:relative;overflow:hidden;`;
    const hat = document.createElement("div");
    hat.style.cssText = `position:absolute;top:0;left:0;right:0;height:3px;background:${cor};`;
    const lbl = document.createElement("div");
    lbl.style.cssText = "font-size:8px;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;margin-bottom:8px;font-weight:500;";
    lbl.textContent = label;
    const val = document.createElement("div");
    val.style.cssText = `font-size:18px;font-weight:700;color:${T.text};letter-spacing:-0.5px;font-family:'IBM Plex Mono',monospace;`;
    val.textContent = "R$ "+valor.toLocaleString("pt-BR",{minimumFractionDigits:2});
    const cnt = document.createElement("div");
    cnt.style.cssText = `display:inline-block;font-size:10px;font-weight:600;color:${T.text2};background:${T.bg3};border:1px solid ${T.border};border-radius:5px;padding:2px 8px;margin-top:8px;`;
    cnt.textContent = count;
    c.appendChild(hat); c.appendChild(lbl); c.appendChild(val); c.appendChild(cnt);
    return c;
  }

  summary.appendChild(sumCard("Total do mês", totalGeral, "#3b82f6", `${servicosFiltrados.length + impostosFiltrados.length} documentos`));
  summary.appendChild(sumCard("Serviços", totalServicos, "#8b5cf6", `${servicosFiltrados.length} notas`));
  summary.appendChild(sumCard("Impostos", totalImpostos, "#10b981", `${impostosFiltrados.length} guias`));
  panel.appendChild(summary);

  // Filtros dinâmicos de tipo de imposto
  const tiposExistentes = [...new Set(confDocs.impostos.map(d => detectarTipoImposto(d.nome)))];
  if(tiposExistentes.length > 0) {
    const filtrosWrap = document.createElement("div");
    filtrosWrap.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;";
    const btnTodos = document.createElement("button");
    btnTodos.textContent = "Todos";
    btnTodos.style.cssText = `background:${!confFiltroTipo?"var(--accent)":"none"};border:0.5px solid ${!confFiltroTipo?"var(--accent)":"var(--border2)"};border-radius:99px;color:${!confFiltroTipo?"#000":"var(--text3)"};font-size:11px;font-weight:${!confFiltroTipo?"700":"400"};letter-spacing:1px;padding:4px 12px;cursor:pointer;font-family:inherit;`;
    btnTodos.addEventListener("click", () => { confFiltroTipo = null; renderConferencia(panel, color); });
    filtrosWrap.appendChild(btnTodos);
    tiposExistentes.forEach(tipo => {
      const btn = document.createElement("button");
      btn.textContent = tipo;
      const ativo = confFiltroTipo === tipo;
      btn.style.cssText = `background:${ativo?T.text:"none"};border:0.5px solid ${ativo?T.text:T.border2};border-radius:99px;color:${ativo?T.bg:T.text3};font-size:11px;font-weight:${ativo?"700":"400"};letter-spacing:1px;padding:4px 12px;cursor:pointer;font-family:inherit;`;
      btn.addEventListener("click", () => { confFiltroTipo = tipo; renderConferencia(panel, color); });
      filtrosWrap.appendChild(btn);
    });
    panel.appendChild(filtrosWrap);
  }

  // Visualizador inline de PDF
  if(confVisualizando) {
    const viewer = document.createElement("div");
    viewer.style.cssText = "background:var(--bg3);border:0.5px solid var(--border2);border-radius:12px;overflow:hidden;margin-bottom:14px;";
    const vHeader = document.createElement("div");
    vHeader.style.cssText = "display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:0.5px solid var(--sep);";
    vHeader.innerHTML = `<span style="font-size:11px;color:var(--text2);">Visualizando documento</span>`;
    const vActions = document.createElement("div");
    vActions.style.cssText = "display:flex;gap:6px;";
    const btnAba = document.createElement("button");
    btnAba.textContent = "↗ Abrir em nova aba";
    btnAba.style.cssText = "background:none;border:0.5px solid var(--border2);border-radius:4px;color:var(--text3);font-size:11px;padding:3px 9px;cursor:pointer;font-family:inherit;";
    btnAba.addEventListener("click", () => window.open(confVisualizando, "_blank"));
    const btnFechar = document.createElement("button");
    btnFechar.textContent = "✕ Fechar";
    btnFechar.style.cssText = "background:none;border:0.5px solid var(--border2);border-radius:4px;color:var(--text3);font-size:11px;padding:3px 9px;cursor:pointer;font-family:inherit;";
    btnFechar.addEventListener("click", () => { confVisualizando = null; renderConferencia(panel, color); });
    vActions.appendChild(btnAba); vActions.appendChild(btnFechar);
    vHeader.appendChild(vActions);
    const iframe = document.createElement("iframe");
    iframe.src = confVisualizando;
    iframe.style.cssText = "width:100%;height:500px;border:none;background:#fff;";
    viewer.appendChild(vHeader); viewer.appendChild(iframe);
    panel.appendChild(viewer);
  }

  // Função pra renderizar uma seção (Serviços ou Impostos)
  function renderSecao(titulo, docs, cor, pill, categoria) {
    const sec = document.createElement("div");
    sec.style.cssText = `border-radius:14px;overflow:hidden;border:0.5px solid var(--border2);margin-bottom:12px;`;

    // Chapéu sólido
    const hat = document.createElement("div");
    hat.style.cssText = `height:4px;background:${cor};`;
    sec.appendChild(hat);

    // Body
    const body = document.createElement("div");
    body.style.cssText = "background:var(--bg3);";

    // Header da seção
    const secHeader = document.createElement("div");
    secHeader.style.cssText = "display:flex;align-items:center;justify-content:space-between;padding:14px 16px;";
    const secLeft = document.createElement("div");
    secLeft.style.cssText = "display:flex;align-items:center;gap:10px;";
    const pillEl = document.createElement("span");
    pillEl.style.cssText = `font-size:11px;font-weight:700;letter-spacing:1.5px;padding:4px 10px;border-radius:99px;background:${cor}14;color:${cor};border:0.5px solid ${cor}33;`;
    pillEl.textContent = pill;
    const countEl = document.createElement("span");
    countEl.style.cssText = "font-size:11px;color:var(--text3);";
    countEl.textContent = `${docs.length} documentos`;
    const totalEl = document.createElement("div");
    totalEl.style.cssText = `font-size:13px;font-weight:600;color:${cor};`;
    totalEl.textContent = "R$ "+docs.reduce((s,d)=>s+Number(d.valor||0),0).toLocaleString("pt-BR",{minimumFractionDigits:2});
    secLeft.appendChild(pillEl); secLeft.appendChild(countEl);
    secHeader.appendChild(secLeft); secHeader.appendChild(totalEl);
    body.appendChild(secHeader);

    // Lista de documentos — limita exibição inicial pra não virar página infinita
    const docList = document.createElement("div");
    docList.style.cssText = `border-top:0.5px solid var(--sep);`;

    if(!window._confSecExpandida) window._confSecExpandida = {};
    const LIMITE_VISIVEL = 4;
    const expandido = window._confSecExpandida[categoria] || false;
    const docsVisiveis = expandido ? docs : docs.slice(0, LIMITE_VISIVEL);

    docsVisiveis.forEach(doc => {
      const row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:0.5px solid var(--sep);";
      const dot = document.createElement("div");
      dot.style.cssText = `width:7px;height:7px;border-radius:50%;background:${cor};flex-shrink:0;`;
      const info = document.createElement("div");
      info.style.cssText = "flex:1;min-width:0;";
      const nome = document.createElement("div");
      nome.style.cssText = "font-size:12px;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";
      const tipoImp = categoria === "impostos" ? (doc.tipoImposto || detectarTipoImposto(doc.nome)) : "";
      const tituloImposto = tipoImp && doc.uf ? `${tipoImp} ${doc.uf}` : (tipoImp || "");
      nome.textContent = categoria === "impostos" && tituloImposto ? tituloImposto : (doc.prestador || doc.nome);
      nome.title = doc.nome;
      const badges = document.createElement("div");
      badges.style.cssText = "display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;";
      const badgeItems = [];
      if(categoria !== "impostos") {
        if(doc.numeroNF) badgeItems.push(`nº ${doc.numeroNF}`);
        if(doc.competencia) badgeItems.push(doc.competencia);
        if(doc.cnpj) badgeItems.push(doc.cnpj);
      }
      badgeItems.forEach(txt => {
        const b = document.createElement("span");
        b.style.cssText = "font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;background:var(--bg2);border:0.5px solid var(--border2);color:var(--text3);white-space:nowrap;";
        b.textContent = txt;
        badges.appendChild(b);
      });
      info.appendChild(nome); info.appendChild(badges);
      const val = document.createElement("div");
      val.style.cssText = "font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap;";
      val.textContent = "R$ "+Number(doc.valor||0).toLocaleString("pt-BR",{minimumFractionDigits:2});
      const actions = document.createElement("div");
      actions.style.cssText = "display:flex;gap:5px;";
      const btnVer = document.createElement("button");
      btnVer.textContent = "ver";
      if(doc.viewUrl) {
        btnVer.style.cssText = "background:none;border:0.5px solid var(--border2);border-radius:4px;color:var(--text3);font-size:11px;padding:3px 9px;cursor:pointer;font-family:inherit;";
        btnVer.addEventListener("click", () => {
          confVisualizando = confVisualizando === doc.viewUrl ? null : doc.viewUrl;
          renderConferencia(panel, color);
        });
      } else {
        btnVer.style.cssText = "background:none;border:0.5px solid var(--border2);border-radius:4px;color:var(--text3);font-size:11px;padding:3px 9px;cursor:not-allowed;font-family:inherit;opacity:0.3;";
        btnVer.title = "Drive não conectado — sem link de visualização";
        btnVer.disabled = true;
      }
      const btnDel = document.createElement("button");
      btnDel.textContent = "✕";
      btnDel.style.cssText = "background:none;border:0.5px solid #e91e8c22;border-radius:4px;color:#e91e8c66;font-size:11px;padding:3px 7px;cursor:pointer;font-family:inherit;";
      btnDel.addEventListener("click", async () => {
        if(!confirm(`Remover "${doc.nome}"?`)) return;
        await removerDocFirebase(confMes, categoria, doc.id);
        if(confVisualizando === doc.viewUrl) confVisualizando = null;
        confDocs = {servicos:[], impostos:[]};
        renderConferencia(panel, color);
      });
      actions.appendChild(btnVer); actions.appendChild(btnDel);
      row.appendChild(dot); row.appendChild(info); row.appendChild(val); row.appendChild(actions);
      docList.appendChild(row);
    });

    if(docs.length > LIMITE_VISIVEL) {
      const toggleRow = document.createElement("div");
      toggleRow.style.cssText = "padding:10px 16px;border-bottom:0.5px solid var(--sep);";
      const toggleBtn = document.createElement("button");
      toggleBtn.style.cssText = "background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;font-family:inherit;width:100%;text-align:center;padding:4px;";
      toggleBtn.textContent = expandido ? "Ver menos ↑" : `Ver mais ${docs.length - LIMITE_VISIVEL} ↓`;
      toggleBtn.addEventListener("click", () => {
        window._confSecExpandida[categoria] = !expandido;
        renderConferencia(panel, color);
      });
      toggleRow.appendChild(toggleBtn);
      docList.appendChild(toggleRow);
    }

    // Botão de upload — aceita múltiplos arquivos, processados um por vez
    const uploadRow = document.createElement("div");
    uploadRow.style.cssText = "padding:10px 16px;";
    const uploadBtn = document.createElement("button");
    const labelPadrao = `+ Anexar ${categoria === "servicos" ? "notas de serviço" : "guias de imposto"}`;
    uploadBtn.textContent = labelPadrao;
    uploadBtn.style.cssText = "background:none;border:0.5px dashed var(--border2);border-radius:7px;color:var(--text3);font-size:11px;padding:8px 16px;cursor:pointer;font-family:inherit;letter-spacing:1px;width:100%;text-align:center;";
    const fileInput = document.createElement("input");
    fileInput.type = "file"; fileInput.accept = ".pdf"; fileInput.multiple = true; fileInput.style.display = "none";

    // Processa um único arquivo (extração + upload + salvar). Retorna true se salvou direto, false se caiu no formulário manual.
    async function processarUmArquivo(file, idx, total) {
      const prefixo = total > 1 ? `[${idx+1}/${total}] ` : "";
      uploadBtn.textContent = `⏳ ${prefixo}Lendo ${file.name}...`;
      const buf = await file.arrayBuffer();
      const bytes = new Uint8Array(buf);
      let binary = ""; bytes.forEach(b => binary += String.fromCharCode(b));
      const base64pdf = btoa(binary);

      let valor = 0, competencia = detectarCompetencia(file.name) || "";
      try {
        uploadBtn.textContent = `⏳ ${prefixo}Extraindo dados com IA...`;
        const extractResp = await fetch(`${VERCEL_BACKEND}/api/google?action=extractPdf`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ base64: base64pdf, nome: file.name })
        });
        const extracted = await extractResp.json();
        if(extracted.valor > 0) valor = extracted.valor;
        if(extracted.competencia) competencia = extracted.competencia;
        if(extracted.prestador) file._prestador = extracted.prestador;
        if(extracted.numeroNF) file._numeroNF = extracted.numeroNF;
        if(extracted.cnpj) file._cnpj = extracted.cnpj;
        if(extracted.tipoImposto) file._tipoImposto = extracted.tipoImposto;
        if(extracted.uf) file._uf = extracted.uf;
      } catch(e) {
        console.warn("Extração falhou:", e.message);
      }

      if(!valor || valor <= 0 || !competencia) {
        const form = document.createElement("div");
        form.className = "manual-form";
        form.style.cssText = "margin-top:10px;background:var(--bg2);border:0.5px solid #f0b40055;border-radius:8px;padding:12px 14px;";
        form.innerHTML = `
          <div style="font-size:11px;color:#f0b400;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;">
            <span>⚠</span> Não consegui extrair os dados automaticamente de <strong style="color:var(--text2);">${file.name}</strong>
          </div>
          <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
            <div style="flex:1;min-width:100px;">
              <div style="font-size:11px;color:var(--text3);letter-spacing:1px;margin-bottom:4px;">VALOR (R$)</div>
              <input class="manual-valor" placeholder="ex: 1234,56" style="width:100%;background:var(--bg3);border:0.5px solid var(--border2);border-radius:5px;color:var(--text);font-size:12px;padding:6px 10px;font-family:inherit;outline:none;">
            </div>
            <div style="flex:1;min-width:100px;">
              <div style="font-size:11px;color:var(--text3);letter-spacing:1px;margin-bottom:4px;">COMPETÊNCIA</div>
              <input class="manual-comp" placeholder="ex: 06/2026" value="${competencia}" style="width:100%;background:var(--bg3);border:0.5px solid var(--border2);border-radius:5px;color:var(--text);font-size:12px;padding:6px 10px;font-family:inherit;outline:none;">
            </div>
            <button class="manual-ok" style="background:var(--accent);border:none;border-radius:5px;color:#000;font-size:11px;font-weight:700;letter-spacing:1px;padding:7px 14px;cursor:pointer;font-family:inherit;white-space:nowrap;">CONFIRMAR</button>
            <button class="manual-cancel" style="background:none;border:0.5px solid var(--border2);border-radius:5px;color:var(--text3);font-size:11px;padding:7px 10px;cursor:pointer;font-family:inherit;">✕</button>
          </div>
        `;
        form.querySelector(".manual-cancel").addEventListener("click", () => form.remove());
        form.querySelector(".manual-ok").addEventListener("click", async () => {
          const vStr = form.querySelector(".manual-valor").value;
          const v = parseFloat(vStr.replace(",","."));
          const c = form.querySelector(".manual-comp").value.trim();
          if(!v || v <= 0) { form.querySelector(".manual-valor").style.borderColor="#e91e8c"; return; }
          form.remove();
          const driveResult = await uploadParaDrive(file, confMes, categoria);
          await salvarDocFirebase(confMes, categoria, {
            nome: file.name, valor: v, competencia: c,
            driveId: driveResult.driveId||"", driveUrl: driveResult.driveUrl||"",
            viewUrl: driveResult.viewUrl||driveResult.driveUrl||"",
          });
          renderConferencia(panel, color);
        });
        uploadRow.appendChild(form);
        return false;
      }

      let driveId = "", driveUrl = "", viewUrl = "";
      try {
        uploadBtn.textContent = `⏳ ${prefixo}Enviando ${file.name} para o Drive...`;
        const driveResult = await uploadParaDrive(file, confMes, categoria);
        driveId = driveResult.driveId || "";
        driveUrl = driveResult.driveUrl || "";
        viewUrl = driveResult.viewUrl || driveResult.driveUrl || "";
      } catch(e) {
        console.warn("Upload Drive falhou, salvando sem link:", e.message);
      }
      await salvarDocFirebase(confMes, categoria, {
        nome: file.name,
        valor,
        competencia,
        prestador: file._prestador || "",
        numeroNF: file._numeroNF || "",
        cnpj: file._cnpj || "",
        tipoImposto: file._tipoImposto || "",
        uf: file._uf || "",
        driveId,
        driveUrl,
        viewUrl,
      });
      return true;
    }

    fileInput.addEventListener("change", async () => {
      const files = Array.from(fileInput.files || []);
      if(files.length === 0) return;
      uploadBtn.disabled = true;
      let sucessos = 0, comProblema = 0;
      try {
        for(let i = 0; i < files.length; i++) {
          try {
            const ok = await processarUmArquivo(files[i], i, files.length);
            if(ok) sucessos++; else comProblema++;
          } catch(e) {
            console.warn(`Erro no arquivo ${files[i].name}:`, e.message);
            comProblema++;
          }
        }
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = labelPadrao;
        if(comProblema > 0) {
          // Não re-renderiza — mantém os formulários manuais visíveis pro usuário preencher
          setTimeout(() => alert(`${sucessos} anexado(s) automaticamente. ${comProblema} precisam de confirmação manual (formulário acima do botão de anexar).`), 200);
        } else {
          confDocs = {servicos:[], impostos:[]};
          renderConferencia(panel, color);
        }
      }
    });
    uploadBtn.addEventListener("click", () => fileInput.click());
    uploadRow.appendChild(uploadBtn); uploadRow.appendChild(fileInput);
    docList.appendChild(uploadRow);

    body.appendChild(docList);
    sec.appendChild(body);
    panel.appendChild(sec);
  }

  // ── Barra de ações ──────────────────────────────────────────────────────
  if(confDocs.servicos.length > 0 || confDocs.impostos.length > 0) {
    const actBar = document.createElement("div");
    actBar.style.cssText = "display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;";

    // Botão CSV Bling
    const btnCSV = document.createElement("button");
    btnCSV.style.cssText = `background:none;border:1px dashed var(--border2);border-radius:6px;color:var(--text3);font-size:11px;letter-spacing:1px;padding:9px 0;cursor:pointer;font-family:inherit;flex:1;text-align:center;`;
    btnCSV.innerHTML = `↓ Gerar CSV Bling`;
    btnCSV.addEventListener("click", async () => {
      btnCSV.textContent = "⏳ Gerando..."; btnCSV.disabled = true;
      try {
        const nfses = [...confDocs.servicos, ...confDocs.impostos].map(d => ({
          fornecedor: d.prestador || d.nome,
          cnpj: d.cnpj || "",
          valor: d.valor || 0,
          emissao: d.competencia ? `01/${d.competencia.split("/").join("/")}` : "",
          numero: d.numeroNF || ""
        }));
        const resp = await fetch(`${VERCEL_BACKEND}/api/google?action=csv&mes=${confMes}`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({nfses})
        });
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `contas_pagar_${confMes}.csv`; a.click();
        URL.revokeObjectURL(url);
      } catch(e) { alert("Erro ao gerar CSV: "+e.message); }
      btnCSV.innerHTML = `<span>↓</span> Gerar CSV Bling`; btnCSV.disabled = false;
    });

    // Botão Rascunho contador
    const btnEmail = document.createElement("button");
    btnEmail.style.cssText = `background:none;border:1px dashed var(--border2);border-radius:6px;color:var(--text3);font-size:11px;letter-spacing:1px;padding:9px 0;cursor:pointer;font-family:inherit;flex:1;text-align:center;`;
    btnEmail.innerHTML = `✉ Rascunho pro contador`;
    btnEmail.addEventListener("click", async () => {
      btnEmail.textContent = "⏳ Criando rascunho..."; btnEmail.disabled = true;
      try {
        const [ano, mes] = confMes.split("-");
        const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
        const nomeMes = `${MESES[parseInt(mes)-1]} ${ano}`;
        const totalServicos = confDocs.servicos.reduce((s,d)=>s+Number(d.valor||0),0);
        const totalImpostos = confDocs.impostos.reduce((s,d)=>s+Number(d.valor||0),0);
        const totalGeral = totalServicos + totalImpostos;

        let corpo = `Olá Leonardo,

Segue o resumo das notas fiscais de ${nomeMes} para lançamento.

`;

        if(confDocs.servicos.length > 0) {
          corpo += `NOTAS DE SERVIÇO
${"─".repeat(40)}
`;
          confDocs.servicos.forEach(d => {
            corpo += `• ${d.prestador || d.nome}`;
            if(d.numeroNF) corpo += ` — NF nº ${d.numeroNF}`;
            if(d.competencia) corpo += ` (${d.competencia})`;
            corpo += ` — R$ ${(d.valor||0).toLocaleString("pt-BR",{minimumFractionDigits:2})}
`;
          });
          corpo += `Total serviços: R$ ${totalServicos.toLocaleString("pt-BR",{minimumFractionDigits:2})}

`;
        }

        if(confDocs.impostos.length > 0) {
          corpo += `IMPOSTOS
${"─".repeat(40)}
`;
          confDocs.impostos.forEach(d => {
            corpo += `• ${d.nome}`;
            if(d.competencia) corpo += ` (${d.competencia})`;
            corpo += ` — R$ ${(d.valor||0).toLocaleString("pt-BR",{minimumFractionDigits:2})}
`;
          });
          corpo += `Total impostos: R$ ${totalImpostos.toLocaleString("pt-BR",{minimumFractionDigits:2})}

`;
        }

        corpo += `TOTAL GERAL: R$ ${totalGeral.toLocaleString("pt-BR",{minimumFractionDigits:2})}

Atenciosamente,
Digoo Brasil`;

        const resp = await fetch(`${VERCEL_BACKEND}/api/google?action=rascunho`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({
            para: "geancarlo@resicontabilidade.com.br",
            assunto: `NFs para lançamento — ${nomeMes}`,
            corpo
          })
        });
        const d = await resp.json();
        if(d.ok) {
          btnEmail.innerHTML = `✓ Rascunho criado no Gmail`;
          setTimeout(()=>{ btnEmail.innerHTML = `<span>✉</span> Rascunho pro contador`; btnEmail.disabled = false; }, 3000);
        } else throw new Error(d.error || "Erro desconhecido");
      } catch(e) {
        alert("Erro ao criar rascunho: "+e.message);
        btnEmail.innerHTML = `<span>✉</span> Rascunho pro contador`;
        btnEmail.disabled = false;
      }
    });

    actBar.appendChild(btnCSV);
    actBar.appendChild(btnEmail);
    panel._actBar = actBar;
  }

  renderSecao("Notas de Serviço", servicosFiltrados, "#8b5cf6", "Notas de Serviço", "servicos");
  renderSecao("Impostos", impostosFiltrados, "#10b981", "Impostos", "impostos");

  if(panel._actBar) panel.appendChild(panel._actBar);
}
// ─── FIM CONFERÊNCIA FINANCEIRA ────────────────────────────────────────────

</script>
  <script src="claude-chat.js"></script>
</body>
</html>
